        await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)))

function requestText(value){return String(value==null?"":value).trim()}

function activeInboundRequests(){
  return (Array.isArray(state?.purchaseRequests)?state.purchaseRequests:[]).filter(function(row){

function inboundRequestForPo(poNo){

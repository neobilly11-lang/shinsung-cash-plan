function selectedBatchStockMoveRows(){const rows=batchStockMoveRows(),ids=new Set(rows.map(row=>row.bag.id));for(const id of [...batchStockMoveSelected])if(!ids.has(id))batchStockMoveSelected.delete(id);return rows.filter(row=>batchStockMoveSelected.has(row.bag.id))}

async function confirmBatchStockMove(){if(batchStockMoveSaving)return;const selected=selectedBatchStockMoveRows(),to=String(E('moveLocation')?.value||'').trim();if(!selected.length)return msg('moveInfo','이동할 완료재고를 검색하여 한 건 이상 체크하세요.',true);if(!state.locations.includes(to))return msg('moveInfo','이동 후 장소를 검색하여 저장된 장소 중에서 선택하세요.',true);const moving=selected.filter(row=>row.location!==to);if(!moving.length)return msg('moveInfo','선택한 완료재고가 모두 이미 '+to+'에 있습니다.',true);const backup=JSON.parse(JSON.stringify(state)),batchId=crypto.randomUUID(),createdAt=new Date().toISOString();batchStockMoveSaving=true;if(E('batchStockMoveConfirm'))E('batchStockMoveConfirm').disabled=true;try{for(const row of moving){state.movements.push({id:crypto.randomUUID(),batchId,bagId:row.bag.id,completionNo:row.completionNo,from:row.location,to,weight:row.weight,createdAt});row.bag.location=to}state.auditLogs.push({id:crypto.randomUUID(),action:'BATCH_STOCK_MOVE',batchId,bagIds:moving.map(row=>row.bag.id),completionNos:moving.map(row=>row.completionNo),to,weight:moving.reduce((sum,row)=>sum+row.weight,0),createdAt});await saveState();batchStockMoveSelected.clear();E('moveLocation').value='';renderRepack();renderInventory();msg('moveInfo',`${moving.length}건 · 총 ${kg(moving.reduce((sum,row)=>sum+row.weight,0))}을 ${to}(으)로 일괄 이동했습니다.${moving.length<selected.length?' 이미 같은 장소인 '+(selected.length-moving.length)+'건은 제외했습니다.':''}`)}catch(error){state=defaults(backup);renderAll();msg('moveInfo','재고 일괄 이동 실패: '+error.message,true)}finally{batchStockMoveSaving=false;if(E('batchStockMoveConfirm'))E('batchStockMoveConfirm').disabled=false}}

<!doctype html><meta charset="utf-8"><title>포장대기 2품목 정리</title>
<style>body{font-family:Malgun Gothic,sans-serif;max-width:820px;margin:30px auto;padding:18px}button{font-size:22px;padding:18px;border:0;border-radius:12px;background:#0d725d;color:white}pre{white-space:pre-wrap;background:#f3f7f5;padding:16px;border-radius:12px}.err{color:#a72d2d}</style>
<h1>기존 포장대기 2품목 정리</h1><pre id="out">불러오는 중…</pre><button id="run" disabled>확인된 2품목 삭제 처리</button>
<script>
let remote,state,active,groups;
const out=document.getElementById('out'),run=document.getElementById('run');
async function load(){const r=await fetch('/api/scrap-state',{cache:'no-store'});remote=await r.json();if(!r.ok)throw Error(remote.error||'HTTP '+r.status);state=remote.payload||{};active=(state.waitingMoves||[]).filter(x=>x.status!=='CANCELLED');groups=new Set(active.map(x=>x.packageNo+'|'+(x.grade||'*')));const safe=active.length===3&&groups.size===2&&active.every(x=>x.packageNo==='P000003'&&x.to==='L605VS');out.textContent='화면 표시 품목: '+groups.size+'품목\n내부 원본기록: '+active.length+'건\n\n'+active.map((x,i)=>[i+1,x.packageNo,x.grade,x.weight+' kg',x.to].filter(Boolean).join(' · ')).join('\n');run.disabled=!safe;if(!safe){out.className='err';out.textContent+='\n\n안전조건이 맞지 않아 실행하지 않습니다.'}}
run.onclick=async()=>{run.disabled=true;if(active.length!==3||groups.size!==2)return;const now=new Date().toISOString(),ids=new Set(active.map(x=>x.id));const waitingMoves=(state.waitingMoves||[]).map(x=>ids.has(x.id)?{...x,status:'CANCELLED',cancelledAt:now,cancellationReason:'기존 포장대기 2품목 자료 정리'}:x);const auditLogs=[...(state.auditLogs||[]),...active.map(x=>({id:crypto.randomUUID(),action:'LEGACY_PACKING_WAIT_DELETE',packageNo:x.packageNo,waitingMoveId:x.id,grade:x.grade,weight:x.weight,reason:'기존 프로세스 포장대기 2품목 정리',createdAt:now}))];const r=await fetch('/api/scrap-state',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({changes:{waitingMoves,auditLogs},baseRevision:remote.revision})});const j=await r.json();if(!r.ok)throw Error(j.error||'HTTP '+r.status);out.textContent='삭제 처리 완료: 화면 표시 2품목 · 내부 원본 3건\n감사기록 저장 완료\n새 revision: '+j.revision;run.remove()}
load().catch(e=>{out.className='err';out.textContent='조회 실패: '+e.message});
</script>

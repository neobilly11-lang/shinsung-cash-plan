<style>

.content{padding:24px;max-width:1900px;margin:auto}.dashboard-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.dashboard-head h1{margin:0;font-size:29px}.dashboard-head p{margin:7px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:11px 16px;border-radius:10px;font-weight:800;cursor:pointer}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{background:#fff0f1;border-color:#ffc6cc;color:#b5303c}.btn:disabled{opacity:.55;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:13px;margin-bottom:18px}.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.kpi small{color:var(--muted);font-weight:800}.kpi strong{display:block;font-size:27px;margin-top:8px}.kpi span{display:block;margin-top:5px;font-size:12px;color:#169683}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.toolbar{padding:15px;display:grid;grid-template-columns:repeat(5,minmax(130px,1fr)) auto auto;gap:9px;border-bottom:1px solid var(--line);background:#fbfcfe}.control{min-width:0}.control label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin:0 0 5px 2px}.control input,.control select{width:100%;height:42px;border:1px solid #cbd5e1;border-radius:9px;padding:0 11px;background:#fff}.table-wrap{overflow:auto;max-height:calc(100vh - 310px)}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px;font-size:13px}th,td{padding:11px 10px;border-right:1px solid #e5e9ef;border-bottom:1px solid #e5e9ef;white-space:nowrap;text-align:center}th{position:sticky;top:0;background:#eef3f8;color:#34465d;z-index:2;font-weight:900}td.left{text-align:left}.link{color:#246bb1;text-decoration:underline;cursor:pointer;font-weight:800}.total-row{position:sticky;bottom:0;background:#e9eef4;font-weight:900}.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2f7;color:#526175;font-size:11px;font-weight:900}.status.good{background:#e3f6ee;color:#087452}.status.wait{background:#fff3d9;color:#936200}.status.bad{background:#ffe6e8;color:#a52e38}.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.cards{display:none}.mobile-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}.mobile-card h3{margin:0 0 10px}.mobile-card dl{display:grid;grid-template-columns:110px 1fr;margin:0;font-size:13px}.mobile-card dt,.mobile-card dd{margin:0;padding:7px 0;border-top:1px solid #edf0f4}.mobile-card dt{color:var(--muted);font-weight:800}.mobile-card dd{text-align:right;font-weight:700}.mobile-card button{width:100%;margin-top:10px}
.modal{position:fixed;inset:0;background:#071525a8;display:none;place-items:center;padding:18px;z-index:100}.modal.on{display:grid}.modal-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 30px 90px #0006}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.modal-head h2{margin:0}.close{border:0;background:#eef2f7;width:42px;height:42px;border-radius:10px;font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.form-grid label{font-size:13px;font-weight:800;color:#566477}.form-grid input,.form-grid select,.form-grid textarea{display:block;width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px;padding:11px;color:var(--text);background:#fff}.form-grid textarea{min-height:95px;resize:vertical}.wide{grid-column:1/-1}.save-progress{position:fixed;inset:0;z-index:200;background:#102542cc;color:#fff;display:none;place-items:center;text-align:center}.save-progress.on{display:grid}.spinner{width:55px;height:55px;border:6px solid #ffffff42;border-top-color:#48ddce;border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;right:22px;bottom:22px;background:#163a33;color:#fff;padding:14px 18px;border-radius:12px;z-index:210;box-shadow:var(--shadow);opacity:0;transform:translateY(15px);transition:.25s}.toast.on{opacity:1;transform:none}
.auth{position:fixed;inset:0;background:linear-gradient(145deg,#0a263f,#145a66);z-index:300;display:none;place-items:center;padding:18px}.auth.on{display:grid}.auth-card{width:min(460px,100%);background:#fff;border-radius:22px;padding:27px;box-shadow:0 30px 90px #0005}.auth-card h1{margin:0;font-size:30px}.auth-card p{color:var(--muted)}.auth-card label{display:block;margin-top:13px;font-weight:800}.auth-card input{width:100%;height:54px;margin-top:7px;border:2px solid #ccd7e2;border-radius:12px;padding:0 13px;font-size:17px}.auth-card .btn{width:100%;margin-top:15px;min-height:54px}.auth-msg{margin-top:12px;color:var(--danger);font-weight:800}
@media(max-width:1100px){.shell{grid-template-columns:220px minmax(0,1fr)}.toolbar{grid-template-columns:repeat(3,1fr) auto}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.shell{display:block}.side{position:fixed;left:-280px;width:270px;transition:.22s;box-shadow:20px 0 50px #0004}.side.on{left:0}.top{height:64px;padding:0 12px}.menu-toggle{display:block}.page-title{font-size:18px}.sync{padding:8px 10px;font-size:12px}.sync span{display:none}.user{max-width:105px;overflow:hidden;text-overflow:ellipsis}.content{padding:14px}.dashboard-head{display:block}.dashboard-head .actions{margin-top:13px}.kpis{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:14px}.kpi strong{font-size:22px}.toolbar{grid-template-columns:1fr 1fr;padding:11px}.toolbar .btn{width:100%}.table-wrap{display:none}.cards{display:grid;gap:10px;padding:10px;background:var(--bg)}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.modal-card{padding:17px}.brand strong{font-size:21px}}
@media(max-width:420px){.kpis{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.sync{display:none}}
</style>

<body>
<div id="auth" class="auth"><div class="auth-card"><h1>신성금속 MES</h1><p>현장관리와 같은 계정으로 로그인하세요.</p><label>이름 또는 이메일<input id="loginId" autocomplete="username" placeholder="등록한 이름 또는 이메일"></label><label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password"></label><label style="display:flex;gap:8px;align-items:center"><input id="remember" type="checkbox" checked style="width:22px;height:22px;margin:0"> 자동접속 유지</label><button class="btn primary" onclick="login()">로그인·접속</button><button class="btn" onclick="location.href='/stable-inspection-mobile-v4.html'">사용자 등록·비밀번호 찾기</button><div id="authMsg" class="auth-msg"></div></div></div>
<div class="shell">
<aside id="side" class="side"><div class="brand" onclick="openView('dashboard')" style="cursor:pointer"><strong>신성금속 MES</strong><span>현장관리 실시간 연동 시스템</span></div><div id="nav"></div><button class="nav-btn field-link" onclick="location.href='/stable-inspection-mobile-v4.html'"><b>↗</b> 현장관리 열기</button></aside>
<main class="main"><header class="top"><button class="menu-toggle" onclick="side.classList.toggle('on')">☰</button><div id="pageTitle" class="page-title">통합 현황판</div><div id="sync" class="sync"><b>●</b><span>공용 서버 연결 중</span></div><button id="user" class="user" onclick="logout()">로그인</button></header><div id="content" class="content"></div></main>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">자료 수정</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<div id="progress" class="save-progress"><div><div class="spinner"></div><h2>공용 서버에 저장 중</h2><p>현장관리와 MES에 동시에 반영하고 있습니다.</p></div></div><div id="toast" class="toast"></div>
<script>
const API='https://orpeybiqikrdydkhsjjs.supabase.co',KEY='sb_publishable_TerLvPZo7e5_X91A-P4qlQ_DaqBly0Q';
const AUTH_LOCAL_KEY='scrap-auth-session-v1',AUTH_TEMP_KEY='scrap-auth-session-temp-v1',AUTH_NAME_MAP_KEY='scrap-auth-name-email-v1';
const VIEWS=[
 {group:'계획관리',id:'purchase',icon:'01',label:'구매계획'}, {group:'계획관리',id:'sales',icon:'02',label:'판매계획'},
 {group:'입고·생산',id:'inbound',icon:'03',label:'입고현황'}, {group:'입고·생산',id:'production',icon:'04',label:'생산현황'},
 {group:'입고·생산',id:'settlement',icon:'05',label:'세틀현황'}, {group:'재고·출하',id:'inventory',icon:'06',label:'재고현황'},
 {group:'재고·출하',id:'stockDetail',icon:'07',label:'재고상세'}, {group:'재고·출하',id:'shippingPlan',icon:'08',label:'출하계획'},
 {group:'재고·출하',id:'shipping',icon:'09',label:'출고현황'}, {group:'기록',id:'daily',icon:'10',label:'일일 작업일지'}
];
let state={},revision=0,currentView='dashboard',filters={},authSession=null,authUser=null,pollBusy=false,lastLoad=0;
const $=id=>document.getElementById(id),safe=value=>Array.isArray(value)?value:[],num=value=>Number(value)||0,esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=value=>num(value).toLocaleString('ko-KR',{maximumFractionDigits:2}),date=value=>String(value||'').slice(0,10)||'-',dt=value=>String(value||'').replace('T',' ').slice(0,16)||'-';
const nowDate=()=>new Date().toLocaleDateString('sv-SE'),currentUserName=()=>String(authUser?.user_metadata?.display_name||authUser?.user_metadata?.name||authUser?.email?.split('@')[0]||'MES 사용자');
function defaults(x={}){return{pos:[],splits:[],inputs:[],bags:[],losses:[],workWaits:[],salesOrders:[],packingLists:[],shipments:[],shipmentAllocations:[],returnReceipts:[],domesticReceipts:[],movements:[],waitingMoves:[],receiptWorks:[],shippingWorks:[],auditLogs:[],locations:[],mainGrades:[],subGrades:[],...x}}
function authMap(){try{return JSON.parse(localStorage.getItem(AUTH_NAME_MAP_KEY)||'{}')}catch{return{}}}function resolveEmail(v){v=String(v||'').trim();return v.includes('@')?v.toLowerCase():authMap()[v.toLowerCase()]||''}
async function authRequest(path,opt={}){const r=await fetch(`${API}/auth/v1/${path}`,{method:opt.method||'GET',headers:{apikey:KEY,'Content-Type':'application/json',...(opt.token?{Authorization:`Bearer ${opt.token}`}:{})},body:opt.body?JSON.stringify(opt.body):undefined}),text=await r.text();let out={};try{out=JSON.parse(text||'{}')}catch{out={message:text}}if(!r.ok)throw Error(out.message||out.error_description||out.error||`인증 HTTP ${r.status}`);return out}
function saveSession(session,remember){localStorage.removeItem(AUTH_LOCAL_KEY);sessionStorage.removeItem(AUTH_TEMP_KEY);(remember?localStorage:sessionStorage).setItem(remember?AUTH_LOCAL_KEY:AUTH_TEMP_KEY,JSON.stringify({...session,remember}))}
function savedSession(){for(const [store,key] of [[localStorage,AUTH_LOCAL_KEY],[sessionStorage,AUTH_TEMP_KEY]])try{const x=JSON.parse(store.getItem(key)||'null');if(x?.access_token)return x}catch{}return null}
async function login(){const email=resolveEmail($('loginId').value),password=$('loginPassword').value;if(!email||!password)return $('authMsg').textContent='등록한 이메일과 비밀번호를 입력하세요.';$('authMsg').textContent='로그인 확인 중…';try{const s=await authRequest('token?grant_type=password',{method:'POST',body:{email,password}});unlock(s,s.user||await authRequest('user',{token:s.access_token}),$('remember').checked)}catch(e){$('authMsg').textContent='로그인 실패: '+e.message}}
function unlock(session,user,remember=true){authSession=session;authUser=user;saveSession(session,remember);$('auth').classList.remove('on');$('user').textContent='👤 '+currentUserName()+' · 로그아웃';loadState(true)}
async function initAuth(){if(['localhost','127.0.0.1'].includes(location.hostname)){return unlock({access_token:'test'},{id:'test',email:'mes@local',user_metadata:{display_name:'MES 테스트'}},false)}const session=savedSession();if(session)try{let user;try{user=await authRequest('user',{token:session.access_token})}catch{const next=await authRequest('token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}});Object.assign(session,next);user=next.user||await authRequest('user',{token:session.access_token})}return unlock(session,user,session.remember!==false)}catch{}$('auth').classList.add('on')}
async function logout(){try{if(authSession?.access_token)await authRequest('logout?scope=local',{method:'POST',token:authSession.access_token})}catch{}localStorage.removeItem(AUTH_LOCAL_KEY);sessionStorage.removeItem(AUTH_TEMP_KEY);location.reload()}
async function readState(){const r=await fetch('/api/scrap-state',{cache:'no-store'}),out=await r.json();if(!r.ok)throw Error(out.error||`서버 HTTP ${r.status}`);return out}
async function readRevision(){const r=await fetch('/api/scrap-state?revision=1',{cache:'no-store'}),out=await r.json();if(!r.ok)throw Error(out.error||`서버 HTTP ${r.status}`);return num(out.revision)}
function setSync(text,bad=false){$('sync').classList.toggle('bad',bad);$('sync').innerHTML=`<b>●</b><span>${esc(text)}</span>`}
async function loadState(shouldRender=true){try{setSync('공용 서버 동기화 중');const out=await readState();state=defaults(out.payload);revision=num(out.revision);lastLoad=Date.now();setSync('실시간 연결 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));if(shouldRender)render()}catch(e){setSync('서버 연결 실패',true);toast(e.message,true)}}
async function realtimePoll(){if(pollBusy||document.hidden||!authUser||$('progress').classList.contains('on'))return;pollBusy=true;try{const remote=await readRevision();if(remote>revision)await loadState(true)}catch(e){setSync('재연결 대기',true)}finally{pollBusy=false}}
async function commit(label,collections,mutate){$('progress').classList.add('on');try{for(let attempt=0;attempt<3;attempt++){const latest=await readState(),draft=defaults(structuredClone(latest.payload));mutate(draft);const changes={};collections.forEach(key=>changes[key]=draft[key]);const audit={id:crypto.randomUUID(),action:'MES_UPDATE',label,operatorName:currentUserName(),operatorEmail:authUser?.email||'',createdAt:new Date().toISOString()};changes.auditLogs=[...safe(draft.auditLogs),audit];const r=await fetch('/api/scrap-state',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({changes,baseRevision:num(latest.revision)})}),out=await r.json();if(r.status===409)continue;if(!r.ok)throw Error(out.error||`저장 HTTP ${r.status}`);await loadState(true);toast(label+' 저장 완료 · 현장관리에도 반영됨');return}throw Error('동시 저장 충돌이 반복되었습니다. 잠시 후 다시 저장하세요.')}catch(e){toast(label+' 실패: '+e.message,true)}finally{$('progress').classList.remove('on')}}
function toast(text,bad=false){const t=$('toast');t.textContent=text;t.style.background=bad?'#a52e38':'#163a33';t.classList.add('on');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('on'),3500)}
function buildNav(){let html='<div class="nav-group"><button class="nav-btn" data-id="dashboard" onclick="openView(\'dashboard\')"><b>⌂</b> 통합 현황판</button></div>',group='';VIEWS.forEach(v=>{if(group!==v.group){group=v.group;html+=`<div class="nav-group"><div class="nav-title">${group}</div>`}html+=`<button class="nav-btn" data-id="${v.id}" onclick="openView('${v.id}')"><b>${v.icon}</b> ${v.label}</button>`;if(VIEWS[VIEWS.indexOf(v)+1]?.group!==group)html+='</div>'});$('nav').innerHTML=html}
function openView(id){currentView=id;filters={};$('side').classList.remove('on');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('on',b.dataset.id===id));render();history.replaceState(null,'','#'+id)}
function groupBy(rows,key){const map=new Map;rows.forEach(r=>{const k=typeof key==='function'?key(r):r[key]||'미지정';if(!map.has(k))map.set(k,[]);map.get(k).push(r)});return map}
function packageUsed(no){return safe(state.splits).filter(x=>x.packageNo===no&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)+safe(state.losses).filter(x=>x.packageNo===no&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)}
function bagCode(b){return b.completionNo||b.bagNo||b.code||b.id}function bagWeight(b){return num(b.netWeight||b.nw||b.weight)}function activeBags(){return safe(state.bags).filter(b=>!['DEPLETED','SHIPPED','CANCELLED'].includes(b.status)&&bagWeight(b)>0)}
function poRows(){return[...groupBy(safe(state.pos).filter(p=>p.status!=='CANCELLED'),p=>p.poNo||'미지정')].map(([poNo,rows])=>({id:poNo,poNo,rows,company:rows[0]?.company||'',grade:[...new Set(rows.map(x=>x.grade).filter(Boolean))].join(' / '),packages:rows.length,gw:rows.reduce((s,x)=>s+num(x.grossWeight||x.weight),0),nw:rows.reduce((s,x)=>s+num(x.netWeight||x.weight),0),expected:rows[0]?.expectedArrivalDate||rows[0]?.arrivalDate||rows[0]?.createdAt,status:rows.every(x=>x.receivedAt)?'입고완료':rows.some(x=>x.receivedAt)?'부분입고':rows[0]?.purchaseStatus||'입고대기',currency:rows[0]?.currency||((rows[0]?.type||'').includes('DOMESTIC')?'KRW':'USD'),rate:num(rows[0]?.exchangeRate)||1}))}
function salesRows(){return safe(state.salesOrders).filter(x=>x.status!=='CANCELLED').map(x=>({id:x.id,soNo:x.soNo,customer:x.customer,grade:x.grade,weight:num(x.weight),shipDate:x.shipDate,status:x.status||'WAITING',type:x.packingListType==='OVERSEAS'?'수출':'국내',currency:x.currency||((x.packingListType==='OVERSEAS')?'USD':'KRW'),amount:num(x.amount||x.salesAmount)}))}
function inboundRows(){return safe(state.pos).filter(x=>x.status!=='CANCELLED').map(x=>({id:x.id,packageNo:x.packageNo,poNo:x.poNo,company:x.company,grade:x.grade,planWeight:num(x.weight),receivedWeight:num(x.netWeight||x.weight),receivedAt:x.receivedAt,status:x.receiptStatus||(!x.receivedAt?'WAITING':'RECEIVED'),inspection:x.inspectionStatus||'WAITING',memo:x.receiptMemo||''}))}
function productionRows(){const splitByPackage=groupBy(safe(state.splits).filter(x=>x.status!=='CANCELLED'),'packageNo');return inboundRows().map(p=>{const splits=splitByPackage.get(p.packageNo)||[],confirmed=splits.reduce((s,x)=>s+num(x.weight),0),loss=safe(state.losses).filter(x=>x.packageNo===p.packageNo&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0),wait=safe(state.workWaits).filter(x=>x.packageNo===p.packageNo&&x.status==='WAITING').reduce((s,x)=>s+num(x.weight),0);return{...p,confirmed,loss,wait,remain:Math.max(0,p.planWeight-confirmed-loss),finalGrade:[...new Set(splits.map(x=>[x.productType,x.mainGrade,x.subGrade,x.detailGrade].filter(Boolean).join(' · ')))].join(' / ')}})}
function inventoryRows(){return activeBags().map(b=>({id:b.id,code:bagCode(b),productType:b.productType||'',mainGrade:b.mainGrade||b.grade||'',subGrade:b.subGrade||'',detailGrade:b.detailGrade||'',nw:bagWeight(b),packing:num(b.packagingWeight||b.tareWeight),gw:bagWeight(b)+num(b.packagingWeight||b.tareWeight),location:b.location||'미지정',status:b.status||'ACTIVE',packageNo:b.packageNo||b.sourcePackageNo||''}))}
function shipmentRows(){const maps=new Map(safe(state.shipments).map(x=>[x.salesOrderId,x]));return salesRows().map(s=>{const x=maps.get(s.id)||safe(state.shipments).find(y=>y.soNo===s.soNo)||{};return{...s,shipmentId:x.id||'',shippedWeight:num(x.weight||x.shippedWeight),shippedAt:x.shippedAt||x.shippingCompletedAt,status:x.status||s.status,packingList:safe(state.packingLists).find(p=>p.salesOrderId===s.id&&p.status!=='CANCELLED')?.packingListNo||''}})}
function settlementRows(){return poRows().map(po=>{const items=productionRows().filter(x=>x.poNo===po.poNo),done=items.filter(x=>x.remain<=.001).length,progress=items.length?Math.round(done/items.length*100):0;return{...po,progress,done,total:items.length,status:progress===100?'완료':'미완료',loss:items.reduce((s,x)=>s+x.loss,0),inspected:items.reduce((s,x)=>s+x.confirmed,0)}})}
function dashboard(){const pos=inboundRows(),prod=productionRows(),inv=inventoryRows(),sales=salesRows();return`<div class="dashboard-head"><div><h1>신성금속 통합 생산현황</h1><p>현장관리와 동일한 공용자료를 실시간으로 집계합니다.</p></div><div class="actions"><button class="btn" onclick="loadState()">↻ 지금 동기화</button><button class="btn primary" onclick="openView('daily')">오늘 작업일지</button></div></div><div class="kpis">${kpi('입고대기',pos.filter(x=>!x.receivedAt).length+'건',fmt(pos.filter(x=>!x.receivedAt).reduce((s,x)=>s+x.planWeight,0))+' kg')}${kpi('생산대기',fmt(prod.reduce((s,x)=>s+x.remain,0))+' kg','검수·작업 미완료')}${kpi('완료재고',fmt(inv.reduce((s,x)=>s+x.nw,0))+' kg',inv.length+'개 포장')}${kpi('출하대기',sales.filter(x=>!['FINAL','SHIPPED','DONE'].includes(x.status)).length+'건',fmt(sales.reduce((s,x)=>s+x.weight,0))+' kg 계획')}${kpi('오늘 작업',todayAudits().length+'건',currentUserName())}</div><div class="panel"><div style="padding:18px"><h2 style="margin:0 0 15px">공정별 중량</h2><div class="kpis">${kpi('입고대기',fmt(prod.reduce((s,x)=>s+x.remain,0))+' kg','원재고')}${kpi('작업대기',fmt(prod.reduce((s,x)=>s+x.wait,0))+' kg','쇼트·산처리·절단')}${kpi('완료포장',fmt(inv.reduce((s,x)=>s+x.nw,0))+' kg','출하 가능')}${kpi('출하완료',fmt(shipmentRows().reduce((s,x)=>s+x.shippedWeight,0))+' kg','누적')}${kpi('로스',fmt(prod.reduce((s,x)=>s+x.loss,0))+' kg','누적 처리')}</div></div></div>`}
function kpi(label,value,note){return`<div class="kpi"><small>${esc(label)}</small><strong>${esc(value)}</strong><span>${esc(note)}</span></div>`}
const schemas={
 purchase:{title:'구매계획',rows:poRows,cols:[['구분',r=>r.currency==='KRW'?'국내':'국외'],['구매번호',r=>r.poNo,'link'],['입고예정일',r=>date(r.expected)],['공급사',r=>r.company,'left'],['대표강종',r=>r.grade,'left'],['패키지',r=>r.packages],['GW(kg)',r=>fmt(r.gw)],['NW(kg)',r=>fmt(r.nw)],['통화',r=>r.currency],['환율',r=>fmt(r.rate)],['구매상태',r=>status(r.status)]],edit:'purchase'},
 sales:{title:'판매계획',rows:salesRows,cols:[['판매구분',r=>r.type],['판매번호',r=>r.soNo,'link'],['출하예정일',r=>date(r.shipDate)],['고객사',r=>r.customer,'left'],['대표강종',r=>r.grade,'left'],['NW(kg)',r=>fmt(r.weight)],['통화',r=>r.currency],['판매금액',r=>fmt(r.amount)],['상태',r=>status(r.status)]],edit:'sales'},
 inbound:{title:'입고현황',rows:inboundRows,cols:[['구매번호',r=>r.poNo],['사내입고번호',r=>r.packageNo,'link'],['공급사',r=>r.company,'left'],['강종',r=>r.grade,'left'],['계획NW(kg)',r=>fmt(r.planWeight)],['입고NW(kg)',r=>fmt(r.receivedWeight)],['입고일',r=>date(r.receivedAt)],['입고상태',r=>status(r.status)],['검수상태',r=>status(r.inspection)]],edit:'inbound'},
 production:{title:'생산현황',rows:productionRows,cols:[['구매번호',r=>r.poNo],['사내입고번호',r=>r.packageNo,'link'],['공급사',r=>r.company,'left'],['거래처강종',r=>r.grade,'left'],['최종강종',r=>r.finalGrade||'-','left'],['입고NW',r=>fmt(r.planWeight)],['검수확정',r=>fmt(r.confirmed)],['작업대기',r=>fmt(r.wait)],['로스',r=>fmt(r.loss)],['미처리',r=>fmt(r.remain)],['진행',r=>status(r.remain<=.001?'완료':'진행중')]],edit:null},
 settlement:{title:'세틀현황',rows:settlementRows,cols:[['구매번호',r=>r.poNo,'link'],['공급사',r=>r.company,'left'],['대표강종',r=>r.grade,'left'],['입고NW',r=>fmt(r.nw)],['검수확정',r=>fmt(r.inspected)],['로스',r=>fmt(r.loss)],['완료/전체',r=>`${r.done}/${r.total}`],['진행률',r=>r.progress+'%'],['세틀상태',r=>status(r.status)]],edit:'settlement'},
 inventory:{title:'재고현황',rows:()=>{const map=groupBy(inventoryRows(),r=>[r.productType,r.mainGrade,r.subGrade].join('|'));return[...map].map(([key,rows])=>({id:key,productType:rows[0].productType,mainGrade:rows[0].mainGrade,subGrade:rows[0].subGrade,shipping:0,stock:rows.reduce((s,x)=>s+x.nw,0),packing:rows.length,locations:[...new Set(rows.map(x=>x.location))].join(' / ')}))},cols:[['품종',r=>r.productType||'-'],['강종',r=>r.mainGrade,'left'],['소강종',r=>r.subGrade||'-'],['완료재고(kg)',r=>fmt(r.stock)],['완료포장',r=>r.packing+'개'],['보관위치',r=>r.locations,'left']],edit:null},
 stockDetail:{title:'재고상세',rows:inventoryRows,cols:[['품번',r=>r.code,'link'],['품종',r=>r.productType||'-'],['강종',r=>r.mainGrade,'left'],['소강종',r=>r.subGrade||'-'],['상세강종',r=>r.detailGrade||'-','left'],['N/W(kg)',r=>fmt(r.nw)],['포장재중량',r=>fmt(r.packing)],['G/W(kg)',r=>fmt(r.gw)],['보관위치',r=>r.location],['상태',r=>status(r.status)]],edit:'inventory'},
 shippingPlan:{title:'출하계획',rows:salesRows,cols:[['판매구분',r=>r.type],['판매번호',r=>r.soNo,'link'],['출하예정일',r=>date(r.shipDate)],['고객사',r=>r.customer,'left'],['대표강종',r=>r.grade,'left'],['NW(kg)',r=>fmt(r.weight)],['통화',r=>r.currency],['판매금액',r=>fmt(r.amount)],['출하상태',r=>status(r.status)]],edit:'sales'},
 shipping:{title:'출고현황',rows:shipmentRows,cols:[['판매구분',r=>r.type],['판매번호',r=>r.soNo,'link'],['대표강종',r=>r.grade,'left'],['출하예정일',r=>date(r.shipDate)],['고객사',r=>r.customer,'left'],['계획NW(kg)',r=>fmt(r.weight)],['출하NW(kg)',r=>fmt(r.shippedWeight)],['출하상태',r=>status(r.status)],['출하일자',r=>date(r.shippedAt)],['PACKING LIST',r=>r.packingList||'-']],edit:'shipping'}
};
function status(value){const s=String(value||'-'),good=/완료|RECEIVED|COMPLETE|FINAL|SHIPPED|DONE|ACTIVE/.test(s),bad=/취소|CANCEL/.test(s);return`<span class="status ${bad?'bad':good?'good':'wait'}">${esc(s)}</span>`}
function todayAudits(){return safe(state.auditLogs).filter(x=>date(x.createdAt)===nowDate())}
function render(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('on',b.dataset.id===currentView));if(currentView==='dashboard'){$('pageTitle').textContent='통합 현황판';$('content').innerHTML=dashboard();return}if(currentView==='daily'){renderDaily();return}const schema=schemas[currentView]||schemas.purchase;$('pageTitle').textContent=schema.title;let rows=filtered(schema.rows()),html=`<div class="dashboard-head"><div><h1>${schema.title}</h1><p>현장관리 공용자료 · ${rows.length.toLocaleString()}건</p></div><div class="actions"><button class="btn" onclick="loadState()">↻ 조회</button><button class="btn primary" onclick="exportView()">엑셀</button></div></div><div class="panel"><div class="toolbar">${filterControls()}<button class="btn primary" onclick="render()">조회</button><button class="btn" onclick="filters={};render()">초기화</button></div>${tableHtml(schema,rows)}${cardsHtml(schema,rows)}</div>`;$('content').innerHTML=html}
function filterControls(){return`<div class="control"><label>통합 검색</label><input value="${esc(filters.q||'')}" placeholder="번호·회사·강종·장소" oninput="filters.q=this.value;renderRowsOnly()"></div><div class="control"><label>시작일</label><input type="date" value="${esc(filters.from||'')}" onchange="filters.from=this.value;renderRowsOnly()"></div><div class="control"><label>종료일</label><input type="date" value="${esc(filters.to||'')}" onchange="filters.to=this.value;renderRowsOnly()"></div><div class="control"><label>상태</label><select onchange="filters.status=this.value;renderRowsOnly()"><option value="">전체</option><option ${filters.status==='대기'?'selected':''}>대기</option><option ${filters.status==='완료'?'selected':''}>완료</option></select></div><div class="control"><label>표시건수</label><select onchange="filters.limit=this.value;renderRowsOnly()"><option>50</option><option ${filters.limit==='100'?'selected':''}>100</option><option ${filters.limit==='500'?'selected':''}>500</option></select></div>`}
function rowText(r){return Object.values(r).filter(v=>['string','number'].includes(typeof v)).join(' ').toLowerCase()}function rowDate(r){return date(r.shipDate||r.expected||r.receivedAt||r.shippedAt||r.createdAt)}
function filtered(rows){let out=rows,q=String(filters.q||'').trim().toLowerCase();if(q)out=out.filter(r=>rowText(r).includes(q));if(filters.from)out=out.filter(r=>rowDate(r)==='-'||rowDate(r)>=filters.from);if(filters.to)out=out.filter(r=>rowDate(r)==='-'||rowDate(r)<=filters.to);if(filters.status==='대기')out=out.filter(r=>!/완료|RECEIVED|COMPLETE|FINAL|SHIPPED|DONE/.test(String(r.status||r.inspection)));if(filters.status==='완료')out=out.filter(r=>/완료|RECEIVED|COMPLETE|FINAL|SHIPPED|DONE/.test(String(r.status||r.inspection)));return out.slice(0,num(filters.limit)||50)}
function renderRowsOnly(){clearTimeout(renderRowsOnly.t);renderRowsOnly.t=setTimeout(render,100)}
function tableHtml(schema,rows){if(!rows.length)return'<div class="empty">조건에 맞는 자료가 없습니다.</div>';const totalWeight=rows.reduce((s,r)=>s+num(r.nw||r.weight||r.stock||r.planWeight),0);return`<div class="table-wrap"><table><thead><tr><th>No.</th>${schema.cols.map(c=>`<th>${c[0]}</th>`).join('')}<th>작업</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td>${schema.cols.map(c=>`<td class="${c[2]==='left'?'left':''} ${c[2]==='link'?'link':''}" ${c[2]==='link'?`onclick="editRow('${esc(r.id)}')"`:''}>${c[1](r)}</td>`).join('')}<td>${schema.edit?`<button class="btn" onclick="editRow('${esc(r.id)}')">수정</button>`:'-'}</td></tr>`).join('')}<tr class="total-row"><td colspan="${schema.cols.length}">합계</td><td>${fmt(totalWeight)} kg</td><td></td></tr></tbody></table></div>`}
function cardsHtml(schema,rows){return`<div class="cards">${rows.map(r=>`<article class="mobile-card"><h3>${esc(r.poNo||r.soNo||r.packageNo||r.code||r.mainGrade||'자료')}</h3><dl>${schema.cols.slice(0,7).map(c=>`<dt>${c[0]}</dt><dd>${c[1](r)}</dd>`).join('')}</dl>${schema.edit?`<button class="btn primary" onclick="editRow('${esc(r.id)}')">상세·수정</button>`:''}</article>`).join('')||'<div class="empty">자료가 없습니다.</div>'}</div>`}
function editRow(id){const schema=schemas[currentView],row=schema?.rows().find(x=>String(x.id)===String(id));if(!row||!schema.edit)return;const forms={purchase:purchaseForm,sales:salesForm,inbound:inboundForm,settlement:settlementForm,inventory:inventoryForm,shipping:shippingForm};$('modalTitle').textContent=schema.title+' 수정';$('modalBody').innerHTML=forms[schema.edit](row);$('modal').classList.add('on')}
function input(name,label,value,type='text',wide=false){return`<label class="${wide?'wide':''}">${label}<input name="${name}" type="${type}" value="${esc(value||'')}"></label>`}function select(name,label,value,options){return`<label>${label}<select name="${name}">${options.map(x=>`<option ${String(x)===String(value)?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function formWrap(id,type,fields){return`<form class="form-grid" onsubmit="event.preventDefault();saveEdit('${esc(id)}','${type}',this)">${fields}<div class="wide actions"><button class="btn primary" type="submit">저장·양쪽 프로그램 반영</button><button class="btn" type="button" onclick="closeModal()">취소</button></div></form>`}
function purchaseForm(r){return formWrap(r.id,'purchase',input('company','공급사',r.company)+input('expected','입고예정일',date(r.expected)==='-'?'':date(r.expected),'date')+select('status','구매상태',r.status,['입고대기','구매확정','부분입고','입고완료'])+select('currency','통화',r.currency,['KRW','USD'])+input('rate','환율',r.rate,'number')+input('memo','구매 메모',r.rows[0]?.purchaseMemo||'','text',true))}
function salesForm(r){return formWrap(r.id,'sales',input('customer','고객사',r.customer)+input('shipDate','출하예정일',date(r.shipDate)==='-'?'':date(r.shipDate),'date')+input('grade','대표강종',r.grade)+input('weight','계획 NW(kg)',r.weight,'number')+select('status','판매·출하상태',r.status,['WAITING','READY','INSTANT_READY','FINAL','SHIPPED','CANCELLED'])+input('memo','S.O 메모',r.memo||'','text',true))}
function inboundForm(r){return formWrap(r.id,'inbound',input('receivedAt','입고일',date(r.receivedAt)==='-'?'':date(r.receivedAt),'date')+select('status','입고상태',r.status,['WAITING','RECEIVED'])+select('inspection','검수상태',r.inspection,['WAITING','IN_PROGRESS','COMPLETE'])+input('memo','입고 특이사항',r.memo||'','text',true))}
function settlementForm(r){return formWrap(r.id,'settlement',select('status','세틀상태',r.rows[0]?.settlementStatus||r.status,['미완료','검토중','완료'])+input('memo','세틀 메모',r.rows[0]?.settlementMemo||'','text',true))}
function inventoryForm(r){return formWrap(r.id,'inventory',input('mainGrade','강종',r.mainGrade)+input('subGrade','소강종',r.subGrade)+input('detailGrade','상세강종',r.detailGrade)+input('nw','N/W(kg)',r.nw,'number')+input('location','보관위치',r.location)+select('status','재고상태',r.status,['ACTIVE','WAITING','DEPLETED','SHIPPED']))}
function shippingForm(r){return formWrap(r.shipmentId||r.id,'shipping',input('shippedAt','출하일자',date(r.shippedAt)==='-'?'':date(r.shippedAt),'date')+input('weight','출하 N/W(kg)',r.shippedWeight||r.weight,'number')+select('status','출하상태',r.status,['WAITING','READY','FINAL','SHIPPED','DONE'])+input('memo','출하 메모',r.shippingMemo||'','text',true))}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
async function saveEdit(id,type,form){const v=formData(form);if(type==='purchase')await commit('구매계획 수정',['pos'],s=>safe(s.pos).filter(x=>(x.poNo||'미지정')===id).forEach(x=>Object.assign(x,{company:v.company,expectedArrivalDate:v.expected,purchaseStatus:v.status,currency:v.currency,exchangeRate:num(v.rate),purchaseMemo:v.memo,updatedAt:new Date().toISOString(),updatedByName:currentUserName()})));if(type==='sales')await commit('판매계획 수정',['salesOrders'],s=>{const x=s.salesOrders.find(x=>x.id===id);if(x)Object.assign(x,{customer:v.customer,shipDate:v.shipDate,grade:v.grade,weight:num(v.weight),status:v.status,memo:v.memo,updatedAt:new Date().toISOString(),updatedByName:currentUserName()})});if(type==='inbound')await commit('입고현황 수정',['pos'],s=>{const x=s.pos.find(x=>x.id===id);if(x)Object.assign(x,{receivedAt:v.receivedAt?v.receivedAt+'T00:00:00.000Z':'',receiptStatus:v.status,inspectionStatus:v.inspection,receiptMemo:v.memo,updatedAt:new Date().toISOString(),updatedByName:currentUserName()})});if(type==='settlement')await commit('세틀현황 수정',['pos'],s=>safe(s.pos).filter(x=>(x.poNo||'미지정')===id).forEach(x=>Object.assign(x,{settlementStatus:v.status,settlementMemo:v.memo,settlementUpdatedAt:new Date().toISOString(),settlementUpdatedBy:currentUserName()})));if(type==='inventory')await commit('재고상세 수정',['bags'],s=>{const x=s.bags.find(x=>x.id===id);if(x)Object.assign(x,{mainGrade:v.mainGrade,grade:v.mainGrade,subGrade:v.subGrade,detailGrade:v.detailGrade,weight:num(v.nw),netWeight:num(v.nw),location:v.location,status:v.status,updatedAt:new Date().toISOString(),updatedByName:currentUserName()})});if(type==='shipping')await commit('출고현황 수정',['shipments','salesOrders'],s=>{let x=s.shipments.find(x=>x.id===id);if(!x){const order=s.salesOrders.find(x=>x.id===id);x={id:crypto.randomUUID(),salesOrderId:order?.id||id,soNo:order?.soNo||'',createdAt:new Date().toISOString()};s.shipments.push(x)}Object.assign(x,{shippedAt:v.shippedAt?v.shippedAt+'T00:00:00.000Z':'',weight:num(v.weight),shippedWeight:num(v.weight),status:v.status,shippingMemo:v.memo,updatedAt:new Date().toISOString(),updatedByName:currentUserName()})});closeModal()}
function closeModal(){$('modal').classList.remove('on')}
function renderDaily(){const rows=todayAudits().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));$('pageTitle').textContent='일일 작업일지';$('content').innerHTML=`<div class="dashboard-head"><div><h1>일일 작업일지</h1><p>${nowDate()} · 현장관리와 MES의 작업기록 통합</p></div><button class="btn primary" onclick="openDailyForm()">+ 작업일지 추가</button></div><div class="kpis">${kpi('총 작업',rows.length+'건','오늘')}${kpi('입고',rows.filter(x=>/RECEIPT|입고/.test(x.action+' '+x.label)).length+'건','완료')}${kpi('검수·생산',rows.filter(x=>/INSPECTION|WORK|검수|생산/.test(x.action+' '+x.label)).length+'건','작업')}${kpi('출하',rows.filter(x=>/SHIP|출하/.test(x.action+' '+x.label)).length+'건','완료')}${kpi('작업자',new Set(rows.map(x=>x.operatorName||x.actorName).filter(Boolean)).size+'명','참여')}</div><div class="panel">${rows.length?`<div class="table-wrap" style="max-height:none"><table><thead><tr><th>시간</th><th>작업자</th><th>구분</th><th>번호</th><th>내용</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${dt(x.createdAt).slice(11)}</td><td>${esc(x.operatorName||x.actorName||'-')}</td><td>${esc(x.action||'-')}</td><td>${esc(x.packageNo||x.poNo||x.soNo||x.completionNo||'-')}</td><td class="left">${esc(x.label||x.note||x.reason||x.instruction||'-')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">오늘 기록이 없습니다.</div>'}</div>`}
function openDailyForm(){$('modalTitle').textContent='작업일지 추가';$('modalBody').innerHTML=formWrap('new','daily',input('category','작업구분','일반업무')+input('reference','관련번호','')+`<label class="wide">작업내용<textarea name="note" required></textarea></label>`);$('modal').classList.add('on')}
const saveEditBase=saveEdit;saveEdit=async function(id,type,form){if(type!=='daily')return saveEditBase(id,type,form);const v=formData(form);await commit('작업일지 등록',['auditLogs'],s=>s.auditLogs.push({id:crypto.randomUUID(),action:'MES_DAILY_NOTE',category:v.category,reference:v.reference,label:v.note,note:v.note,operatorName:currentUserName(),operatorEmail:authUser?.email||'',createdAt:new Date().toISOString()}));closeModal();renderDaily()}
function exportView(){const schema=schemas[currentView];if(!schema)return;const rows=filtered(schema.rows()),headers=schema.cols.map(x=>x[0]),plain=html=>{const d=document.createElement('div');d.innerHTML=html;return d.textContent};const body=[headers,...rows.map(r=>schema.cols.map(c=>plain(String(c[1](r)))))];const html=`<html><head><meta charset="utf-8"></head><body><table border="1"><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${body.slice(1).map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></body></html>`,blob=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`신성금속_MES_${schema.title}_${nowDate()}.xls`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
buildNav();currentView=location.hash.slice(1)||'dashboard';openView(currentView);initAuth();setInterval(realtimePoll,2500);addEventListener('focus',realtimePoll);addEventListener('online',realtimePoll);
</script>

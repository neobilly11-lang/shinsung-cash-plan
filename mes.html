const MES_CACHE_KEY_V2='shinsung-mes-shared-state-cache-v2';
let mesCurrentDetail={view:'',id:''};
function mesBusinessCount(payload){return['pos','splits','inputs','bags','salesOrders','shipments','workWaits','domesticReceipts'].reduce((n,key)=>n+safe(payload?.[key]).length,0)}
function mesReadCache(){try{const value=JSON.parse(localStorage.getItem(MES_CACHE_KEY_V2)||'null');return value?.payload?value:null}catch(_){return null}}

async function mesFetchState(){let last;for(let i=0;i<3;i++){try{return await readState()}catch(error){last=error;if(i<2)await new Promise(resolve=>setTimeout(resolve,300*(i+1)))}}throw last}
let mesLoadPromise=null;
loadState=async function loadMesDurableState(shouldRender=true){if(mesLoadPromise)return mesLoadPromise;mesLoadPromise=(async()=>{const cached=mesReadCache();if(cached?.payload){const cachedRevision=num(cached.revision),needsCachePaint=!mesBusinessCount(state)||cachedRevision>revision;if(needsCachePaint){state=defaults(cached.payload);revision=cachedRevision;if(shouldRender)render()}setSync('??λ맂 ?먮즺 ?쒖떆 쨌 理쒖떊 蹂寃??뺤씤 以?);try{const remoteRevision=await readRevision();if(remoteRevision===revision){lastLoad=Date.now();setSync('鍮좊Ⅸ ?숆린???꾨즺 쨌 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));return true}}catch(_){/* ?꾩껜?먮즺 ?붿껌?쇰줈 ??踰????뺤씤 */}}try{setSync('蹂寃쎌옄猷??숆린??以?);const out=await mesFetchState();if(!out?.payload)throw Error('怨듭슜 ?쒕쾭 ?묐떟???낅Т?먮즺媛 ?놁뒿?덈떎.');state=defaults(out.payload);revision=num(out.revision);lastLoad=Date.now();mesWriteCache(state,revision);setSync('?ㅼ떆媛??곌껐 쨌 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));if(shouldRender)render();return true}catch(error){if(cached?.payload){state=defaults(cached.payload);revision=Math.max(revision,num(cached.revision));setSync('??μ옄猷??쒖떆 쨌 ?쒕쾭 ?ъ뿰寃??湲?,true);if(shouldRender)render();toast('?쒕쾭 ?ъ뿰寃?以묒엯?덈떎. 留덉?留??숆린???먮즺???좎??⑸땲??',true);return false}setSync('?쒕쾭 ?곌껐 ?ㅽ뙣',true);toast(error.message,true);return false}})();try{return await mesLoadPromise}finally{mesLoadPromise=null}}
commit=async function commitMesDurable(label,collections,mutate){$('progress').classList.add('on');try{for(let attempt=0;attempt<4;attempt++){const latest=await mesFetchState(),draft=defaults(structuredClone(latest.payload));mutate(draft);const changes={};collections.forEach(key=>changes[key]=draft[key]);const audit={id:crypto.randomUUID(),action:'MES_UPDATE',label,operatorName:currentUserName(),operatorEmail:authUser?.email||'',createdAt:new Date().toISOString()};changes.auditLogs=[...safe(draft.auditLogs),audit];const response=await fetch('/api/scrap-state',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({changes,baseRevision:num(latest.revision)})});let out={};try{out=await response.json()}catch(_){out={}}if(response.status===409)continue;if(!response.ok)throw Error(out.error||`???HTTP ${response.status}`);state=draft;revision=num(out.revision)||num(latest.revision)+1;mesWriteCache(state,revision);setSync('????꾨즺 쨌 ?꾩옣愿由??숈떆 諛섏쁺');render();toast(label+' ????꾨즺 쨌 ?щ줈洹몄씤 ?꾩뿉???좎??⑸땲??');return true}throw Error('?ㅻⅨ ?묒뾽?먯쓽 ??κ낵 諛섎났 異⑸룎?덉뒿?덈떎. ?ㅼ떆 ?뚮윭 二쇱꽭??')}catch(error){toast(label+' ?ㅽ뙣: '+error.message,true);return false}finally{$('progress').classList.remove('on')}}
function mesInputWeight(bagId){return safe(state.inputs).filter(x=>x.bagId===bagId&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)}
function mesMovedWeight(bagId){return safe(state.inputs).filter(x=>x.sourceBagId===bagId&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)}
function mesShippedWeight(bagId){return safe(state.shipmentAllocations).filter(x=>x.bagId===bagId&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)}
function mesReturnedWeight(bagId){return safe(state.returnReceipts).filter(x=>x.bagId===bagId&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)}

function mesSalesRows(){const groups=groupBy(safe(state.salesOrders).filter(x=>x.status!=='CANCELLED'),x=>x.soNo||x.id);return[...groups].map(([soNo,items])=>({id:soNo,soNo,items,customer:items[0]?.customer||'',grade:[...new Set(items.map(x=>x.grade||[x.productType,x.mainGrade,x.subGrade,x.detailGrade].filter(Boolean).join(' 쨌 ')).filter(Boolean))].join(' / '),weight:items.reduce((s,x)=>s+num(x.weight),0),shipDate:items[0]?.shipDate,status:items.every(x=>['FINAL','SHIPPED','DONE'].includes(x.status))?items[0]?.status||'FINAL':items[0]?.status||'WAITING',type:items[0]?.packingListType==='OVERSEAS'?'?섏텧':'援?궡',currency:items[0]?.currency||(items[0]?.packingListType==='OVERSEAS'?'USD':'KRW'),amount:items.reduce((s,x)=>s+num(x.amount||x.salesAmount||num(x.weight)*num(x.unitPrice)),0)}))}
salesRows=mesSalesRows;
shipmentRows=function mesShipmentRows(){return salesRows().map(order=>{const related=safe(state.shipments).filter(x=>x.soNo===order.soNo||order.items.some(item=>x.salesOrderId===item.id)),alloc=safe(state.shipmentAllocations).filter(a=>related.some(x=>x.id===a.shipmentId)),lists=safe(state.packingLists).filter(p=>p.soNo===order.soNo||order.items.some(item=>p.salesOrderId===item.id)),last=related.slice().sort((a,b)=>String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt)))[0]||{};return{...order,shipmentId:last.id||'',shipments:related,allocations:alloc,packingLists:lists,shippedWeight:alloc.length?alloc.reduce((s,x)=>s+num(x.weight),0):related.reduce((s,x)=>s+num(x.weight||x.shippedWeight),0),shippedAt:last.shippedAt||last.shippingCompletedAt,status:last.status||order.status,packingList:lists.map(x=>x.packingListNo).filter(Boolean).join(' / ')}})};

.modal{position:fixed;inset:0;background:#071525a8;display:none;place-items:center;padding:18px;z-index:100}.modal.on{display:grid}.modal-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 30px 90px #0006}.modal-card.wide-modal{width:min(1180px,100%)}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.modal-head h2{margin:0}.close{border:0;background:#eef2f7;width:42px;height:42px;border-radius:10px;font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.form-grid label{font-size:13px;font-weight:800;color:#566477}.form-grid input,.form-grid select,.form-grid textarea{display:block;width:100%;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px;padding:11px;color:var(--text);background:#fff}.form-grid textarea{min-height:95px;resize:vertical}.wide{grid-column:1/-1}.save-progress{position:fixed;inset:0;z-index:200;background:#102542cc;color:#fff;display:none;place-items:center;text-align:center}.save-progress.on{display:grid}.spinner{width:55px;height:55px;border:6px solid #ffffff42;border-top-color:#48ddce;border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;right:22px;bottom:22px;background:#163a33;color:#fff;padding:14px 18px;border-radius:12px;z-index:210;box-shadow:var(--shadow);opacity:0;transform:translateY(15px);transition:.25s}.toast.on{opacity:1;transform:none}.mes-photo-toolbar{display:flex;align-items:center;gap:10px;margin:14px 0}.mes-photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px;background:#f3f7f8;border-radius:14px}.mes-photo-grid[hidden]{display:none}.mes-photo-card{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.mes-photo-card button{border:0;padding:0;background:#eef3f6;width:100%;height:180px;cursor:zoom-in}.mes-photo-card img{width:100%;height:100%;object-fit:cover}.mes-photo-card figcaption{padding:10px;font-size:12px}.mes-photo-card figcaption b,.mes-photo-card figcaption span{display:block}.mes-photo-card figcaption span{color:var(--muted);margin-top:4px}.settlement-sheet{border:1px solid #9da7b2;background:#fff;padding:18px;margin-top:14px}.settlement-sheet h2{text-align:center;letter-spacing:2px;margin:0 0 8px}.settlement-sheet .settle-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #555}.settlement-sheet .settle-meta div{padding:8px;border-right:1px solid #999}.settlement-sheet table{min-width:780px;margin-top:12px}.settlement-sheet th{position:static;background:#dfe5e8;color:#111}.settlement-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.auth{position:fixed;inset:0;background:linear-gradient(145deg,#0a263f,#145a66);z-index:300;display:none;place-items:center;padding:18px}.auth.on{display:grid}.auth-card{width:min(460px,100%);background:#fff;border-radius:22px;padding:27px;box-shadow:0 30px 90px #0005}.auth-card h1{margin:0;font-size:30px}.auth-card p{color:var(--muted)}.auth-card label{display:block;margin-top:13px;font-weight:800}.auth-card input{width:100%;height:54px;margin-top:7px;border:2px solid #ccd7e2;border-radius:12px;padding:0 13px;font-size:17px}.auth-card .btn{width:100%;margin-top:15px;min-height:54px}.auth-msg{margin-top:12px;color:var(--danger);font-weight:800}
@media(max-width:1100px){.shell{grid-template-columns:220px minmax(0,1fr)}.toolbar{grid-template-columns:repeat(3,1fr) auto}.kpis{grid-template-columns:repeat(3,1fr)}}

</style>

<body>
<div id="auth" class="auth"><div class="auth-card"><h1>신성금속 MES</h1><p>현장관리와 같은 계정으로 로그인하세요.</p><label>이름 또는 이메일<input id="loginId" autocomplete="username" placeholder="등록한 이름 또는 이메일"></label><label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password"></label><label style="display:flex;gap:8px;align-items:center"><input id="remember" type="checkbox" checked style="width:22px;height:22px;margin:0"> 자동접속 유지</label><button class="btn primary" onclick="login()">로그인·접속</button><button class="btn" onclick="location.href='/stable-inspection-mobile-v4.html?authReturn=mes'">사용자 등록·비밀번호 찾기</button><div id="authMsg" class="auth-msg"></div></div></div>
<div class="shell">
<aside id="side" class="side"><div class="brand" onclick="openView('dashboard')" style="cursor:pointer"><strong>신성금속 MES</strong><span>현장관리 실시간 연동 시스템</span></div><div id="nav"></div><button class="nav-btn field-link" onclick="openFieldManagement()"><b>↗</b> 현장관리 열기</button></aside>
<main class="main"><header class="top"><button class="menu-toggle" onclick="side.classList.toggle('on')">☰</button><div id="pageTitle" class="page-title">통합 현황판</div><div id="sync" class="sync"><b>●</b><span>공용 서버 연결 중</span></div><button id="user" class="user" onclick="logout()">로그인</button></header><div id="content" class="content"></div></main>
</div>
<div id="modal" class="modal"><div class="modal-card" onclick="event.stopPropagation()"><div class="modal-head"><h2 id="modalTitle">자료 수정</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<div id="progress" class="save-progress"><div><div class="spinner"></div><h2>공용 서버에 저장 중</h2><p>현장관리와 MES에 동시에 반영하고 있습니다.</p></div></div><div id="toast" class="toast"></div>
<script>
const API='https://orpeybiqikrdydkhsjjs.supabase.co',KEY='sb_publishable_TerLvPZo7e5_X91A-P4qlQ_DaqBly0Q';
const AUTH_LOCAL_KEY='scrap-auth-session-v1',AUTH_TEMP_KEY='scrap-auth-session-temp-v1',AUTH_NAME_MAP_KEY='scrap-auth-name-email-v1',AUTH_BRIDGE_KEY='shinsung-field-auth-bridge-v1';
const VIEWS=[
 {group:'계획관리',id:'purchase',icon:'01',label:'구매계획'}, {group:'계획관리',id:'sales',icon:'02',label:'판매계획'},
 {group:'입고·생산',id:'inbound',icon:'03',label:'입고현황'}, {group:'입고·생산',id:'production',icon:'04',label:'생산현황'},
 {group:'입고·생산',id:'settlement',icon:'05',label:'세틀현황'}, {group:'재고·출하',id:'inventory',icon:'06',label:'재고현황'},
 {group:'재고·출하',id:'stockDetail',icon:'07',label:'재고상세'}, {group:'재고·출하',id:'shippingPlan',icon:'08',label:'출하계획'},
 {group:'재고·출하',id:'shipping',icon:'09',label:'출고현황'}, {group:'기록',id:'daily',icon:'10',label:'일일 작업일지'}
];
let state={},revision=0,currentView='dashboard',filters={},authSession=null,authUser=null,pollBusy=false,lastLoad=0;
const $=id=>document.getElementById(id),safe=value=>Array.isArray(value)?value:[],num=value=>Number(value)||0,esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=value=>num(value).toLocaleString('ko-KR',{maximumFractionDigits:2}),date=value=>String(value||'').slice(0,10)||'-',dt=value=>String(value||'').replace('T',' ').slice(0,16)||'-';
const nowDate=()=>new Date().toLocaleDateString('sv-SE'),currentUserName=()=>String(authUser?.user_metadata?.display_name||authUser?.user_metadata?.name||authUser?.email?.split('@')[0]||'MES 사용자');
function defaults(x={}){return{pos:[],splits:[],inputs:[],bags:[],losses:[],workWaits:[],salesOrders:[],packingLists:[],shipments:[],shipmentAllocations:[],returnReceipts:[],domesticReceipts:[],movements:[],waitingMoves:[],receiptWorks:[],shippingWorks:[],auditLogs:[],locations:[],mainGrades:[],subGrades:[],samples:[],analysisRecords:[],preSettlements:[],systemSettings:{},...x}}
function authMap(){try{return JSON.parse(localStorage.getItem(AUTH_NAME_MAP_KEY)||'{}')}catch{return{}}}function resolveEmail(v){v=String(v||'').trim();return v.includes('@')?v.toLowerCase():authMap()[v.toLowerCase()]||''}
async function authRequest(path,opt={}){const r=await fetch(`${API}/auth/v1/${path}`,{method:opt.method||'GET',headers:{apikey:KEY,'Content-Type':'application/json',...(opt.token?{Authorization:`Bearer ${opt.token}`}:{})},body:opt.body?JSON.stringify(opt.body):undefined}),text=await r.text();let out={};try{out=JSON.parse(text||'{}')}catch{out={message:text}}if(!r.ok)throw Error(out.message||out.error_description||out.error||`인증 HTTP ${r.status}`);return out}
function saveSession(session,remember){localStorage.removeItem(AUTH_LOCAL_KEY);sessionStorage.removeItem(AUTH_TEMP_KEY);(remember?localStorage:sessionStorage).setItem(remember?AUTH_LOCAL_KEY:AUTH_TEMP_KEY,JSON.stringify({...session,user:session?.user||authUser||null,remember}))}
function savedSession(){const params=new URLSearchParams(location.search);if(params.get('authBridge')==='1'||params.get('from')==='field')for(const store of [sessionStorage,localStorage])try{const bridged=JSON.parse(store.getItem(AUTH_BRIDGE_KEY)||'null');if(bridged?.access_token){sessionStorage.removeItem(AUTH_BRIDGE_KEY);localStorage.removeItem(AUTH_BRIDGE_KEY);saveSession(bridged,bridged.remember!==false);return bridged}}catch(_){store.removeItem(AUTH_BRIDGE_KEY)}for(const [store,key] of [[localStorage,AUTH_LOCAL_KEY],[sessionStorage,AUTH_TEMP_KEY]])try{const x=JSON.parse(store.getItem(key)||'null');if(x?.access_token)return x}catch{}return null}
function openFieldManagement(){if(!authSession?.access_token){$('auth').classList.add('on');$('authMsg').textContent='MES에 먼저 로그인해 주세요.';return}const bridge={...authSession,user:authUser||authSession.user||null,remember:authSession.remember!==false,source:'mes',createdAt:Date.now()};try{sessionStorage.removeItem('shinsung-auth-return');sessionStorage.setItem(AUTH_BRIDGE_KEY,JSON.stringify(bridge));saveSession(bridge,bridge.remember)}catch(error){toast('현장관리 로그인 연결 준비 실패: '+error.message,true);return}location.href='/stable-inspection-mobile-v4.html?from=mes&authBridge=1#home'}
async function login(){const email=resolveEmail($('loginId').value),password=$('loginPassword').value;if(!email||!password)return $('authMsg').textContent='등록한 이메일과 비밀번호를 입력하세요.';$('authMsg').textContent='로그인 확인 중…';try{const s=await authRequest('token?grant_type=password',{method:'POST',body:{email,password}});unlock(s,s.user||await authRequest('user',{token:s.access_token}),$('remember').checked)}catch(e){$('authMsg').textContent='로그인 실패: '+e.message}}
function unlock(session,user,remember=true){authSession=session;authUser=user;session.user=user;saveSession(session,remember);$('auth').classList.remove('on');$('user').textContent='👤 '+currentUserName()+' · 로그아웃';void loadState(true)}
async function verifyFastSession(session){try{let user;try{user=await authRequest('user',{token:session.access_token})}catch{const next=await authRequest('token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}});Object.assign(session,next);user=next.user||await authRequest('user',{token:session.access_token})}authSession=session;authUser=user;session.user=user;saveSession(session,session.remember!==false);$('user').textContent='👤 '+currentUserName()+' · 로그아웃'}catch{localStorage.removeItem(AUTH_LOCAL_KEY);sessionStorage.removeItem(AUTH_TEMP_KEY);authSession=null;authUser=null;$('auth').classList.add('on');$('authMsg').textContent='로그인 시간이 만료되었습니다. 다시 로그인하세요.'}}
let mesAuthInitPromise=null;
async function initAuth(){if(mesAuthInitPromise)return mesAuthInitPromise;mesAuthInitPromise=(async()=>{if(['localhost','127.0.0.1'].includes(location.hostname)){return unlock({access_token:'test'},{id:'test',email:'mes@local',user_metadata:{display_name:'MES 테스트'}},false)}const session=savedSession();if(session?.user){unlock(session,session.user,session.remember!==false);void verifyFastSession(session);return}if(session)try{let user;try{user=await authRequest('user',{token:session.access_token})}catch{const next=await authRequest('token?grant_type=refresh_token',{method:'POST',body:{refresh_token:session.refresh_token}});Object.assign(session,next);user=next.user||await authRequest('user',{token:session.access_token})}return unlock(session,user,session.remember!==false)}catch{}$('auth').classList.add('on');setSync('로그인 후 공용자료를 불러옵니다.')} )();try{return await mesAuthInitPromise}finally{mesAuthInitPromise=null}}
async function logout(){try{if(authSession?.access_token)await authRequest('logout?scope=local',{method:'POST',token:authSession.access_token})}catch{}localStorage.removeItem(AUTH_LOCAL_KEY);sessionStorage.removeItem(AUTH_TEMP_KEY);location.reload()}
async function readState(){const r=await fetch('/api/scrap-state',{cache:'no-store'}),out=await r.json();if(!r.ok)throw Error(out.error||`서버 HTTP ${r.status}`);return out}
async function readRevision(){const r=await fetch('/api/scrap-state?revision=1',{cache:'no-store'}),out=await r.json();if(!r.ok)throw Error(out.error||`서버 HTTP ${r.status}`);return num(out.revision)}
function setSync(text,bad=false){$('sync').classList.toggle('bad',bad);$('sync').innerHTML=`<b>●</b><span>${esc(text)}</span>`}
async function loadState(shouldRender=true){try{setSync('공용 서버 동기화 중');const out=await readState();state=defaults(out.payload);revision=num(out.revision);lastLoad=Date.now();setSync('실시간 연결 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));if(shouldRender)render()}catch(e){setSync('서버 연결 실패',true);toast(e.message,true)}}
async function realtimePoll(){if(pollBusy||document.hidden||!authUser||$('progress').classList.contains('on')||($('modal').classList.contains('on')&&$('modalBody').querySelector('form')))return;pollBusy=true;try{const remote=await readRevision();if(remote>revision)await loadState(true)}catch(e){setSync('재연결 대기',true)}finally{pollBusy=false}}
async function commit(label,collections,mutate){$('progress').classList.add('on');try{for(let attempt=0;attempt<3;attempt++){const latest=await readState(),draft=defaults(structuredClone(latest.payload));mutate(draft);const changes={};collections.forEach(key=>changes[key]=draft[key]);const audit={id:crypto.randomUUID(),action:'MES_UPDATE',label,operatorName:currentUserName(),operatorEmail:authUser?.email||'',createdAt:new Date().toISOString()};changes.auditLogs=[...safe(draft.auditLogs),audit];const r=await fetch('/api/scrap-state',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({changes,baseRevision:num(latest.revision)})}),out=await r.json();if(r.status===409)continue;if(!r.ok)throw Error(out.error||`저장 HTTP ${r.status}`);await loadState(true);toast(label+' 저장 완료 · 현장관리에도 반영됨');return}throw Error('동시 저장 충돌이 반복되었습니다. 잠시 후 다시 저장하세요.')}catch(e){toast(label+' 실패: '+e.message,true)}finally{$('progress').classList.remove('on')}}
function toast(text,bad=false){const t=$('toast');t.textContent=text;t.style.background=bad?'#a52e38':'#163a33';t.classList.add('on');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('on'),3500)}
function buildNav(){let html='<div class="nav-group"><button class="nav-btn" data-id="dashboard" onclick="openView(\'dashboard\')"><b>⌂</b> 통합 현황판</button></div>',group='';VIEWS.forEach(v=>{if(group!==v.group){group=v.group;html+=`<div class="nav-group"><div class="nav-title">${group}</div>`}html+=`<button class="nav-btn" data-id="${v.id}" onclick="openView('${v.id}')"><b>${v.icon}</b> ${v.label}</button>`;if(VIEWS[VIEWS.indexOf(v)+1]?.group!==group)html+='</div>'});$('nav').innerHTML=html}
function openView(id){currentView=id;filters={};$('side').classList.remove('on');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('on',b.dataset.id===id));render();history.replaceState(null,'','#'+id)}
function groupBy(rows,key){const map=new Map;rows.forEach(r=>{const k=typeof key==='function'?key(r):r[key]||'미지정';if(!map.has(k))map.set(k,[]);map.get(k).push(r)});return map}
function purchaseContractWeight(row){row=row||{};const candidates=[row.purchaseContractWeight,row.contractWeight,row.purchaseQuantity,row.contractQuantity,row.plannedPurchaseWeight,row.weight,row.netWeight,row.grossWeight];for(const value of candidates){const parsed=num(value);if(parsed>0)return parsed}return 0}
function purchaseContractGrade(row){row=row||{};return row.purchaseContractGrade||row.contractGrade||row.grade||row.mainGrade||row.itemName||''}
function packageUsed(no){return safe(state.splits).filter(x=>x.packageNo===no&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)+safe(state.losses).filter(x=>x.packageNo===no&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)}
function bagCode(b){return b.completionNo||b.bagNo||b.code||b.id}function bagWeight(b){return num(b.netWeight||b.nw||b.weight)}function activeBags(){return safe(state.bags).filter(b=>!['DEPLETED','SHIPPED','CANCELLED'].includes(b.status)&&bagWeight(b)>0)}
function poRows(){return[...groupBy(safe(state.pos).filter(p=>p.status!=='CANCELLED'&&!p.inboundRequestSuperseded),p=>p.poNo||'미지정')].map(([poNo,rows])=>{const contractWeight=rows.reduce((s,x)=>s+purchaseContractWeight(x),0),isDomestic=rows.some(x=>x.domesticReceipt===true||!!x.domesticReceiptId);return{id:poNo,poNo,rows,company:rows[0]?.company||'',grade:[...new Set(rows.map(purchaseContractGrade).filter(Boolean))].join(' / '),packages:rows.length,gw:contractWeight,nw:contractWeight,expected:rows[0]?.expectedArrivalDate||rows[0]?.arrivalDate||rows[0]?.createdAt,status:rows.every(x=>x.receivedAt)?'입고완료':rows.some(x=>x.receivedAt)?'부분입고':rows[0]?.purchaseStatus||'입고대기',purchaseOrigin:isDomestic?'DOMESTIC':'OVERSEAS',currency:rows[0]?.currency||(isDomestic?'KRW':'USD'),rate:num(rows[0]?.exchangeRate)||1}})}
function salesRows(){return safe(state.salesOrders).filter(x=>x.status!=='CANCELLED').map(x=>({id:x.id,soNo:x.soNo,customer:x.customer,grade:x.grade,weight:num(x.weight),shipDate:x.shipDate,status:x.status||'WAITING',type:x.packingListType==='OVERSEAS'?'수출':'국내',currency:x.currency||((x.packingListType==='OVERSEAS')?'USD':'KRW'),amount:num(x.amount||x.salesAmount)}))}
function inboundRows(){return safe(state.pos).filter(x=>x.status!=='CANCELLED').map(x=>({id:x.id,packageNo:x.packageNo,poNo:x.poNo,company:x.company,grade:x.grade,planWeight:num(x.weight),receivedWeight:num(x.netWeight||x.weight),receivedAt:x.receivedAt,status:x.receiptStatus||(!x.receivedAt?'WAITING':'RECEIVED'),inspection:x.inspectionStatus||'WAITING',memo:x.receiptMemo||''}))}
function productionRows(){const splitByPackage=groupBy(safe(state.splits).filter(x=>x.status!=='CANCELLED'),'packageNo');return inboundRows().map(p=>{const splits=splitByPackage.get(p.packageNo)||[],confirmed=splits.reduce((s,x)=>s+num(x.weight),0),loss=safe(state.losses).filter(x=>x.packageNo===p.packageNo&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0),wait=safe(state.workWaits).filter(x=>x.packageNo===p.packageNo&&x.status==='WAITING').reduce((s,x)=>s+num(x.weight),0);return{...p,confirmed,loss,wait,remain:Math.max(0,p.planWeight-confirmed-loss),finalGrade:[...new Set(splits.map(x=>[x.productType,x.mainGrade,x.subGrade,x.detailGrade].filter(Boolean).join(' · ')))].join(' / ')}})}
function inventoryRows(){return activeBags().map(b=>({id:b.id,code:bagCode(b),productType:b.productType||'',mainGrade:b.mainGrade||b.grade||'',subGrade:b.subGrade||'',detailGrade:b.detailGrade||'',nw:bagWeight(b),packing:num(b.packagingWeight||b.tareWeight),gw:bagWeight(b)+num(b.packagingWeight||b.tareWeight),location:b.location||'미지정',status:b.status||'ACTIVE',packageNo:b.packageNo||b.sourcePackageNo||''}))}
function shipmentRows(){const maps=new Map(safe(state.shipments).map(x=>[x.salesOrderId,x]));return salesRows().map(s=>{const x=maps.get(s.id)||safe(state.shipments).find(y=>y.soNo===s.soNo)||{};return{...s,shipmentId:x.id||'',shippedWeight:num(x.weight||x.shippedWeight),shippedAt:x.shippedAt||x.shippingCompletedAt,status:x.status||s.status,packingList:safe(state.packingLists).find(p=>p.salesOrderId===s.id&&p.status!=='CANCELLED')?.packingListNo||''}})}
function settlementRows(){return poRows().map(po=>{const items=productionRows().filter(x=>x.poNo===po.poNo),done=items.filter(x=>x.remain<=.001).length,progress=items.length?Math.round(done/items.length*100):0;return{...po,progress,done,total:items.length,status:progress===100?'완료':'미완료',loss:items.reduce((s,x)=>s+x.loss,0),inspected:items.reduce((s,x)=>s+x.confirmed,0)}})}
function dashboard(){const pos=inboundRows(),prod=productionRows(),inv=inventoryRows(),sales=salesRows();return`<div class="dashboard-head"><div><h1>신성금속 통합 생산현황</h1><p>현장관리와 동일한 공용자료를 실시간으로 집계합니다.</p></div><div class="actions"><button class="btn" onclick="loadState()">↻ 지금 동기화</button><button class="btn primary" onclick="openView('daily')">오늘 작업일지</button></div></div><div class="kpis">${kpi('입고대기',pos.filter(x=>!x.receivedAt).length+'건',fmt(pos.filter(x=>!x.receivedAt).reduce((s,x)=>s+x.planWeight,0))+' kg')}${kpi('생산대기',fmt(prod.reduce((s,x)=>s+x.remain,0))+' kg','검수·작업 미완료')}${kpi('완료재고',fmt(inv.reduce((s,x)=>s+x.nw,0))+' kg',inv.length+'개 포장')}${kpi('출하대기',sales.filter(x=>!['FINAL','SHIPPED','DONE'].includes(x.status)).length+'건',fmt(sales.reduce((s,x)=>s+x.weight,0))+' kg 계획')}${kpi('오늘 작업',todayAudits().length+'건',currentUserName())}</div><div class="panel"><div style="padding:18px"><h2 style="margin:0 0 15px">공정별 중량</h2><div class="kpis">${kpi('입고대기',fmt(prod.reduce((s,x)=>s+x.remain,0))+' kg','원재고')}${kpi('작업대기',fmt(prod.reduce((s,x)=>s+x.wait,0))+' kg','쇼트·산처리·절단')}${kpi('완료포장',fmt(inv.reduce((s,x)=>s+x.nw,0))+' kg','출하 가능')}${kpi('출하완료',fmt(shipmentRows().reduce((s,x)=>s+x.shippedWeight,0))+' kg','누적')}${kpi('로스',fmt(prod.reduce((s,x)=>s+x.loss,0))+' kg','누적 처리')}</div></div></div>`}
function kpi(label,value,note){return`<div class="kpi"><small>${esc(label)}</small><strong>${esc(value)}</strong><span>${esc(note)}</span></div>`}

function status(value){const s=String(value||'-'),good=/완료|RECEIVED|COMPLETE|FINAL|SHIPPED|DONE|ACTIVE/.test(s),bad=/취소|CANCEL/.test(s);return`<span class="status ${bad?'bad':good?'good':'wait'}">${esc(s)}</span>`}
function todayAudits(){return safe(state.auditLogs).filter(x=>date(x.createdAt)===nowDate())}
function render(){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('on',b.dataset.id===currentView));if(currentView==='dashboard'){$('pageTitle').textContent='통합 현황판';$('content').innerHTML=dashboard();return}if(currentView==='daily'){renderDaily();return}const schema=schemas[currentView]||schemas.purchase;$('pageTitle').textContent=schema.title;let rows=filtered(schema.rows()),html=`<div class="dashboard-head"><div><h1>${schema.title}</h1><p>현장관리 공용자료 · ${rows.length.toLocaleString()}건</p></div><div class="actions"><button class="btn" onclick="loadState()">↻ 조회</button><button class="btn primary" onclick="exportView()">엑셀</button></div></div><div class="panel"><div class="toolbar">${filterControls()}<button class="btn primary" onclick="render()">조회</button><button class="btn" onclick="filters={};render()">초기화</button></div>${tableHtml(schema,rows)}${cardsHtml(schema,rows)}</div>`;$('content').innerHTML=html}
function filterControls(){const origin=currentView==='purchase'?`<div class="control"><label>국내·해외</label><select onchange="filters.purchaseOrigin=this.value;renderRowsOnly()"><option value="">전체</option><option value="DOMESTIC" ${filters.purchaseOrigin==='DOMESTIC'?'selected':''}>국내</option><option value="OVERSEAS" ${filters.purchaseOrigin==='OVERSEAS'?'selected':''}>해외</option></select></div>`:'';return`<div class="control"><label>통합 검색</label><input value="${esc(filters.q||'')}" placeholder="번호·회사·강종·장소" oninput="filters.q=this.value;renderRowsOnly()"></div>${origin}<div class="control"><label>시작일</label><input type="date" value="${esc(filters.from||'')}" onchange="filters.from=this.value;renderRowsOnly()"></div><div class="control"><label>종료일</label><input type="date" value="${esc(filters.to||'')}" onchange="filters.to=this.value;renderRowsOnly()"></div><div class="control"><label>상태</label><select onchange="filters.status=this.value;renderRowsOnly()"><option value="">전체</option><option ${filters.status==='대기'?'selected':''}>대기</option><option ${filters.status==='완료'?'selected':''}>완료</option></select></div><div class="control"><label>표시건수</label><select onchange="filters.limit=this.value;renderRowsOnly()"><option>50</option><option ${filters.limit==='100'?'selected':''}>100</option><option ${filters.limit==='500'?'selected':''}>500</option></select></div>`}
function rowText(r){return Object.values(r).filter(v=>['string','number'].includes(typeof v)).join(' ').toLowerCase()}function rowDate(r){return date(r.shipDate||r.expected||r.receivedAt||r.shippedAt||r.createdAt)}
function filtered(rows){let out=rows,q=String(filters.q||'').trim().toLowerCase();if(q)out=out.filter(r=>rowText(r).includes(q));if(currentView==='purchase'&&filters.purchaseOrigin)out=out.filter(r=>r.purchaseOrigin===filters.purchaseOrigin);if(filters.from)out=out.filter(r=>rowDate(r)==='-'||rowDate(r)>=filters.from);if(filters.to)out=out.filter(r=>rowDate(r)==='-'||rowDate(r)<=filters.to);if(filters.status==='대기')out=out.filter(r=>!/완료|RECEIVED|COMPLETE|FINAL|SHIPPED|DONE/.test(String(r.status||r.inspection)));if(filters.status==='완료')out=out.filter(r=>/완료|RECEIVED|COMPLETE|FINAL|SHIPPED|DONE/.test(String(r.status||r.inspection)));return out.slice(0,num(filters.limit)||50)}
function renderRowsOnly(){clearTimeout(renderRowsOnly.t);renderRowsOnly.t=setTimeout(render,100)}
function tableHtml(schema,rows){if(!rows.length)return'<div class="empty">조건에 맞는 자료가 없습니다.</div>';const totalWeight=rows.reduce((s,r)=>s+num(r.nw||r.weight||r.stock||r.planWeight),0);return`<div class="table-wrap"><table><thead><tr><th>No.</th>${schema.cols.map(c=>`<th>${c[0]}</th>`).join('')}<th>작업</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td>${schema.cols.map(c=>`<td class="${c[2]==='left'?'left':''} ${c[2]==='link'?'link':''}" ${c[2]==='link'?`onclick="editRow('${esc(r.id)}')"`:''}>${c[1](r)}</td>`).join('')}<td>${schema.edit?`<button class="btn" onclick="editRow('${esc(r.id)}')">수정</button>`:'-'}</td></tr>`).join('')}<tr class="total-row"><td colspan="${schema.cols.length}">합계</td><td>${fmt(totalWeight)} kg</td><td></td></tr></tbody></table></div>`}

function editRow(id){const schema=schemas[currentView],row=schema?.rows().find(x=>String(x.id)===String(id));if(!row||!schema.edit)return;const forms={purchase:purchaseForm,sales:salesForm,inbound:inboundForm,settlement:settlementForm,inventory:inventoryForm,shipping:shippingForm};$('modalTitle').textContent=schema.title+' 수정';$('modalBody').innerHTML=forms[schema.edit](row);$('modal').classList.add('on')}
function input(name,label,value,type='text',wide=false){return`<label class="${wide?'wide':''}">${label}<input name="${name}" type="${type}" value="${esc(value||'')}"></label>`}function select(name,label,value,options){return`<label>${label}<select name="${name}">${options.map(x=>`<option ${String(x)===String(value)?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function formWrap(id,type,fields){return`<form class="form-grid" onsubmit="event.preventDefault();saveEdit('${esc(id)}','${type}',this)">${fields}<div class="wide actions"><button class="btn primary" type="submit">저장·양쪽 프로그램 반영</button><button class="btn" type="button" onclick="closeModal()">취소</button></div></form>`}
function purchaseForm(r){const first=r.rows?.[0]||{};return formWrap(r.id,'purchase',input('company','공급사',r.company)+input('expected','입항예정일',date(r.expected)==='-'?'':date(r.expected),'date')+input('shipment','SHIPMENTS',first.shipment||first.shippingTerm||first.loadingTerm||'')+input('paymentTerm','PAYMENT',first.paymentTerm||first.payment||first.paymentTerms||'')+select('status','구매상태',r.status,['입고대기','구매확정','부분입고','입고완료'])+select('currency','통화',r.currency,['KRW','USD','JPY','EURO'])+input('rate','환율',r.rate,'number')+input('memo','구매 메모',first.purchaseMemo||'','text',true))}
function salesForm(r){const first=r.items?.[0]||r;return formWrap(r.id,'sales',input('customer','고객사',r.customer)+input('shipDate','출하예정일',date(r.shipDate)==='-'?'':date(r.shipDate),'date')+input('shipment','SHIPMENTS',first.shipment||first.shippingTerm||first.deliveryTerm||'')+input('paymentTerm','PAYMENT',first.paymentTerm||first.payment||first.paymentTerms||'')+input('grade','대표강종',r.grade)+input('weight','계획 NW(kg)',r.weight,'number')+select('currency','통화',r.currency||'KRW',['KRW','USD','JPY','EURO'])+input('rate','환율',r.exchangeRate||r.rate||1,'number')+select('status','판매·출하상태',r.status,['WAITING','READY','INSTANT_READY','FINAL','SHIPPED','CANCELLED'])+input('memo','S.O 메모',r.memo||'','text',true))}
function inboundForm(r){return formWrap(r.id,'inbound',input('receivedAt','입고일',date(r.receivedAt)==='-'?'':date(r.receivedAt),'date')+select('status','입고상태',r.status,['WAITING','RECEIVED'])+select('inspection','검수상태',r.inspection,['WAITING','IN_PROGRESS','COMPLETE'])+input('memo','입고 특이사항',r.memo||'','text',true))}
function settlementForm(r){return formWrap(r.id,'settlement',select('status','세틀상태',r.rows[0]?.settlementStatus||r.status,['미완료','검토중','완료'])+input('memo','세틀 메모',r.rows[0]?.settlementMemo||'','text',true))}
function inventoryForm(r){return formWrap(r.id,'inventory',input('mainGrade','강종',r.mainGrade)+input('subGrade','소강종',r.subGrade)+input('detailGrade','상세강종',r.detailGrade)+input('nw','N/W(kg)',r.nw,'number')+input('location','보관위치',r.location)+select('status','재고상태',r.status,['ACTIVE','WAITING','DEPLETED','SHIPPED']))}
function shippingForm(r){return formWrap(r.shipmentId||r.id,'shipping',input('shippedAt','출하일자',date(r.shippedAt)==='-'?'':date(r.shippedAt),'date')+input('weight','출하 N/W(kg)',r.shippedWeight||r.weight,'number')+select('status','출하상태',r.status,['WAITING','READY','FINAL','SHIPPED','DONE'])+input('memo','출하 메모',r.shippingMemo||'','text',true))}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
async function saveEdit(id,type,form){const v=formData(form);if(type==='purchase')await commit('구매계획 수정',['pos'],s=>safe(s.pos).filter(x=>(x.poNo||'미지정')===id).forEach(x=>Object.assign(x,{company:v.company,expectedArrivalDate:v.expected,shipment:v.shipment,shippingTerm:v.shipment,loadingTerm:v.shipment,paymentTerm:v.paymentTerm,payment:v.paymentTerm,paymentTerms:v.paymentTerm,purchaseStatus:v.status,currency:v.currency,exchangeRate:num(v.rate),purchaseMemo:v.memo,updatedAt:new Date().toISOString(),updatedByName:currentUserName()})));if(type==='sales')await commit('판매계획 수정',['salesOrders'],s=>{const x=s.salesOrders.find(x=>x.id===id);if(x)Object.assign(x,{customer:v.customer,shipDate:v.shipDate,shipment:v.shipment,shippingTerm:v.shipment,deliveryTerm:v.shipment,paymentTerm:v.paymentTerm,payment:v.paymentTerm,paymentTerms:v.paymentTerm,grade:v.grade,weight:num(v.weight),status:v.status,memo:v.memo,updatedAt:new Date().toISOString(),updatedByName:currentUserName()})});if(type==='inbound')await commit('입고현황 수정',['pos'],s=>{const x=s.pos.find(x=>x.id===id);if(x)Object.assign(x,{receivedAt:v.receivedAt?v.receivedAt+'T00:00:00.000Z':'',receiptStatus:v.status,inspectionStatus:v.inspection,receiptMemo:v.memo,updatedAt:new Date().toISOString(),updatedByName:currentUserName()})});if(type==='settlement')await commit('세틀현황 수정',['pos'],s=>safe(s.pos).filter(x=>(x.poNo||'미지정')===id).forEach(x=>Object.assign(x,{settlementStatus:v.status,settlementMemo:v.memo,settlementUpdatedAt:new Date().toISOString(),settlementUpdatedBy:currentUserName()})));if(type==='inventory')await commit('재고상세 수정',['bags'],s=>{const x=s.bags.find(x=>x.id===id);if(x)Object.assign(x,{mainGrade:v.mainGrade,grade:v.mainGrade,subGrade:v.subGrade,detailGrade:v.detailGrade,weight:num(v.nw),netWeight:num(v.nw),location:v.location,status:v.status,updatedAt:new Date().toISOString(),updatedByName:currentUserName()})});if(type==='shipping')await commit('출고현황 수정',['shipments','salesOrders'],s=>{let x=s.shipments.find(x=>x.id===id);if(!x){const order=s.salesOrders.find(x=>x.id===id);x={id:crypto.randomUUID(),salesOrderId:order?.id||id,soNo:order?.soNo||'',createdAt:new Date().toISOString()};s.shipments.push(x)}Object.assign(x,{shippedAt:v.shippedAt?v.shippedAt+'T00:00:00.000Z':'',weight:num(v.weight),shippedWeight:num(v.weight),status:v.status,shippingMemo:v.memo,updatedAt:new Date().toISOString(),updatedByName:currentUserName()})});closeModal()}
function closeModal(){$('modal').classList.remove('on');document.querySelector('#modal .modal-card')?.classList.remove('wide-modal')}
function renderDaily(){const rows=todayAudits().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));$('pageTitle').textContent='일일 작업일지';$('content').innerHTML=`<div class="dashboard-head"><div><h1>일일 작업일지</h1><p>${nowDate()} · 현장관리와 MES의 작업기록 통합</p></div><button class="btn primary" onclick="openDailyForm()">+ 작업일지 추가</button></div><div class="kpis">${kpi('총 작업',rows.length+'건','오늘')}${kpi('입고',rows.filter(x=>/RECEIPT|입고/.test(x.action+' '+x.label)).length+'건','완료')}${kpi('검수·생산',rows.filter(x=>/INSPECTION|WORK|검수|생산/.test(x.action+' '+x.label)).length+'건','작업')}${kpi('출하',rows.filter(x=>/SHIP|출하/.test(x.action+' '+x.label)).length+'건','완료')}${kpi('작업자',new Set(rows.map(x=>x.operatorName||x.actorName).filter(Boolean)).size+'명','참여')}</div><div class="panel">${rows.length?`<div class="table-wrap" style="max-height:none"><table><thead><tr><th>시간</th><th>작업자</th><th>구분</th><th>번호</th><th>내용</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${dt(x.createdAt).slice(11)}</td><td>${esc(x.operatorName||x.actorName||'-')}</td><td>${esc(x.action||'-')}</td><td>${esc(x.packageNo||x.poNo||x.soNo||x.completionNo||'-')}</td><td class="left">${esc(x.label||x.note||x.reason||x.instruction||'-')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">오늘 기록이 없습니다.</div>'}</div>`}
function openDailyForm(){$('modalTitle').textContent='작업일지 추가';$('modalBody').innerHTML=formWrap('new','daily',input('category','작업구분','일반업무')+input('reference','관련번호','')+`<label class="wide">작업내용<textarea name="note" required></textarea></label>`);$('modal').classList.add('on')}
const saveEditBase=saveEdit;saveEdit=async function(id,type,form){if(type!=='daily')return saveEditBase(id,type,form);const v=formData(form);await commit('작업일지 등록',['auditLogs'],s=>s.auditLogs.push({id:crypto.randomUUID(),action:'MES_DAILY_NOTE',category:v.category,reference:v.reference,label:v.note,note:v.note,operatorName:currentUserName(),operatorEmail:authUser?.email||'',createdAt:new Date().toISOString()}));closeModal();renderDaily()}

</body></html>`,blob=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`신성금속_MES_${schema.title}_${nowDate()}.xls`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

<script id="mesSharedDetailV2">
/* MES와 현장관리의 동일 공용자료를 재로그인 뒤에도 보존하고, 목록→상세→수정 흐름을 제공한다. */
const MES_CACHE_KEY_V2='shinsung-mes-shared-state-cache-v2';
let mesCurrentDetail={view:'',id:''};
function mesBusinessCount(payload){return['pos','splits','inputs','bags','salesOrders','shipments','workWaits','domesticReceipts'].reduce((n,key)=>n+safe(payload?.[key]).length,0)}
function mesReadCache(){try{const value=JSON.parse(localStorage.getItem(MES_CACHE_KEY_V2)||'null');return value?.payload?value:null}catch(_){return null}}
function mesWriteCache(payload,rev){try{localStorage.setItem(MES_CACHE_KEY_V2,JSON.stringify({payload,revision:rev,savedAt:new Date().toISOString()}))}catch(_){}}
async function mesFetchState(){let last;for(let i=0;i<3;i++){try{return await readState()}catch(error){last=error;if(i<2)await new Promise(resolve=>setTimeout(resolve,300*(i+1)))}}throw last}
let mesLoadPromise=null;
loadState=async function loadMesDurableState(shouldRender=true){if(mesLoadPromise)return mesLoadPromise;mesLoadPromise=(async()=>{const cached=mesReadCache();if(cached?.payload){const cachedRevision=num(cached.revision),needsCachePaint=!mesBusinessCount(state)||cachedRevision>revision;if(needsCachePaint){state=defaults(cached.payload);revision=cachedRevision;if(shouldRender)render()}setSync('저장된 자료 표시 · 최신 변경 확인 중');try{const remoteRevision=await readRevision();if(remoteRevision===revision){lastLoad=Date.now();setSync('빠른 동기화 완료 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));return true}}catch(_){/* 전체자료 요청으로 한 번 더 확인 */}}try{setSync('변경자료 동기화 중');const out=await mesFetchState();if(!out?.payload)throw Error('공용 서버 응답에 업무자료가 없습니다.');state=defaults(out.payload);revision=num(out.revision);lastLoad=Date.now();mesWriteCache(state,revision);setSync('실시간 연결 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));if(shouldRender)render();return true}catch(error){if(cached?.payload){state=defaults(cached.payload);revision=Math.max(revision,num(cached.revision));setSync('저장자료 표시 · 서버 재연결 대기',true);if(shouldRender)render();toast('서버 재연결 중입니다. 마지막 동기화 자료는 유지됩니다.',true);return false}setSync('서버 연결 실패',true);toast(error.message,true);return false}})();try{return await mesLoadPromise}finally{mesLoadPromise=null}}
commit=async function commitMesDurable(label,collections,mutate){$('progress').classList.add('on');try{for(let attempt=0;attempt<4;attempt++){const latest=await mesFetchState(),draft=defaults(structuredClone(latest.payload));mutate(draft);const changes={};collections.forEach(key=>changes[key]=draft[key]);const audit={id:crypto.randomUUID(),action:'MES_UPDATE',label,operatorName:currentUserName(),operatorEmail:authUser?.email||'',createdAt:new Date().toISOString()};changes.auditLogs=[...safe(draft.auditLogs),audit];const response=await fetch('/api/scrap-state',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({changes,baseRevision:num(latest.revision)})});let out={};try{out=await response.json()}catch(_){out={}}if(response.status===409)continue;if(!response.ok)throw Error(out.error||`저장 HTTP ${response.status}`);state=draft;revision=num(out.revision)||num(latest.revision)+1;mesWriteCache(state,revision);setSync('저장 완료 · 현장관리 동시 반영');render();toast(label+' 저장 완료 · 재로그인 후에도 유지됩니다.');return true}throw Error('다른 작업자의 저장과 반복 충돌했습니다. 다시 눌러 주세요.')}catch(error){toast(label+' 실패: '+error.message,true);return false}finally{$('progress').classList.remove('on')}}
function mesInputWeight(bagId){return safe(state.inputs).filter(x=>x.bagId===bagId&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)}
function mesMovedWeight(bagId){return safe(state.inputs).filter(x=>x.sourceBagId===bagId&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)}
function mesShippedWeight(bagId){return safe(state.shipmentAllocations).filter(x=>x.bagId===bagId&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)}
function mesReturnedWeight(bagId){return safe(state.returnReceipts).filter(x=>x.bagId===bagId&&x.status!=='CANCELLED').reduce((s,x)=>s+num(x.weight),0)}
function mesBagStock(bag){const hasLedger=safe(state.inputs).some(x=>(x.bagId===bag.id||x.sourceBagId===bag.id)&&x.status!=='CANCELLED')||safe(state.shipmentAllocations).some(x=>x.bagId===bag.id&&x.status!=='CANCELLED')||safe(state.returnReceipts).some(x=>x.bagId===bag.id&&x.status!=='CANCELLED');const ledger=Math.max(0,mesInputWeight(bag.id)-mesMovedWeight(bag.id)-mesShippedWeight(bag.id)+mesReturnedWeight(bag.id));return hasLedger?ledger:num(bag.netWeight||bag.nw||bag.weight||bag.target)}
activeBags=function activeMesBags(){return safe(state.bags).filter(b=>!['DEPLETED','SHIPPED','CANCELLED'].includes(String(b.status||'').toUpperCase())&&mesBagStock(b)>.0001)};
inventoryRows=function mesInventoryRows(){return activeBags().map(b=>({...b,id:b.id,code:bagCode(b),productType:b.productType||'',mainGrade:b.mainGrade||b.grade||'',subGrade:b.subGrade||'',detailGrade:b.detailGrade||'',nw:mesBagStock(b),packing:num(b.packagingWeight||b.tareWeight),gw:mesBagStock(b)+num(b.packagingWeight||b.tareWeight),location:b.location||'미지정',status:b.status||'ACTIVE',packageNo:b.packageNo||b.sourcePackageNo||'',bag:b}))};
function mesSalesRows(){const groups=groupBy(safe(state.salesOrders).filter(x=>x.status!=='CANCELLED'),x=>x.soNo||x.id);return[...groups].map(([soNo,items])=>({id:soNo,soNo,items,customer:items[0]?.customer||'',grade:[...new Set(items.map(x=>x.grade||[x.productType,x.mainGrade,x.subGrade,x.detailGrade].filter(Boolean).join(' · ')).filter(Boolean))].join(' / '),weight:items.reduce((s,x)=>s+num(x.weight),0),shipDate:items[0]?.shipDate,status:items.every(x=>['FINAL','SHIPPED','DONE'].includes(x.status))?items[0]?.status||'FINAL':items[0]?.status||'WAITING',type:items[0]?.packingListType==='OVERSEAS'?'수출':'국내',currency:items[0]?.currency||(items[0]?.packingListType==='OVERSEAS'?'USD':'KRW'),amount:items.reduce((s,x)=>s+num(x.amount||x.salesAmount||num(x.weight)*num(x.unitPrice)),0)}))}
salesRows=mesSalesRows;
shipmentRows=function mesShipmentRows(){return salesRows().map(order=>{const related=safe(state.shipments).filter(x=>x.soNo===order.soNo||order.items.some(item=>x.salesOrderId===item.id)),alloc=safe(state.shipmentAllocations).filter(a=>related.some(x=>x.id===a.shipmentId)),lists=safe(state.packingLists).filter(p=>p.soNo===order.soNo||order.items.some(item=>p.salesOrderId===item.id)),last=related.slice().sort((a,b)=>String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt)))[0]||{};return{...order,shipmentId:last.id||'',shipments:related,allocations:alloc,packingLists:lists,shippedWeight:alloc.length?alloc.reduce((s,x)=>s+num(x.weight),0):related.reduce((s,x)=>s+num(x.weight||x.shippedWeight),0),shippedAt:last.shippedAt||last.shippingCompletedAt,status:last.status||order.status,packingList:lists.map(x=>x.packingListNo).filter(Boolean).join(' / ')}})};
schemas.sales.rows=salesRows;schemas.shippingPlan.rows=salesRows;schemas.shipping.rows=shipmentRows;
schemas.inventory.rows=()=>{const map=groupBy(inventoryRows(),r=>[r.productType,r.mainGrade,r.subGrade].join('|'));return[...map].map(([key,rows])=>({id:key,productType:rows[0].productType,mainGrade:rows[0].mainGrade,subGrade:rows[0].subGrade,stock:rows.reduce((s,x)=>s+x.nw,0),packing:rows.length,locations:[...new Set(rows.map(x=>x.location))].join(' / '),rows}))};
schemas.stockDetail.rows=inventoryRows;schemas.production.edit='production';schemas.inventory.edit='inventoryGroup';
function mesHtmlText(value){const box=document.createElement('div');box.innerHTML=String(value??'');return box.textContent||''}
function mesLineData(container){return Object.fromEntries([...container.querySelectorAll('input[name],select[name],textarea[name]')].map(input=>[input.name,input.value]))}
tableHtml=function mesDetailTable(schema,rows){if(!rows.length)return'<div class="empty">조건에 맞는 자료가 없습니다.</div>';const total=rows.reduce((s,r)=>s+num(r.nw||r.weight||r.stock||r.planWeight),0);return`<div class="table-wrap"><table><thead><tr><th>No.</th>${schema.cols.map(c=>`<th>${c[0]}</th>`).join('')}<th>상세</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="click-row" onclick="openMesDetail('${currentView}','${esc(r.id)}')"><td>${i+1}</td>${schema.cols.map(c=>`<td class="${c[2]==='left'?'left':''}">${c[1](r)}</td>`).join('')}<td class="row-action"><button class="btn primary" onclick="event.stopPropagation();openMesDetail('${currentView}','${esc(r.id)}')">상세보기</button></td></tr>`).join('')}<tr class="total-row"><td colspan="${schema.cols.length}">합계</td><td>${fmt(total)} kg</td><td></td></tr></tbody></table></div>`}
cardsHtml=function mesDetailCards(schema,rows){return`<div class="cards">${rows.map(r=>`<article class="mobile-card" onclick="openMesDetail('${currentView}','${esc(r.id)}')"><h3>${esc(r.poNo||r.soNo||r.packageNo||r.code||r.mainGrade||'자료')}</h3><dl>${schema.cols.slice(0,7).map(c=>`<dt>${c[0]}</dt><dd>${c[1](r)}</dd>`).join('')}</dl><button class="btn primary" onclick="event.stopPropagation();openMesDetail('${currentView}','${esc(r.id)}')">현장 상세내역 보기</button></article>`).join('')||'<div class="empty">자료가 없습니다.</div>'}</div>`}
const mesBaseRenderV2=render;

function mesMaxDate(values){

  (values||[]).forEach(function(value){
    if(!value) return;
    var time=Date.parse(value);
    if(Number.isFinite(time)&&time>bestTime){bestTime=time;best=String(value);}
  });

}
function mesRecordDate(record){
  if(!record||typeof record!=="object") return "";
  var values=[

    record.completedAt,record.confirmedAt,record.shippedAt,record.shippingCompletedAt,
    record.receiptCompletedAt,record.settlementUpdatedAt,record.cancelledAt

    if(Array.isArray(record[key])) record[key].forEach(function(item){values.push(mesRecordDate(item));});
  });

function mesBuildDateIndex(){

    if(key==null||key==="") return;
    var next=mesMaxDate([value,map.get(String(key))]);

  }

    "pos","salesOrders","bags","shipments","shipmentAllocations","packingLists",
    "splits","inputs","losses","workWaits","waitingMoves","receiptWorks",
    "shippingWorks","shippingAreaMoves","returnReceipts","domesticReceipts","auditLogs"
  ].forEach(function(collection){

      var saved=mesRecordDate(record);
      touch(index.id,record.id,saved);

      touch(index.so,record.soNo,saved);
      touch(index.pkg,record.packageNo||record.sourcePackageNo,saved);

function mesSearchText(row){
  var allowed={
    poNo:1,soNo:1,packageNo:1,sourcePackageNo:1,internalPackageNo:1,
    completionNo:1,bagNo:1,code:1,requestNo:1,receiptRequestNo:1,shippingRequestNo:1,
    company:1,supplier:1,customer:1,partner:1,vendor:1,
    grade:1,originalGrade:1,sourceGrade:1,finalGrade:1,gradeLabel:1,customerGrade:1,finalGradeLabel:1,tradeType:1,tradeTypes:1,
    productType:1,mainGrade:1,subGrade:1,detailGrade:1,itemName:1,description:1,
    location:1,locations:1,from:1,to:1,containerNo:1,sealNo:1,
    status:1,receiptStatus:1,inspectionStatus:1,workStatus:1,workType:1,type:1,
    memo:1,note:1,label:1,sourceLabel:1,rawSourceLabel:1,mapping:1
  };
  var nested={rows:1,items:1,bag:1,record:1,sources:1,members:1,shipments:1,packingLists:1,allocations:1};
  var values=[],seen=new Set();
  function walk(value,key,depth){
    if(value==null||depth>4)return;
    if(typeof value==='string'){if(allowed[key])values.push(value);return;}
    if(typeof value==='number'||typeof value==='boolean')return;
    if(typeof value!=='object'||seen.has(value))return;
    seen.add(value);
    if(Array.isArray(value)){value.forEach(function(item){walk(item,key,depth+1);});return;}
    Object.keys(value).forEach(function(childKey){
      if(allowed[childKey])walk(value[childKey],childKey,depth+1);
      else if(nested[childKey])walk(value[childKey],childKey,depth+1);
    });
  }
  walk(row,'row',0);
  return values.join(' ').toLowerCase();
}

window.filtered=function(rows){

  if(q) out=out.filter(function(row){return mesSearchText(row).includes(q);});
  var location=String(filters.location||"").trim().toLowerCase();

    var inventoryMode=filters.status==="유사강종"?"grouped":String(filters.inventoryMode||"original");
    var familyInventoryRows=out.filter(function(row){return !!row.isFamilySummary;});
    var originalInventoryRows=out.filter(function(row){return !row.isFamilySummary;});
    var preferredInventoryRows=inventoryMode==="grouped"?familyInventoryRows:originalInventoryRows;
    var fallbackInventoryRows=inventoryMode==="grouped"?originalInventoryRows:familyInventoryRows;
    // A stale view preference must never hide the shared inventory.  When the
    // selected representation has no rows, show the available representation.
    out=preferredInventoryRows.length?preferredInventoryRows:fallbackInventoryRows;
    if(filters.status==="입항예정")out=out.filter(function(row){return num(row.arrival)>0;});
    if(filters.status==="미검수")out=out.filter(function(row){return num(row.uninspected)>0;});
    if(filters.status==="작업대기")out=out.filter(function(row){return num(row.workWaiting)>0;});
    if(filters.status==="완료")out=out.filter(function(row){return num(row.completed)>0;});
    if(filters.status==="유사강종"&&out.some(function(row){return !!row.isFamilySummary;}))out=out.filter(function(row){return !!row.isFamilySummary;});
  }else{
    if(filters.status==="대기") out=out.filter(function(row){return !/완료|RECEIVED|COMPLETE|FINAL|SHIPPED|DONE/i.test(String(row.status||row.inspection));});

function mesCompletedStatus(value){

function mesShipmentIsComplete(shipment){
  return !!shipment&&(mesCompletedStatus(shipment.status)||!!(shipment.shippedAt||shipment.shippingCompletedAt||shipment.completedAt));
}
function mesItemIsComplete(item){
  if(mesCompletedStatus(item&&item.status)) return true;
  return safe(state.shipments).some(function(shipment){
    if(!mesShipmentIsComplete(shipment)) return false;
    if(shipment.salesOrderId) return String(shipment.salesOrderId)===String(item.id);
    return shipment.soNo&&String(shipment.soNo)===String(item.soNo);
  });
}

      weight:pending.reduce(function(sum,item){return sum+num(item.weight);},0),

function mesPackingDocItems(lines){

    var container=line.match(/CONTAINER\s*(?:NO\.?|NUMBER|#)?\s*[:#-]?\s*([A-Z]{3,5}\d{5,})/i);

      shippingRequestNo:source.shippingRequestNo||"",
      shippingRequestStatus:source.shippingRequestStatus||"",
      containerSize:source.shippingContainerSize||source.containerSize||"",
      shippingRequirements:source.shippingRequirements||source.requestMemo||"",
      vehicleNo:source.shippingVehicleNo||source.vehicleNo||"",
      driverPhone:source.driverPhone||source.contact||"",
      requestOperatorName:source.shippingRequestOperatorName||source.updatedByName||source.createdByName||"",
      productTypes:productTypes,
      mainGrades:mainGrades||row.grade||"",
      subGrades:subGrades,
      detailGrades:detailGrades,
      unitPrices:unitPrices,
      exchangeRates:exchangeRates,
      currency:currency,
      requestState:(source.shippingRequestStatus==="REQUESTED"||source.shippingRequestedAt)?"요청완료":"미요청",
      _salesSearch:search+" "+requestDate+" "+(source.shippingRequestNo||"")+" "+(source.shippingRequirements||"")+" "+(source.vehicleNo||"")+" "+(source.driverPhone||""),
      _savedAt:requestDate?requestDate+"T12:00:00":row._savedAt
    });
  });
}

function requestExists(row){
  return safe(row.items).some(function(item){return item.shippingRequestStatus==="REQUESTED"||item.shippingRequestedAt;});
}
function requestButton(row){
  var done=requestExists(row),encoded=encodeURIComponent(row.soNo||row.id||"");
  return "<button class='btn shipping-request-action "+(done?"done":"")+"' onclick='event.stopPropagation();openMesShippingRequest(decodeURIComponent(\""+encoded+"\"))'>"+(done?"출하요청완료 · 수정":"출하요청")+"</button>";
}
function decorateShippingRequestButtons(){
  if(currentView!=="sales")return;
  var rows=filtered(schemas.sales.rows());
  document.querySelectorAll("#content .table-wrap tbody tr:not(.total-row)").forEach(function(tr,index){
    var row=rows[index];if(!row)return;
    var old=tr.querySelector(".shipping-request-action");if(old)old.remove();
    if(tr.lastElementChild)tr.lastElementChild.insertAdjacentHTML("beforeend",requestButton(row));
  });
  document.querySelectorAll("#content .cards .mobile-card").forEach(function(card,index){
    var row=rows[index];if(!row)return;
    var old=card.querySelector(".shipping-request-action");if(old)old.remove();
    card.insertAdjacentHTML("beforeend",requestButton(row));
  });
  var actions=document.querySelector("#content .dashboard-head .actions");
  if(actions&&!actions.querySelector(".shipping-request-help")){
    actions.insertAdjacentHTML("afterbegin","<button class='btn shipping-request-quick shipping-request-help' onclick='event.stopPropagation();toast(\"아래 판매계획의 출하요청 버튼을 누르면 요청일·컨테이너·필수요청사항을 등록할 수 있습니다.\")'>출하요청 작성 안내</button>");
  }
}
function decoratePurchaseButtonsFixed(){
  if(currentView!=="purchase")return;
  var rows=filtered(schemas.purchase.rows());
  document.querySelectorAll("#content .table-wrap tbody tr:not(.total-row)").forEach(function(tr,index){
    var row=rows[index];if(!row)return;
    var old=tr.querySelector(".inbound-request-action");if(old)old.remove();
    var existing=typeof poRequest==="function"&&poRequest(row.poNo);
    var html="<button class='btn inbound-request-action' onclick='event.stopPropagation();openInboundRequestBuilder(decodeURIComponent(\""+encodeURIComponent(row.poNo)+"\"))'>"+(existing?"입고요청 수정":"입고요청")+"</button>";
    if(tr.lastElementChild)tr.lastElementChild.insertAdjacentHTML("beforeend",html);
  });
  document.querySelectorAll("#content .cards .mobile-card").forEach(function(card,index){
    var row=rows[index];if(!row)return;
    var old=card.querySelector(".inbound-request-action");if(old)old.remove();
    var existing=typeof poRequest==="function"&&poRequest(row.poNo);
    card.insertAdjacentHTML("beforeend","<button class='btn inbound-request-action' onclick='event.stopPropagation();openInboundRequestBuilder(decodeURIComponent(\""+encodeURIComponent(row.poNo)+"\"))'>"+(existing?"입고요청 수정":"입고요청")+"</button>");
  });
  var actions=document.querySelector("#content .dashboard-head .actions");
  if(actions&&!actions.querySelector(".purchase-mode-actions")){
    actions.insertAdjacentHTML("afterbegin","<span class='purchase-mode-actions shipping-plan-quick-actions'><button class='btn primary' onclick='event.stopPropagation();openMesDirectPoRegistration()'>+ P.O 직접입력</button><button class='btn shipping-request-quick' onclick='event.stopPropagation();openMesDocumentPoRegistration()'>+ 거래처 서류로 등록</button></span>");
  }
}
window.openMesShippingRequest=function(soNo){
  var row=safe(schemas.sales.rows()).find(function(item){return String(item.soNo)===String(soNo)||String(item.id)===String(soNo);});
  if(!row)return toast("판매계획 S.O 자료를 찾지 못했습니다.",true);
  var source=requestSource(row),savedContainer=source.shippingContainerSize||source.containerSize||"";
  $("modalTitle").textContent=(row.soNo||"S.O")+" · 출하요청 작성";
  var itemRows=safe(row.items).map(function(item,index){
    return "<tr><td>"+(index+1)+"</td><td>"+esc(item.productType||"-")+"</td><td>"+esc(item.mainGrade||item.grade||"-")+"</td><td>"+esc(item.subGrade||"-")+"</td><td>"+esc(item.detailGrade||"-")+"</td><td>"+fmt(item.weight)+" kg</td><td>"+esc(item.currency||"-")+"</td><td>"+fmt(item.exchangeRate)+"</td><td>"+fmt(item.unitPrice)+"</td><td>"+fmt(item.amount||num(item.weight)*num(item.unitPrice))+"</td></tr>";
  }).join("");
  $("modalBody").innerHTML="<div class='shipping-request-info'><div><small>S.O</small><b>"+esc(row.soNo)+"</b></div><div><small>판매처</small><b>"+esc(row.customer)+"</b></div><div><small>출항예정일</small><b>"+esc(date(row.shipDate))+"</b></div><div><small>판매중량</small><b>"+fmt(row.weight)+" kg</b></div></div>"
    +"<form id='mesShippingRequestForm' class='form-grid' onsubmit='saveMesShippingRequest(event,this,decodeURIComponent(\""+encodeURIComponent(row.soNo)+"\"))'>"
    +"<label>출하요청일 <span class='shipping-request-required'>필수</span><input name='requestDate' type='date' required value='"+esc(source.shippingRequestDate||source.requestDate||nowDate())+"'></label>"
    +"<label class='wide'>컨테이너 선택 <span class='shipping-request-required'>필수</span><div class='container-choice'>"
    +["20FT","40FT","OPEN TOP"].map(function(value){return "<label><input type='radio' name='containerSize' value='"+value+"' "+(savedContainer===value?"checked":"")+"><span>"+value+"</span></label>";}).join("")
    +"</div></label>"
    +"<label class='wide'>필수요청사항 <span class='shipping-request-required'>필수</span><textarea name='shippingRequirements' required placeholder='출하 작업에 반드시 필요한 요청사항을 입력하세요.'>"+esc(source.shippingRequirements||source.requestMemo||"")+"</textarea></label>"
    +"<label>차량번호 <small>선택</small><input name='vehicleNo' value='"+esc(source.shippingVehicleNo||source.vehicleNo||"")+"'></label>"
    +"<label>기사전번 <small>선택</small><input name='driverPhone' type='tel' value='"+esc(source.driverPhone||source.contact||"")+"'></label>"
    +"<div class='wide shipping-request-note'>저장하면 동일 공용 서버의 신성 스크랩 현장관리 ‘출하요청 진행현황’에 즉시 반영됩니다.</div>"
    +"<div class='wide table-wrap'><table><thead><tr><th>No.</th><th>품종</th><th>강종</th><th>소강종</th><th>상세강종</th><th>중량</th><th>통화</th><th>환율</th><th>단가</th><th>금액</th></tr></thead><tbody>"+itemRows+"</tbody></table></div>"
    +"<div class='wide actions'><button class='btn primary'>출하요청 저장</button><button type='button' class='btn' onclick='closeModal()'>취소</button></div></form>";
  $("modal").classList.add("on");
  setTimeout(function(){$("mesShippingRequestForm")?.querySelector("[name=requestDate]")?.focus();},80);
};
function nextShippingRequestNo(){
  var day=nowDate().replace(/-/g,""),max=0;
  safe(state.salesOrders).forEach(function(item){var match=String(item.shippingRequestNo||"").match(new RegExp("^SR-"+day+"-(\\d+)$"));if(match)max=Math.max(max,num(match[1]));});
  return "SR-"+day+"-"+String(max+1).padStart(3,"0");
}
window.saveMesShippingRequest=async function(event,form,soNo){
  event.preventDefault();
  var value=formData(form),container=form.querySelector("[name=containerSize]:checked")?.value;
  if(!value.requestDate)return toast("출하요청일을 입력하세요.",true);
  if(!container)return toast("컨테이너 20FT, 40FT 또는 OPEN TOP을 선택하세요.",true);
  if(!String(value.shippingRequirements||"").trim())return toast("필수요청사항을 입력하세요.",true);
  var row=safe(schemas.sales.rows()).find(function(item){return String(item.soNo)===String(soNo);});
  if(!row)return toast("저장할 S.O 판매계획을 찾지 못했습니다.",true);
  var ids=new Set(safe(row.items).map(function(item){return String(item.id);}));
  var source=requestSource(row),stamp=new Date().toISOString(),requestNo=source.shippingRequestNo||nextShippingRequestNo();
  var ok=await commit("MES 출하요청 저장",["salesOrders"],function(shared){
    safe(shared.salesOrders).forEach(function(item){
      if(!ids.has(String(item.id)))return;
      var oldStatus=String(item.status||"");
      Object.assign(item,{
        shippingRequestNo:requestNo,
        shippingRequestDate:value.requestDate,
        shippingRequestedAt:stamp,
        shippingRequestStatus:"REQUESTED",
        shippingContainerSize:container,
        containerSize:container,
        shippingRequirements:String(value.shippingRequirements).trim(),
        requestMemo:String(value.shippingRequirements).trim(),
        shippingVehicleNo:String(value.vehicleNo||"").trim(),
        vehicleNo:String(value.vehicleNo||"").trim(),
        driverPhone:String(value.driverPhone||"").trim(),
        contact:String(value.driverPhone||"").trim(),
        shippingRequestOperatorName:currentUserName(),
        shippingRequestOperatorEmail:authUser?.email||"",
        updatedAt:stamp,
        updatedByName:currentUserName(),
        status:["AREA_COMPLETE","INSTANT_READY","WAITING"].includes(oldStatus)?oldStatus:"WAITING"
      });
    });
  });
  if(ok){
    closeModal();
    openView("shippingPlan");
    toast("출하요청 저장완료 · 신성 현장관리 출하요청에 반영했습니다.");
  }
};

var baseFilterControlsShipping=window.filterControls;
window.filterControls=function(){
  var html=baseFilterControlsShipping();
  if(currentView!=="shippingPlan")return html;
  return html.replace(/저장일 시작/g,"요청일 시작").replace(/저장일 종료/g,"요청일 종료").replace(/번호·회사·강종/g,"요청일·S.O·판매처·품종·강종·차량·기사전번");
};
var baseRenderShippingV2=window.render;
window.render=function(){
  var result=baseRenderShippingV2.apply(this,arguments);
  decoratePurchaseButtonsFixed();
  decorateShippingRequestButtons();
  requestAnimationFrame(function(){decoratePurchaseButtonsFixed();decorateShippingRequestButtons();});
  return result;
};
if(currentView)render();
document.documentElement.dataset.mesShippingRequestV2="loaded";

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10231f">
<title>신성 스크랩 입고검수·재포장</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--ink:#10231f;--green:#0d725d;--lime:#d9f566;--amber:#f5b942;--red:#a72d2d;--bg:#f3f7f5;--line:#d5e1dc;--muted:#64736d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:18px}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;min-height:76px;display:flex;align-items:center;justify-content:space-between;padding:10px max(14px,calc((100% - 1100px)/2))}.brand{border:0;background:none;color:#fff;text-align:left;font-weight:900}.brand small{display:block;opacity:.7;font-size:12px}.server{border:0;border-radius:20px;background:#ffffff18;color:#fff;padding:9px 12px;font-size:12px}.wrap{max-width:1100px;margin:auto;padding:20px 14px 104px}.view{display:none}.view.on{display:block}.eyebrow{font-size:13px;color:var(--green);font-weight:900}h1{font-size:clamp(30px,6vw,46px);margin:5px 0 20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.homebtn{min-height:145px;border:0;border-radius:22px;padding:22px;text-align:left;display:flex;flex-direction:column;background:#fff;font-weight:900}.homebtn strong{font-size:25px;margin-top:auto}.homebtn.green{background:var(--green);color:#fff}.homebtn.lime{background:var(--lime)}.homebtn.amber{background:var(--amber)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:13px 0}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}label{display:block;font-size:13px;font-weight:900}input,select,textarea{width:100%;min-height:56px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:10px;margin-top:6px}textarea{min-height:88px}.wide{grid-column:span 2}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.btn,.file{border:0;border-radius:12px;min-height:54px;padding:11px 16px;background:#e4ebe7;color:var(--ink);font-weight:900;cursor:pointer}.btn.primary{background:var(--green);color:#fff}.btn.warn{background:var(--amber)}.btn.danger{background:#ffe4e4;color:var(--red)}.file input{display:none}.msg{display:none;border-radius:12px;padding:12px;margin:10px 0;background:#e7f6ef;color:#155a45;font-weight:900}.msg.on{display:block}.msg.err{background:#ffe3e3;color:#7b1d1d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.stat small,.stat b{display:block}.stat small{color:var(--muted)}.stat b{font-size:27px;margin-top:5px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:850px}th{background:var(--ink);color:#fff;padding:12px 8px;font-size:13px}td{border-bottom:1px solid var(--line);padding:11px 8px;text-align:center}.qrgrid,.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.qrcard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;text-align:center}.qrcard img{width:210px;height:210px;max-width:100%}.qrcard b,.qrcard span{display:block}.photo{border:2px dashed #94a69e;border-radius:14px;min-height:100px;display:grid;place-items:center;text-align:center;padding:8px}.photo input{display:none}.photo.ok{border-style:solid;border-color:var(--green);background:#e8f6ef}.preview{width:100%;max-height:230px;object-fit:cover;border-radius:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.summary div{background:#f1f6f3;border-radius:12px;padding:13px}.summary small,.summary b{display:block}.summary b{font-size:21px;margin-top:5px}.scanner{background:#07110e;border-radius:18px;overflow:hidden;position:relative;min-height:260px}.scanner video{display:block;width:100%;max-height:440px;object-fit:cover}.scanline{position:absolute;left:10%;right:10%;top:50%;border-top:4px solid var(--lime)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:#fff;min-height:72px;font-size:13px;font-weight:900;color:var(--muted)}.bottom button.on{color:var(--green);background:#eff8f4}.labels{display:none}.label{height:52mm;border:1px solid #111;display:grid;grid-template-columns:36mm 1fr;align-items:center;padding:4mm;break-inside:avoid}.label img{width:31mm;height:31mm}.label b,.label span{display:block}.label .pkg{font-size:18pt}.label .co{font-size:14pt}.label .gr{font-size:13pt;margin:2mm 0}.donecard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.photos-view{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos-view figure{margin:0;background:#f1f6f3;border:1px solid var(--line);border-radius:12px;overflow:hidden}.photo-open{display:block;width:100%;padding:0;border:0;background:none}.photos-view img{display:block;width:100%;height:180px;object-fit:cover;background:#e8eeeb}.photos-view figcaption{padding:10px 8px;text-align:center;font-weight:900;line-height:1.45}.photos-view figcaption small{display:block;color:var(--muted);font-size:12px}.photo-modal{display:none;position:fixed;inset:0;z-index:100;background:#07110eee;padding:18px;align-items:center;justify-content:center}.photo-modal.on{display:flex}.photo-modal-inner{width:min(100%,1000px);max-height:96vh;display:flex;flex-direction:column;gap:10px}.photo-modal img{max-width:100%;max-height:78vh;object-fit:contain;background:#000;border-radius:12px}.photo-modal-title{color:#fff;text-align:center;font-weight:900;font-size:21px}.photo-modal-close{align-self:center;border:0;border-radius:12px;min-height:52px;padding:10px 24px;background:var(--lime);font-weight:900}
@media(max-width:720px){.form{grid-template-columns:1fr 1fr}.stats,.summary{grid-template-columns:1fr 1fr}.qrgrid,.photogrid{grid-template-columns:1fr 1fr}.bottom button{font-size:11px;min-height:67px}}@media(max-width:470px){.grid,.form,.qrgrid,.photogrid{grid-template-columns:1fr}.wide{grid-column:auto}.actions>*{width:100%}.server{font-size:0}.server:after{content:"●";font-size:16px}}@page{size:A4 portrait;margin:9mm}@media print{body>*:not(.labels){display:none!important}.labels{display:grid!important;grid-template-columns:1fr 1fr;grid-auto-rows:52mm;width:192mm;margin:auto}}
</style>
</head>
<body>
<header class="top"><button class="brand" onclick="show('home')">신성 스크랩 현장관리<small>독립 배포판 · 입고검수 · QR · 재포장</small></button><button id="server" class="server" onclick="loadState()">● 서버 연결 중</button></header>
<main class="wrap">
  <section id="home" class="view on"><p class="eyebrow">모든 사용자 공용 서버</p><h1>현장 작업을 선택하세요</h1><div class="grid">
    <button class="homebtn lime" onclick="show('po')"><span>P.O</span><strong>P.O·사내입고 등록</strong></button>
    <button class="homebtn" onclick="show('qr')"><span>QR</span><strong>QR 생성·A4 출력</strong></button>
    <button class="homebtn green" onclick="scanPurpose='inspect';show('scan')"><span>카메라</span><strong>사내입고 QR 촬영</strong></button>
    <button class="homebtn amber" onclick="show('repack')"><span>500kg</span><strong>재포장 관리</strong></button>
    <button class="homebtn" onclick="show('completed')"><span>✓</span><strong>검수완료·사진 조회</strong></button>
  </div><div class="stats" style="margin-top:14px"><div class="stat"><small>사내입고</small><b id="stPos">0</b></div><div class="stat"><small>검수 분류</small><b id="stSplits">0</b></div><div class="stat"><small>검수 완료</small><b id="stDone">0</b></div><div class="stat"><small>출하 마대</small><b id="stBags">0</b></div></div><div class="card"><b>기준정보 관리</b><div class="form" style="margin-top:12px"><label>강종<input id="masterMain" placeholder="예: 니켈"></label><button class="btn primary" onclick="saveMainGrade()">강종 따로 저장</button><label>소강종<input id="masterSub" placeholder="예: INCONEL"></label><button class="btn primary" onclick="saveSubGrade()">소강종 따로 저장</button><label>이동장소<input id="masterLocation" placeholder="예: A동 창고"></label><button class="btn primary" onclick="saveLocationMaster()">장소 저장</button></div><div id="masterInfo" class="msg"></div><div id="masterList" style="font-size:14px;color:var(--muted)"></div></div><div class="card"><b>자료 관리</b><p style="color:var(--muted);font-size:14px">공용 서버 자료를 기기에도 백업합니다.</p><div class="actions"><button class="btn primary" onclick="exportBackup()">백업 내보내기</button><label class="file btn">백업 불러오기<input type="file" accept=".json,application/json" onchange="importBackup(this.files[0]);this.value=''"></label><button class="btn danger" onclick="resetAllData()">전체 자료 초기화</button></div><div id="resetMsg" class="msg"></div></div></section>
  <section id="po" class="view"><p class="eyebrow">입고 등록</p><h1>P.O·사내입고 입력</h1><div class="actions"><button class="btn" onclick="downloadTemplate()">엑셀 양식 다운로드</button><label class="file btn warn">엑셀 업로드<input type="file" accept=".xlsx,.xls" onchange="importExcel(this.files[0]);this.value=''"></label></div><div class="card"><div class="form"><label>P.O 넘버<input id="poNo"></label><label>거래처명<input id="company"></label><label>강종명<input id="grade"></label><label>중량(kg)<input id="weight" type="number" inputmode="decimal"></label></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="addPackage()">사내입고번호 자동생성·등록</button><div id="poMsg" class="msg"></div></div><div class="tablewrap"><table><thead><tr><th>선택</th><th>P.O</th><th>거래처</th><th>강종</th><th>사내입고번호</th><th>최초중량</th></tr></thead><tbody id="poRows"></tbody></table></div></section>
  <section id="qr" class="view"><p class="eyebrow">라벨 출력</p><h1>사내입고번호 QR 생성</h1><div class="card"><label>사내입고번호 검색<input id="qrSearch" placeholder="번호 또는 거래처 검색" oninput="renderQr()"></label></div><div class="actions"><button class="btn" onclick="selectAll(true)">전체 선택</button><button class="btn" onclick="selectAll(false)">선택 해제</button><button class="btn primary" onclick="printLabels()">선택 QR A4 출력</button></div><div id="qrMsg" class="msg"></div><div id="qrGrid" class="qrgrid"></div></section>
  <section id="scan" class="view"><p class="eyebrow">모바일 QR 촬영</p><h1>사내입고번호 QR 스캔</h1><div id="scanBox" class="scanner"><video id="video" playsinline muted></video><div class="scanline"></div></div><div class="actions"><button class="btn primary" onclick="startScan()">카메라 시작</button><button class="btn" onclick="stopScan()">카메라 종료</button></div><div class="card"><label>사내입고번호 검색<input id="manualSearch" placeholder="번호·거래처·강종 검색" oninput="filterManualPackages()"></label><label>검색 결과<select id="manualPackage"></select></label><button class="btn primary" style="width:100%;margin-top:12px" onclick="handleManualScan()">선택 사내입고 확인</button></div><div id="scanMsg" class="msg"></div></section>
  <section id="inspection" class="view"><p class="eyebrow">검수 확정</p><h1 id="inspectTitle">사내입고 검수</h1><div class="summary"><div><small>거래처</small><b id="iCompany">-</b></div><div><small>기존 강종</small><b id="iOldGrade">-</b></div><div><small>최초 중량</small><b id="iWeight">0kg</b></div><div><small>남은 중량</small><b id="iRemain">0kg</b></div></div><div class="card"><div class="form"><label>최종 강종 검색<input id="finalMain" list="mainGradeList" oninput="renderSubGrades()"></label><label>소강종 선택<select id="finalSub"></select></label><label>상세강종 직접 입력<input id="finalDetail" placeholder="필요할 때 직접 입력"></label><label>확정 중량(kg)<input id="finalWeight" type="number" inputmode="decimal"></label></div><datalist id="mainGradeList"></datalist><div class="photogrid" style="margin-top:12px"><label id="shapeLabel" class="photo"><input id="shapePhoto" type="file" accept="image/*" capture="environment" onchange="photoChosen('shapeLabel',this)">＋ 형상 사진 필수</label><label id="analyzerLabel" class="photo"><input id="analyzerPhoto" type="file" accept="image/*" capture="environment" onchange="photoChosen('analyzerLabel',this)">＋ 분석기 사진 필수</label><label id="anomalyLabel" class="photo"><input id="anomalyPhoto" type="file" accept="image/*" capture="environment" onchange="photoChosen('anomalyLabel',this)">＋ 이상 사진 선택</label></div><label style="margin-top:12px">메모<textarea id="memo"></textarea></label><button id="inspectSave" class="btn primary" style="width:100%;margin-top:12px" onclick="saveInspection()">검수 확정 저장</button><div id="inspectMsg" class="msg"></div></div><div id="splitHistory"></div></section>
  <section id="completed" class="view"><p class="eyebrow">완료 자료</p><h1>검수완료·사진·재포장 조회</h1><div class="card"><label>완료 내역 검색<input id="completedSearch" placeholder="사내입고번호·거래처·강종·마대번호 검색" oninput="renderCompleted()"></label><div class="actions"><button class="btn" onclick="selectCompleted(true)">검색 결과 전체 선택</button><button class="btn" onclick="selectCompleted(false)">선택 해제</button><button class="btn primary" onclick="downloadCompletedExcel()">선택 내역 엑셀 다운로드</button></div><div id="completedMsg" class="msg"></div></div><div id="completedList"></div><h2 style="margin-top:28px">재포장 리스트</h2><div id="completedBagList"></div></section>
  <section id="repack" class="view"><p class="eyebrow">출하 마대</p><h1>재포장 500kg·재고 이동</h1><div class="card"><div class="form"><label>출하 마대번호<input id="bagNo" readonly></label><label>최종 강종<input id="bagGrade"></label><label>목표 중량(kg)<input id="bagTarget" type="number" value="500"></label><button class="btn primary" onclick="createBag()">마대 생성</button></div><div id="bagMsg" class="msg"></div></div><div class="card"><label>① 작업할 출하 마대<select id="bagSelect" onchange="renderBag()"></select></label><div class="form" style="margin-top:12px"><label class="wide">② 원 사내입고번호 입력<input id="repackPackageNo" placeholder="예: P000001" onkeydown="if(event.key==='Enter')prepareRepackPackage(this.value)"></label><button class="btn" onclick="prepareRepackPackage(E('repackPackageNo').value)">사내입고 확인</button><button class="btn warn" onclick="startRepackQr()">QR 촬영</button></div><div id="sourceInfo" class="msg"></div><div class="form" style="margin-top:12px"><label class="wide">③ 불러온 사내입고번호<select id="sourcePackage" onchange="fillAvailableWeight()"></select></label><label>이동할 중량(kg)<input id="inputWeight" type="number" inputmode="decimal"></label><button class="btn primary" onclick="addInput()">재포장으로 이동</button></div><div id="bagSummary" class="summary" style="margin-top:12px"></div></div><div class="card"><b>재포장 재고 이동</b><div class="form" style="margin-top:12px"><label class="wide">이동장소 검색·선택<input id="moveLocation" list="locationList" placeholder="저장된 장소 검색"></label><datalist id="locationList"></datalist><button class="btn primary" onclick="moveBagStock()">재고 이동 저장</button></div><div id="moveInfo" class="msg"></div><div id="movementList"></div></div><div id="bagInputs"></div></section>
</main>
<nav class="bottom"><button data-v="home" class="on" onclick="show('home')">⌂<br>홈</button><button data-v="po" onclick="show('po')">P.O<br>등록</button><button data-v="qr" onclick="show('qr')">QR<br>출력</button><button data-v="scan" onclick="scanPurpose='inspect';show('scan')">QR<br>촬영</button><button data-v="completed" onclick="show('completed')">완료<br>조회</button><button data-v="repack" onclick="show('repack')">재포장<br>관리</button></nav>
<section id="labels" class="labels"></section>
<div id="photoModal" class="photo-modal" onclick="if(event.target===this)closePhoto()"><div class="photo-modal-inner"><div id="photoModalTitle" class="photo-modal-title"></div><img id="photoModalImage" alt="확대 검수 사진"><button class="photo-modal-close" onclick="closePhoto()">사진 닫기</button></div></div>
<script>
'use strict';
const API='https://orpeybiqikrdydkhsjjs.supabase.co',KEY='sb_publishable_TerLvPZo7e5_X91A-P4qlQ_DaqBly0Q';
const HEAD={apikey:KEY,'Content-Type':'application/json'},TABLE='scrap_app_state',BUCKET='scrap-photos';
let state={pos:[],splits:[],inputs:[],bags:[]},revision=0,selected=new Set(),completedSelected=new Set(),currentPackage='',stream=null,scanTimer=null,saving=false,scanPurpose='inspect',cloudMode=false;
const E=id=>document.getElementById(id),num=v=>Number(v)||0,kg=v=>num(v).toLocaleString('ko-KR',{maximumFractionDigits:2})+' kg';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(id,text,error=false){const x=E(id);x.textContent=text;x.className='msg on'+(error?' err':'')}
function defaults(x){return{pos:[],splits:[],inputs:[],bags:[],gradeMasters:[],mainGrades:[],subGrades:[],locations:[],movements:[],...(x||{}),pos:Array.isArray(x?.pos)?x.pos:[],splits:Array.isArray(x?.splits)?x.splits:[],inputs:Array.isArray(x?.inputs)?x.inputs:[],bags:Array.isArray(x?.bags)?x.bags:[],gradeMasters:Array.isArray(x?.gradeMasters)?x.gradeMasters:[],mainGrades:Array.isArray(x?.mainGrades)?x.mainGrades:[],subGrades:Array.isArray(x?.subGrades)?x.subGrades:[],locations:Array.isArray(x?.locations)?x.locations:[],movements:Array.isArray(x?.movements)?x.movements:[]}}
function gradeLabel(main,sub,detail){return[main,sub,detail].map(x=>String(x||'').trim()).filter(Boolean).join(' · ')}
async function saveMainGrade(){const name=E('masterMain').value.trim();if(!name)return msg('masterInfo','저장할 강종을 입력하세요.',true);if(!state.mainGrades.includes(name))state.mainGrades.push(name);await saveState();E('masterMain').value='';msg('masterInfo',name+' 강종 저장 완료')}
async function saveSubGrade(){const name=E('masterSub').value.trim();if(!name)return msg('masterInfo','저장할 소강종을 입력하세요.',true);if(!state.subGrades.includes(name))state.subGrades.push(name);await saveState();E('masterSub').value='';msg('masterInfo',name+' 소강종 저장 완료')}
async function saveLocationMaster(){const name=E('masterLocation').value.trim();if(!name)return msg('masterInfo','이동장소를 입력하세요.',true);if(!state.locations.includes(name))state.locations.push(name);await saveState();E('masterLocation').value='';msg('masterInfo',name+' 장소 저장 완료')}
function allMainGrades(){return[...new Set([...state.mainGrades,...state.gradeMasters.map(x=>x.main)].filter(Boolean))]}
function allSubGrades(){return[...new Set([...state.subGrades,...state.gradeMasters.map(x=>x.sub)].filter(Boolean))]}
function renderMasters(){E('mainGradeList').innerHTML=allMainGrades().map(x=>`<option value="${esc(x)}"></option>`).join('');E('locationList').innerHTML=state.locations.map(x=>`<option value="${esc(x)}"></option>`).join('');E('masterList').innerHTML=`저장 강종: ${allMainGrades().map(esc).join(', ')||'없음'}<br>저장 소강종: ${allSubGrades().map(esc).join(', ')||'없음'}<br>저장 장소: ${state.locations.map(esc).join(', ')||'없음'}`}
function renderSubGrades(selected=''){E('finalSub').innerHTML='<option value="">소강종 선택</option>'+allSubGrades().map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
async function loadState(){E('server').textContent='● Vercel 공용 서버 연결 중';try{const r=await fetch('/api/scrap-state',{cache:'no-store'}),out=await r.json();if(!r.ok)throw Error(out.error||`HTTP ${r.status}`);state=defaults(out.payload);revision=num(out.revision);cloudMode=true;E('server').textContent='● Vercel 공용 서버 연결됨';E('server').style.color='#8ff0b5';renderAll()}catch(e){cloudMode=false;state=defaults({});revision=0;E('server').textContent='● Vercel 공용 서버 연결 실패 · 저장 불가';E('server').style.color='#ff8e8e';renderAll();console.warn('Vercel 공용 서버 연결 실패',e)}}

function startRepackQr(){if(!E('bagSelect').value)return msg('sourceInfo','먼저 작업할 출하 마대를 선택하세요.',true);scanPurpose='repack';show('scan');setTimeout(startScan,80)}
function handleManualScan(){const no=E('manualPackage').value;if(!no)return msg('scanMsg','패키지를 선택하세요.',true);if(scanPurpose==='repack'){stopScan();show('repack');setTimeout(()=>prepareRepackPackage(no),0)}else openInspection(no)}
async function addInput(){const bag=state.bags.find(x=>x.id===E('bagSelect').value),p=state.pos.find(x=>x.packageNo===E('sourcePackage').value),weight=num(E('inputWeight').value);if(!bag||!p)return msg('sourceInfo','패키지번호를 입력하거나 QR을 촬영해 원 패키지를 불러오세요.',true);const available=confirmedByPackage(p.packageNo,bag.grade)-usedByPackage(p.packageNo,bag.grade),capacity=bag.target-bagWeight(bag.id);if(weight<=0||weight>available)return msg('sourceInfo','원 패키지 사용 가능 잔량은 '+kg(available)+'입니다.',true);if(weight>capacity)return msg('sourceInfo','출하 마대 남은 용량은 '+kg(capacity)+'입니다.',true);const input={id:crypto.randomUUID(),bagId:bag.id,bagNo:bag.bagNo,packageNo:p.packageNo,grade:bag.grade,weight,status:'CONFIRMED',createdAt:new Date().toISOString()};state.inputs.push(input);if(weight===capacity)bag.status='COMPLETE';try{await saveState();E('inputWeight').value='';E('repackPackageNo').value='';msg('sourceInfo',`${p.packageNo}에서 ${kg(weight)}를 ${bag.bagNo}로 이동했습니다.`);renderRepack()}catch(e){state.inputs=state.inputs.filter(x=>x.id!==input.id);msg('sourceInfo',e.message,true)}}
async function moveBagStock(){const bag=state.bags.find(x=>x.id===E('bagSelect').value),to=E('moveLocation').value.trim();if(!bag)return msg('moveInfo','이동할 출하 마대를 먼저 선택하세요.',true);if(!state.locations.includes(to))return msg('moveInfo','기준정보에 저장된 이동장소를 검색해 선택하세요.',true);const movement={id:crypto.randomUUID(),bagId:bag.id,bagNo:bag.bagNo,from:bag.location||'미지정',to,weight:bagWeight(bag.id),createdAt:new Date().toISOString()};state.movements.push(movement);bag.location=to;try{await saveState();E('moveLocation').value='';msg('moveInfo',`${bag.bagNo} 재고를 ${to}(으)로 이동했습니다.`);renderRepack()}catch(e){state.movements=state.movements.filter(x=>x.id!==movement.id);bag.location=movement.from==='미지정'?'':movement.from;msg('moveInfo',e.message,true)}}
function renderRepack(){E('bagNo').value=nextBag();const old=E('bagSelect').value;E('bagSelect').innerHTML='<option value="">작업 마대 선택</option>'+state.bags.map(b=>`<option value="${b.id}">${esc(b.bagNo)} · ${esc(b.grade)} · ${kg(bagWeight(b.id))}/${kg(b.target)}</option>`).join('');if(state.bags.some(x=>x.id===old))E('bagSelect').value=old;renderBag()}
function renderBag(){const bag=state.bags.find(x=>x.id===E('bagSelect').value);if(!bag){E('bagSummary').innerHTML='';E('bagInputs').innerHTML='';E('movementList').innerHTML='';return}const sources=state.pos.filter(p=>confirmedByPackage(p.packageNo,bag.grade)-usedByPackage(p.packageNo,bag.grade)>0);E('sourcePackage').innerHTML='<option value="">사내입고번호 선택</option>'+sources.map(p=>`<option value="${p.packageNo}">${esc(p.packageNo)} · 가용 ${kg(confirmedByPackage(p.packageNo,bag.grade)-usedByPackage(p.packageNo,bag.grade))}</option>`).join('');const w=bagWeight(bag.id);E('bagSummary').innerHTML=`<div><small>마대</small><b>${esc(bag.bagNo)}</b></div><div><small>강종</small><b>${esc(bag.grade)}</b></div><div><small>현재</small><b>${kg(w)}</b></div><div><small>현재 위치</small><b>${esc(bag.location||'미지정')}</b></div>`;const inputs=state.inputs.filter(i=>i.bagId===bag.id&&i.status!=='CANCELLED');E('bagInputs').innerHTML=inputs.length?'<div class="card">'+inputs.map(i=>`<p>사내입고 ${esc(i.packageNo)} → ${kg(i.weight)}</p>`).join('')+'</div>':'';const moves=state.movements.filter(x=>x.bagId===bag.id);E('movementList').innerHTML=moves.length?moves.slice().reverse().map(x=>`<p>${esc(String(x.createdAt).replace('T',' ').slice(0,16))} · ${esc(x.from)} → ${esc(x.to)} · ${kg(x.weight)}</p>`).join(''):'<p style="color:var(--muted)">재고 이동 이력이 없습니다.</p>'}
function filterManualPackages(){const q=String(E('manualSearch')?.value||'').trim().toLowerCase(),list=state.pos.filter(p=>!q||[p.packageNo,p.company,p.grade,p.poNo].some(v=>String(v||'').toLowerCase().includes(q)));E('manualPackage').innerHTML='<option value="">사내입고번호 선택</option>'+list.map(p=>`<option value="${p.packageNo}">${esc(p.packageNo)} · ${esc(p.company)} · ${esc(p.grade)}</option>`).join('')}
function renderAll(){state=defaults(state);E('stPos').textContent=state.pos.length;E('stSplits').textContent=state.splits.filter(s=>s.status!=='CANCELLED').length;E('stDone').textContent=state.pos.filter(p=>packageRemain(p)===0&&state.splits.some(s=>s.packageNo===p.packageNo)).length;E('stBags').textContent=state.bags.length;E('poRows').innerHTML=state.pos.length?state.pos.map(p=>`<tr><td><input type="checkbox" ${selected.has(p.id)?'checked':''} onchange="selectOne('${p.id}',this.checked)" style="width:23px;height:23px"></td><td>${esc(p.poNo)}</td><td>${esc(p.company)}</td><td>${esc(p.grade)}</td><td><b>${esc(p.packageNo)}</b></td><td>${kg(p.weight)}</td></tr>`).join(''):'<tr><td colspan="6">등록 자료가 없습니다.</td></tr>';filterManualPackages();renderMasters();renderQr();renderCompleted();renderRepack();if(currentPackage&&state.pos.some(p=>p.packageNo===currentPackage)){const p=state.pos.find(x=>x.packageNo===currentPackage);E('iRemain').textContent=kg(packageRemain(p));renderSplitHistory()}}
async function startScan(){stopScan();if(!('BarcodeDetector'in window))return msg('scanMsg','이 기기는 자동 QR 인식을 지원하지 않습니다. 아래 패키지 선택을 이용하세요.',true);try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});E('video').srcObject=stream;await E('video').play();const detector=new BarcodeDetector({formats:['qr_code']});scanTimer=setInterval(async()=>{try{const codes=await detector.detect(E('video'));if(!codes.length)return;const raw=codes[0].rawValue||'',u=new URL(raw,location.href),no=u.searchParams.get('package')||raw.trim();if(state.pos.some(p=>p.packageNo===no)){stopScan();if(scanPurpose==='repack'){show('repack');setTimeout(()=>prepareRepackPackage(no),50)}else openInspection(no)}}catch(_){}},450);msg('scanMsg',scanPurpose==='repack'?'재포장할 원 패키지 QR을 화면 중앙에 맞추세요.':'검수할 패키지 QR을 화면 중앙에 맞추세요.')}catch(e){msg('scanMsg','카메라를 열 수 없습니다: '+e.message,true)}}
function stopScan(){if(scanTimer)clearInterval(scanTimer);scanTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(E('video'))E('video').srcObject=null}
function downloadTemplate(){if(!window.XLSX)return alert('엑셀 모듈을 불러오지 못했습니다.');const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet([{'P.O 넘버':'PO-2026-001','거래처명':'예시메탈','강종명':'INCONEL 718','중량(kg)':500}]);XLSX.utils.book_append_sheet(wb,ws,'P.O입력');XLSX.writeFile(wb,'신성스크랩_PO_업로드양식.xlsx')}
async function importExcel(file){if(!file)return;try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let count=0;for(const r of rows){const poNo=String(r['P.O 넘버']||r['PO 넘버']||'').trim(),company=String(r['거래처명']||'').trim(),grade=String(r['강종명']||'').trim(),weight=num(r['중량(kg)']||r['중량']);if(!poNo||!company||!grade||weight<=0)continue;const packageNo=nextPackage();state.pos.push({id:crypto.randomUUID(),poNo,company,grade,packageNo,weight,status:'CONFIRMED',createdAt:new Date().toISOString()});count++}if(!count)throw Error('올바른 행이 없습니다.');await saveState();msg('poMsg',count+'개 패키지 업로드 완료')}catch(e){msg('poMsg','엑셀 업로드 실패: '+e.message,true)}}
function showFatal(title,error){const text=`${title}: ${error?.message||error}`;console.error(text);const target=E('inspectMsg')&&E('inspection').classList.contains('on')?'inspectMsg':E('poMsg')&&E('po').classList.contains('on')?'poMsg':'scanMsg';if(E(target))msg(target,text,true)}
window.addEventListener('error',e=>showFatal('화면 오류',e.error||e.message));window.addEventListener('unhandledrejection',e=>showFatal('처리 오류',e.reason));window.addEventListener('beforeunload',stopScan);
const params=new URLSearchParams(location.search),requested=params.get('package');loadState().then(()=>{if(requested)openInspection(requested);else show(location.hash.slice(1)&&E(location.hash.slice(1))?location.hash.slice(1):'home')});
</script>

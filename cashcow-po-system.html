function prepareDownload(bytes,fileName){if(pdfDownloadUrl)URL.revokeObjectURL(pdfDownloadUrl);pdfDownloadUrl=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const anchor=E('poPdfReady');anchor.href=pdfDownloadUrl;anchor.download=fileName;anchor.style.display='inline-flex';return anchor}
async function downloadPoPdf(){if(!state.po.poNo)return notice('poMsg','P.O NO를 입력하세요.',true);busy('P.O PDF 생성 중');try{if(typeof globalThis.html2canvas!=='function')throw Error('PDF 화면 변환 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도하세요.');E('pdfSheet').innerHTML=pdfHtml();const canvas=await html2canvas(E('pdfSheet'),{scale:2,backgroundColor:'#fff'}),bytes=imagePdfBytes(canvas.toDataURL('image/jpeg',.94),canvas.width,canvas.height);prepareDownload(bytes,`${state.po.poNo}_PURCHASE_CONTRACT.pdf`);notice('poMsg','P.O 준비가 완료되었습니다. 위의 “준비된 P.O 저장하기” 버튼을 눌러 저장하세요.')}catch(e){notice('poMsg','PDF 생성 실패: '+e.message,true)}finally{busy('',false)}}
function renderAll(){renderPo();renderSavedPos();renderVerify();renderMappings();convertWeight()}
window.addEventListener('beforeunload',()=>{clearTimeout(saveTimer);if(pdfDownloadUrl)URL.revokeObjectURL(pdfDownloadUrl)});
renderAll();reconnect();
</script>

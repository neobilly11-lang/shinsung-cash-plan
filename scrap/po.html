<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10231f"><title>신성 스크랩 P.O 등록·QR 출력</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>:root{--ink:#10231f;--green:#0d725d;--lime:#d9f566;--amber:#f5b942;--bg:#f4f7f5;--line:#d8e2de;--muted:#687670;--red:#b42d2d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;font-size:17px}button,input,select{font:inherit}.top{background:var(--ink);color:#fff;min-height:76px;display:flex;align-items:center;justify-content:space-between;padding:10px max(15px,calc((100% - 1180px)/2))}.brand{display:flex;gap:11px;align-items:center}.logo{display:grid;place-items:center;width:46px;height:46px;background:var(--lime);color:var(--ink);border-radius:13px;font-weight:900}.brand b,.brand small{display:block}.brand small{font-size:12px;opacity:.7}.server{font-size:13px}.wrap{max-width:1180px;margin:auto;padding:28px 15px 80px}.eyebrow{font-size:13px;color:var(--green);font-weight:900;margin:0}h1{font-size:clamp(30px,5vw,44px);margin:5px 0 24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.btn,.file{border:0;border-radius:13px;min-height:55px;padding:14px 18px;font-weight:900;background:#fff;border:1px solid var(--line);cursor:pointer}.primary{background:var(--green);color:#fff;border-color:var(--green)}.accent{background:var(--lime);border-color:var(--lime)}.amber{background:var(--amber);border-color:var(--amber)}.file input{display:none}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:21px;margin-top:15px}.card h2{font-size:21px;margin:0 0 17px}.form{display:grid;grid-template-columns:1fr 1.2fr 1fr .8fr auto;gap:10px;align-items:end}label{display:block;font-size:13px;font-weight:900}input,select{display:block;width:100%;height:57px;margin-top:7px;border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-size:18px}.save{height:57px;border:0;border-radius:12px;padding:0 20px;background:var(--lime);font-weight:900}.hint{font-size:13px;color:var(--muted);line-height:1.6}.msg{display:none;padding:13px;border-radius:11px;background:#fff1cc;color:#704b00;font-weight:900;margin-top:13px}.msg.on{display:block}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:900px}th{background:var(--ink);color:#fff;padding:13px 9px;font-size:13px}td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:center}td:nth-child(2),td:nth-child(3),td:nth-child(4){text-align:left}.pkg{font-weight:900;color:var(--green)}.empty{padding:34px;color:var(--muted)}.count{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.count b{font-size:22px}.labels{display:none}.label{border:1.5px solid #111;display:grid;grid-template-columns:35mm 1fr;align-items:center;padding:4mm;height:52mm;break-inside:avoid}.qr{width:31mm;height:31mm}.qr img,.qr canvas{width:31mm!important;height:31mm!important}.labelInfo{min-width:0;padding-left:3mm}.labelInfo .company{font-size:15pt;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.labelInfo .grade{font-size:14pt;margin:3mm 0;font-weight:800}.labelInfo .package{font-size:18pt;font-weight:900;letter-spacing:.04em}.labelInfo .po{font-size:9pt;margin-top:2mm;color:#444}@media(max-width:800px){.form{grid-template-columns:1fr 1fr}.form button{grid-column:1/3}.server{font-size:0}.server:after{content:'●';font-size:16px}}@media(max-width:520px){.form{grid-template-columns:1fr}.form button{grid-column:auto}.toolbar>*{width:100%;text-align:center}}@page{size:A4 portrait;margin:9mm}@media print{body{background:#fff}.top,.wrap{display:none!important}.labels{display:grid!important;grid-template-columns:1fr 1fr;grid-auto-rows:52mm;width:192mm;margin:0 auto;gap:0}.label{height:52mm}}
</style></head><body><header class="top"><div class="brand"><span class="logo">PO</span><span><b>신성 스크랩 P.O 관리</b><small>엑셀 등록 · 패키지 자동번호 · QR 라벨</small></span></div><span id="server" class="server">● 서버 연결 중</span></header><main class="wrap"><p class="eyebrow">공용 서버 P.O 등록</p><h1>입고 패키지 등록</h1><div class="toolbar"><button class="btn" onclick="location.href='shared.html'">← 검수·재포장</button><button class="btn accent" onclick="template()">엑셀 입력양식 다운로드</button><label class="file amber">엑셀 업로드<input type="file" accept=".xlsx,.xls" onchange="uploadExcel(this.files[0])"></label><button class="btn primary" onclick="printSelected()">선택 QR 라벨 인쇄</button></div><div class="card"><h2>P.O 직접 입력</h2><div class="form"><label>P.O 넘버<input id="po" placeholder="예: PO-2026-001"></label><label>거래처명<input id="company" placeholder="거래처명"></label><label>강종명<input id="grade" placeholder="예: SUS 304"></label><label>중량(kg)<input id="weight" type="number" inputmode="decimal" placeholder="kg"></label><button id="saveBtn" class="save" onclick="addManual()">확정 등록</button></div><p class="hint">패키지번호는 확정 시 P000001 형식으로 자동 생성됩니다. 같은 P.O에 여러 패키지가 있으면 한 줄씩 추가하거나 엑셀로 한꺼번에 등록하세요.</p><div id="msg" class="msg"></div></div><div class="card"><div class="count"><h2 style="margin:0">등록된 패키지</h2><b><span id="selected">0</span> / <span id="total">0</span>개 선택</b></div><div class="tableWrap"><table><thead><tr><th><input id="all" type="checkbox" onchange="toggleAll(this.checked)" style="width:22px;height:22px;margin:auto"></th><th>P.O 넘버</th><th>거래처명</th><th>강종명</th><th>패키지번호</th><th>중량</th><th>상태</th></tr></thead><tbody id="rows"></tbody></table></div><p class="hint">A4 한 장에 QR 라벨 10개(2열 × 5행)가 출력됩니다. 10개를 초과하면 다음 장에 이어서 인쇄됩니다.</p></div></main><section id="labels" class="labels"></section><script>
const URL='https://orpeybiqikrdydkhsjjs.supabase.co',KEY='sb_publishable_TerLvPZo7e5_X91A-P4qlQ_DaqBly0Q',H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},state={splits:[],inputs:[],pos:[]};let rev=0,checked=new Set();const val=id=>document.getElementById(id).value.trim(),fmt=n=>Number(n).toLocaleString('ko-KR')+' kg';function say(t){msg.textContent=t;msg.classList.add('on')}function nextPackage(){let max=state.pos.reduce((m,x)=>Math.max(m,Number(String(x.packageNo||'').replace(/\D/g,''))||0),0);return 'P'+String(max+1).padStart(6,'0')}async function load(){try{let r=await fetch(URL+'/rest/v1/scrap_app_state?id=eq.main&select=payload,revision',{headers:H});if(!r.ok)throw Error('서버 자료를 불러올 수 없습니다');let a=await r.json();if(!a.length)throw Error('서버 초기자료가 없습니다');Object.assign(state,a[0].payload);state.pos=state.pos||[];rev=a[0].revision;server.textContent='● 공용 서버 연결됨';server.style.color='#8ff0b5';render()}catch(e){server.textContent='● 서버 연결 오류';server.style.color='#ffd27a';say(e.message)}}async function save(){let r=await fetch(URL+'/rest/v1/scrap_app_state?id=eq.main&revision=eq.'+rev,{method:'PATCH',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({payload:state,revision:rev+1,updated_at:new Date().toISOString()})}),a=await r.json();if(!r.ok||!a.length){await load();throw Error('다른 사용자가 먼저 저장했습니다. 최신 자료에서 다시 시도하세요.')}rev=a[0].revision}async function addManual(){let p=val('po'),c=val('company'),g=val('grade'),w=Number(val('weight'));if(!p||!c||!g||!w||w<=0)return say('P.O 넘버, 거래처명, 강종명, 중량을 모두 입력하세요.');let row={id:crypto.randomUUID(),poNo:p,company:c,grade:g,packageNo:nextPackage(),weight:w,status:'CONFIRMED',createdAt:new Date().toLocaleString('ko-KR')};state.pos.push(row);saveBtn.disabled=true;try{await save();checked.add(row.id);['po','company','grade','weight'].forEach(x=>document.getElementById(x).value='');say(row.packageNo+' 패키지가 확정 등록되었습니다.');render()}catch(e){state.pos=state.pos.filter(x=>x.id!==row.id);say(e.message)}finally{saveBtn.disabled=false}}function template(){let data=[{'P.O 넘버':'PO-2026-001','거래처명':'예시메탈','강종명':'SUS 304','중량(kg)':500},{'P.O 넘버':'PO-2026-001','거래처명':'예시메탈','강종명':'SUS 304','중량(kg)':480}],ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[{wch:18},{wch:24},{wch:18},{wch:14}];let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'P.O입력');XLSX.writeFile(wb,'신성스크랩_PO_업로드양식.xlsx')}async function uploadExcel(file){if(!file)return;try{let data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array'}),list=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!list.length)throw Error('엑셀에 등록할 자료가 없습니다.');let added=[];for(let x of list){let p=String(x['P.O 넘버']||x['PO 넘버']||x['P.O번호']||'').trim(),c=String(x['거래처명']||'').trim(),g=String(x['강종명']||'').trim(),w=Number(x['중량(kg)']||x['중량']||0);if(!p||!c||!g||!w)continue;let row={id:crypto.randomUUID(),poNo:p,company:c,grade:g,packageNo:nextPackage(),weight:w,status:'CONFIRMED',createdAt:new Date().toLocaleString('ko-KR')};state.pos.push(row);added.push(row);checked.add(row.id)}if(!added.length)throw Error('필수 열을 확인하세요: P.O 넘버, 거래처명, 강종명, 중량(kg)');try{await save()}catch(e){let ids=new Set(added.map(x=>x.id));state.pos=state.pos.filter(x=>!ids.has(x.id));throw e}say('엑셀에서 '+added.length+'개 패키지를 등록하고 번호를 자동 생성했습니다.');render()}catch(e){say('엑셀 업로드 실패: '+e.message)}}function toggle(id,on){on?checked.add(id):checked.delete(id);renderCount()}function toggleAll(on){checked.clear();if(on)state.pos.forEach(x=>checked.add(x.id));render()}function renderCount(){selected.textContent=checked.size;total.textContent=state.pos.length;all.checked=state.pos.length>0&&checked.size===state.pos.length}function render(){rows.innerHTML=state.pos.length?state.pos.map(x=>`<tr><td><input type="checkbox" ${checked.has(x.id)?'checked':''} onchange="toggle('${x.id}',this.checked)" style="width:22px;height:22px;margin:auto"></td><td>${esc(x.poNo)}</td><td>${esc(x.company)}</td><td>${esc(x.grade)}</td><td class="pkg">${esc(x.packageNo)}</td><td>${fmt(x.weight)}</td><td>확정</td></tr>`).join(''):`<tr><td colspan="7" class="empty">등록된 P.O 패키지가 없습니다.</td></tr>`;renderCount()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function printSelected(){let list=state.pos.filter(x=>checked.has(x.id));if(!list.length)return say('인쇄할 패키지를 먼저 선택하세요.');labels.innerHTML=list.map(x=>`<article class="label"><div class="qr" id="qr-${x.id}"></div><div class="labelInfo"><div class="company">${esc(x.company)}</div><div class="grade">${esc(x.grade)}</div><div class="package">${esc(x.packageNo)}</div><div class="po">P.O ${esc(x.poNo)} · ${fmt(x.weight)}</div></div></article>`).join('');list.forEach(x=>new QRCode(document.getElementById('qr-'+x.id),{text:location.origin+'/scrap/shared.html?package='+encodeURIComponent(x.packageNo),width:160,height:160,correctLevel:QRCode.CorrectLevel.M}));setTimeout(()=>window.print(),350)}load();setInterval(load,30000);
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10231f"><title>신성 스크랩 P.O·QR 관리</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>:root{--ink:#10231f;--green:#0d725d;--lime:#d9f566;--amber:#f5b942;--bg:#f4f7f5;--line:#d8e2de;--muted:#687670;--red:#a92828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;font-size:17px}button,input{font:inherit}.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;min-height:76px;display:flex;align-items:center;justify-content:space-between;padding:10px max(14px,calc((100% - 1180px)/2))}.brand{display:flex;gap:11px;align-items:center}.logo{display:grid;place-items:center;width:46px;height:46px;background:var(--lime);color:var(--ink);border-radius:13px;font-weight:900}.brand b,.brand small{display:block}.brand small{font-size:12px;opacity:.7}.server{font-size:13px}.wrap{max-width:1180px;margin:auto;padding:22px 14px 90px}.nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}.btn,.file{border:1px solid var(--line);border-radius:13px;min-height:54px;padding:13px 17px;font-weight:900;background:#fff;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--green);color:#fff;border-color:var(--green)}.lime{background:var(--lime);border-color:var(--lime)}.amber{background:var(--amber);border-color:var(--amber)}.file input{display:none}.eyebrow{font-size:13px;color:var(--green);font-weight:900;margin:0}h1{font-size:clamp(30px,5vw,44px);margin:5px 0 22px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:15px}.card h2{font-size:21px;margin:0 0 16px}.form{display:grid;grid-template-columns:1fr 1.2fr 1fr .8fr auto;gap:10px;align-items:end}label{display:block;font-size:13px;font-weight:900}input{display:block;width:100%;height:57px;margin-top:7px;border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;font-size:18px}.save{height:57px;border:0;border-radius:12px;padding:0 19px;background:var(--lime);font-weight:900}.hint{font-size:13px;color:var(--muted);line-height:1.6}.msg{display:none;padding:13px;border-radius:11px;background:#fff1cc;color:#704b00;font-weight:900;margin-top:13px}.msg.on{display:block}.error{background:#ffe4e4;color:#7e1616}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:970px}th{background:var(--ink);color:#fff;padding:12px 8px;font-size:13px}td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:center}td.left{text-align:left}.pkg{font-weight:900;color:var(--green)}.mini{border:0;border-radius:9px;padding:8px 10px;font-weight:900;background:#e8f5ef;color:var(--green)}.count{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.count b{font-size:21px}.labels{display:none}.label{border:1.5px solid #111;display:grid;grid-template-columns:35mm 1fr;align-items:center;padding:4mm;height:52mm;break-inside:avoid}.qrimg{width:31mm;height:31mm;object-fit:contain}.labelInfo{min-width:0;padding-left:3mm}.company{font-size:15pt;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grade{font-size:14pt;margin:3mm 0;font-weight:800}.package{font-size:18pt;font-weight:900}.poText{font-size:9pt;margin-top:2mm;color:#444}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.modalCard{background:#fff;border-radius:22px;padding:24px;width:min(420px,100%);text-align:center}.modalCard img{width:240px;height:240px}.modalCard strong,.modalCard span{display:block}.modalCard strong{font-size:26px;margin-top:12px}.close{width:100%;height:56px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:900;margin-top:18px}@media(max-width:850px){.form{grid-template-columns:1fr 1fr}.form button{grid-column:1/3}}@media(max-width:550px){.form{grid-template-columns:1fr}.form button{grid-column:auto}.nav>*{width:100%}.server{font-size:0}.server:after{content:'●';font-size:16px}.count{align-items:flex-start;gap:8px;flex-direction:column}}@page{size:A4 portrait;margin:9mm}@media print{body{background:#fff}.top,.wrap,.modal{display:none!important}.labels{display:grid!important;grid-template-columns:1fr 1fr;grid-auto-rows:52mm;width:192mm;margin:0 auto}.label{height:52mm}}
</style></head><body><header class="top"><div class="brand"><span class="logo">PO</span><span><b>신성 스크랩 P.O 관리</b><small>공용서버 · QR 라벨</small></span></div><span id="server" class="server">● 연결 중</span></header><main class="wrap"><nav class="nav"><button class="btn" onclick="goBack()">← 이전 화면</button><a class="btn" href="index.html">⌂ 현장 홈</a><a class="btn" href="shared.html">⌗ 검수·재포장</a><button class="btn lime" onclick="downloadTemplate()">엑셀 양식 다운로드</button><label class="file amber">엑셀 업로드<input type="file" accept=".xlsx,.xls" onchange="uploadExcel(this.files[0]);this.value=''" /></label><button class="btn primary" onclick="printSelected()">선택 QR 인쇄</button></nav><p class="eyebrow">P.O 입력·패키지 자동생성</p><h1>입고 패키지 등록</h1><section class="card"><h2>직접 입력</h2><div class="form"><label>P.O 넘버<input id="poNo" placeholder="PO-2026-001"></label><label>거래처명<input id="company" placeholder="거래처명"></label><label>강종명<input id="gradeName" placeholder="SUS 304"></label><label>중량(kg)<input id="weightKg" type="number" inputmode="decimal"></label><button id="saveButton" class="save" onclick="addManual()">확정 등록</button></div><p class="hint">패키지번호는 P000001 형식으로 자동 생성됩니다. 확정 후 QR 보기 또는 선택 QR 인쇄를 누르세요.</p><div id="message" class="msg"></div></section><section class="card"><div class="count"><h2 style="margin:0">등록된 패키지</h2><b><span id="selectedCount">0</span> / <span id="totalCount">0</span>개 선택</b></div><div class="tableWrap"><table><thead><tr><th><input id="selectAll" type="checkbox" onchange="toggleAll(this.checked)" style="width:22px;height:22px;margin:auto"></th><th>P.O</th><th>거래처명</th><th>강종명</th><th>패키지번호</th><th>중량</th><th>QR</th></tr></thead><tbody id="tableRows"></tbody></table></div><p class="hint">A4 한 장에 10개(2열 × 5행)로 출력됩니다. 브라우저 인쇄 설정에서 용지 A4, 배율 100%, 머리글/바닥글 끄기를 선택하세요.</p></section></main><section id="printLabels" class="labels"></section><div id="qrModal" class="modal" onclick="if(event.target===this)closeQr()"><div class="modalCard"><img id="previewQr" alt="패키지 QR"><strong id="previewPackage"></strong><span id="previewInfo"></span><button class="close" onclick="closeQr()">닫기</button></div></div><script>
'use strict';const API='https://orpeybiqikrdydkhsjjs.supabase.co',KEY='sb_publishable_TerLvPZo7e5_X91A-P4qlQ_DaqBly0Q',HEAD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};let data={splits:[],inputs:[],pos:[]},revision=0,selected=new Set();const el=id=>document.getElementById(id),text=id=>el(id).value.trim(),fmt=n=>Number(n).toLocaleString('ko-KR')+' kg';function goBack(){if(history.length>1)history.back();else location.href='index.html'}function showMessage(t,isError=false){el('message').textContent=t;el('message').className='msg on'+(isError?' error':'')}function qrData(row){return new URL('inspection.html?package='+encodeURIComponent(row.packageNo),location.href).href}function qrUrl(row,size=240){return 'https://api.qrserver.com/v1/create-qr-code/?format=png&margin=8&size='+size+'x'+size+'&data='+encodeURIComponent(qrData(row))}function nextNo(){let m=(data.pos||[]).reduce((a,x)=>Math.max(a,Number(String(x.packageNo||'').replace(/\D/g,''))||0),0);return 'P'+String(m+1).padStart(6,'0')}async function load(){try{let r=await fetch(API+'/rest/v1/scrap_app_state?id=eq.main&select=payload,revision',{headers:HEAD});if(!r.ok)throw Error('서버 응답 '+r.status);let rows=await r.json();if(!rows.length)throw Error('서버 초기자료 없음');data={splits:[],inputs:[],pos:[],...rows[0].payload};data.pos=Array.isArray(data.pos)?data.pos:[];revision=rows[0].revision;el('server').textContent='● 공용 서버 연결됨';el('server').style.color='#8ff0b5';render()}catch(e){el('server').textContent='● 서버 연결 오류';el('server').style.color='#ffd27a';showMessage('서버 연결 실패: '+e.message,true)}}async function save(){let r=await fetch(API+'/rest/v1/scrap_app_state?id=eq.main&revision=eq.'+revision,{method:'PATCH',headers:{...HEAD,Prefer:'return=representation'},body:JSON.stringify({payload:data,revision:revision+1,updated_at:new Date().toISOString()})});if(!r.ok)throw Error('저장 응답 '+r.status);let rows=await r.json();if(!rows.length){await load();throw Error('다른 사용자가 먼저 저장했습니다. 다시 등록하세요.')}revision=rows[0].revision}async function addManual(){let p=text('poNo'),c=text('company'),g=text('gradeName'),w=Number(text('weightKg'));if(!p||!c||!g||!Number.isFinite(w)||w<=0)return showMessage('모든 입력칸을 정확히 입력하세요.',true);let row={id:crypto.randomUUID(),poNo:p,company:c,grade:g,packageNo:nextNo(),weight:w,status:'CONFIRMED',createdAt:new Date().toISOString()};data.pos.push(row);el('saveButton').disabled=true;try{await save();selected.add(row.id);['poNo','company','gradeName','weightKg'].forEach(x=>el(x).value='');showMessage(row.packageNo+' 등록 완료');render()}catch(e){data.pos=data.pos.filter(x=>x.id!==row.id);showMessage(e.message,true)}finally{el('saveButton').disabled=false}}function downloadTemplate(){if(!window.XLSX)return showMessage('엑셀 모듈을 불러오지 못했습니다. 인터넷 연결 후 다시 시도하세요.',true);let ws=XLSX.utils.json_to_sheet([{'P.O 넘버':'PO-2026-001','거래처명':'예시메탈','강종명':'SUS 304','중량(kg)':500},{'P.O 넘버':'PO-2026-001','거래처명':'예시메탈','강종명':'SUS 304','중량(kg)':480}]);ws['!cols']=[{wch:18},{wch:24},{wch:18},{wch:14}];let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'P.O입력');XLSX.writeFile(wb,'신성스크랩_PO_업로드양식.xlsx')}async function uploadExcel(file){if(!file)return;if(!window.XLSX)return showMessage('엑셀 모듈 로딩 실패. 인터넷 연결을 확인하세요.',true);try{let wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),added=[];for(let x of rows){let p=String(x['P.O 넘버']||x['PO 넘버']||x['P.O번호']||'').trim(),c=String(x['거래처명']||'').trim(),g=String(x['강종명']||'').trim(),w=Number(x['중량(kg)']||x['중량']||0);if(!p||!c||!g||!Number.isFinite(w)||w<=0)continue;let row={id:crypto.randomUUID(),poNo:p,company:c,grade:g,packageNo:nextNo(),weight:w,status:'CONFIRMED',createdAt:new Date().toISOString()};data.pos.push(row);added.push(row);selected.add(row.id)}if(!added.length)throw Error('필수 열: P.O 넘버, 거래처명, 강종명, 중량(kg)');try{await save()}catch(e){let ids=new Set(added.map(x=>x.id));data.pos=data.pos.filter(x=>!ids.has(x.id));throw e}showMessage(added.length+'개 패키지 업로드 완료');render()}catch(e){showMessage('엑셀 업로드 오류: '+e.message,true)}}function toggle(id,on){on?selected.add(id):selected.delete(id);counts()}function toggleAll(on){selected.clear();if(on)data.pos.forEach(x=>selected.add(x.id));render()}function counts(){el('selectedCount').textContent=selected.size;el('totalCount').textContent=data.pos.length;el('selectAll').checked=data.pos.length>0&&selected.size===data.pos.length}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){el('tableRows').innerHTML=data.pos.length?data.pos.map(x=>`<tr><td><input type="checkbox" ${selected.has(x.id)?'checked':''} onchange="toggle('${x.id}',this.checked)" style="width:22px;height:22px;margin:auto"></td><td class="left">${escapeHtml(x.poNo)}</td><td class="left">${escapeHtml(x.company)}</td><td class="left">${escapeHtml(x.grade)}</td><td class="pkg">${escapeHtml(x.packageNo)}</td><td>${fmt(x.weight)}</td><td><button class="mini" onclick="showQr('${x.id}')">QR 보기</button></td></tr>`).join(''):'<tr><td colspan="7" style="padding:34px;color:var(--muted)">등록된 패키지가 없습니다.</td></tr>';counts()}function showQr(id){let x=data.pos.find(r=>r.id===id);if(!x)return showMessage('패키지를 찾을 수 없습니다.',true);el('previewQr').src=qrUrl(x);el('previewQr').onerror=()=>showMessage('QR 이미지 생성 실패. 인터넷 연결 후 다시 시도하세요.',true);el('previewPackage').textContent=x.packageNo;el('previewInfo').textContent=x.company+' · '+x.grade+' · '+fmt(x.weight);el('qrModal').classList.add('on')}function closeQr(){el('qrModal').classList.remove('on')}async function printSelected(){let list=data.pos.filter(x=>selected.has(x.id));if(!list.length)return showMessage('인쇄할 패키지를 선택하세요.',true);el('printLabels').innerHTML=list.map(x=>`<article class="label"><img class="qrimg" src="${qrUrl(x,300)}" alt="${escapeHtml(x.packageNo)} QR"><div class="labelInfo"><div class="company">${escapeHtml(x.company)}</div><div class="grade">${escapeHtml(x.grade)}</div><div class="package">${escapeHtml(x.packageNo)}</div><div class="poText">P.O ${escapeHtml(x.poNo)} · ${fmt(x.weight)}</div></div></article>`).join('');let imgs=[...el('printLabels').querySelectorAll('img')];try{await Promise.race([Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise((ok,no)=>{img.onload=ok;img.onerror=no}))),new Promise((_,no)=>setTimeout(()=>no(Error('QR 생성 시간 초과')),12000))]);window.print()}catch(e){showMessage('QR 생성 실패: 인터넷 연결을 확인하고 다시 시도하세요.',true)}}window.addEventListener('error',e=>showMessage('화면 오류: '+e.message,true));load();setInterval(load,30000);
</script></body></html>

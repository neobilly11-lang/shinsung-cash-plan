<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10231f"><title>검수완료 패키지</title><style>:root{--ink:#10231f;--green:#0d725d;--lime:#d9f566;--bg:#f4f7f5;--line:#d8e2de;--muted:#687670}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;font-size:17px}button{font:inherit}.top{background:var(--ink);color:#fff;padding:18px}.top div{max-width:1000px;margin:auto}.wrap{max-width:1000px;margin:auto;padding:20px 14px 80px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.nav a,.nav button{min-height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:11px 15px;text-decoration:none;font-weight:900}.eyebrow{font-size:13px;color:var(--green);font-weight:900}h1{font-size:clamp(31px,6vw,45px);margin:5px 0 20px}.stats{background:var(--green);color:#fff;border-radius:18px;padding:19px;margin-bottom:15px}.stats b{font-size:34px}.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid var(--line);border-radius:18px;background:#fff;padding:18px;text-align:left;cursor:pointer}.item:hover{border-color:var(--green)}.item .head{display:flex;justify-content:space-between;gap:10px}.item strong{font-size:23px;color:var(--green)}.item span,.item small{display:block}.item span{font-weight:900;margin:10px 0}.item small{color:var(--muted)}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:40px;text-align:center;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:50;padding:15px;overflow:auto}.modal.on{display:block}.dialog{max-width:850px;margin:25px auto;background:#fff;border-radius:22px;padding:21px}.dialogTop{display:flex;justify-content:space-between;align-items:center}.close{width:50px;height:50px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:24px}.split{border-top:1px solid var(--line);padding:18px 0}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.photo{background:#eef2f0;border-radius:13px;min-height:160px;overflow:hidden}.photo img{width:100%;height:180px;object-fit:cover;display:block}.photo b{display:block;padding:9px}.missing{display:grid;place-items:center;height:180px;color:var(--muted);text-align:center;padding:10px}.msg{padding:13px;border-radius:11px;background:#fff1cc;color:#704b00;font-weight:900}@media(max-width:650px){.list{grid-template-columns:1fr}.photos{grid-template-columns:1fr}.nav>*{flex:1;text-align:center}}</style></head><body><header class="top"><div><b>✓ 검수완료 패키지</b><br><small>완료내역 · 검수사진 조회</small></div></header><main class="wrap"><nav class="nav"><button onclick="history.length>1?history.back():location.href='index.html'">← 이전</button><a href="index.html">⌂ 현장 홈</a><a href="scan-inspect.html">QR 검수</a><a href="app.html?view=po">P.O 관리</a></nav><div class="eyebrow">남은 중량 0kg만 표시</div><h1>검수완료 목록</h1><div class="stats">완료 패키지 <b id="count">0</b>개</div><div id="message"></div><section id="list" class="list"></section></main><div id="modal" class="modal" onclick="if(event.target===this)closeDetail()"><article class="dialog"><div class="dialogTop"><div><small>검수완료 상세</small><h2 id="detailTitle"></h2></div><button class="close" onclick="closeDetail()">×</button></div><div id="detailBody"></div></article></div><script>
'use strict';const API='https://orpeybiqikrdydkhsjjs.supabase.co',KEY='sb_publishable_TerLvPZo7e5_X91A-P4qlQ_DaqBly0Q',H={apikey:KEY,Authorization:'Bearer '+KEY},E=id=>document.getElementById(id),F=n=>Number(n).toLocaleString('ko-KR')+' kg';let state={pos:[],splits:[]},completed=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{let r=await fetch(API+'/rest/v1/scrap_app_state?id=eq.main&select=payload',{headers:H,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let a=await r.json();state={pos:[],splits:[],...a[0].payload};completed=state.pos.filter(p=>{let used=state.splits.filter(s=>s.packageNo===p.packageNo).reduce((x,y)=>x+Number(y.weight),0);return used===Number(p.weight)});render()}catch(e){E('message').innerHTML='<div class="msg">서버 연결 실패: '+esc(e.message)+'</div>'}}function render(){E('count').textContent=completed.length;E('list').innerHTML=completed.length?completed.map(p=>{let splits=state.splits.filter(s=>s.packageNo===p.packageNo),summary=splits.map(s=>s.grade+' '+F(s.weight)).join(' / ');return `<button class="item" onclick="detail('${p.packageNo}')"><div class="head"><strong>${esc(p.packageNo)}</strong><b>검수완료</b></div><span>${esc(p.company)} · ${esc(p.grade)}</span><small>${esc(summary)}</small></button>`}).join(''):'<div class="empty">아직 남은 중량이 0kg인 검수완료 패키지가 없습니다.</div>'}function photo(url,label){return `<div class="photo"><b>${label}</b>${url?`<img src="${esc(url)}" alt="${label}" loading="lazy" onclick="window.open(this.src,'_blank')">`:'<div class="missing">저장된 사진 없음<br>이전 버전 검수자료일 수 있습니다.</div>'}</div>`}function detail(no){let p=state.pos.find(x=>x.packageNo===no),splits=state.splits.filter(x=>x.packageNo===no);E('detailTitle').textContent=no+' · '+p.company;E('detailBody').innerHTML=`<p><b>계약 강종:</b> ${esc(p.grade)} · <b>최초 중량:</b> ${F(p.weight)}</p>`+splits.map((s,i)=>`<section class="split"><h3>${i+1}. ${esc(s.grade)} · ${F(s.weight)}</h3><p>${esc(s.memo||'메모 없음')} · ${s.createdAt?new Date(s.createdAt).toLocaleString('ko-KR'):''}</p><div class="photos">${photo(s.photos?.shape,'형상 사진')}${photo(s.photos?.analyzer,'분석기 결과')}${photo(s.photos?.anomaly,'기타 이상 사진')}</div></section>`).join('');E('modal').classList.add('on')}function closeDetail(){E('modal').classList.remove('on')}load();setInterval(load,30000);
</script></body></html>

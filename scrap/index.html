<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10231f"><title>신성 스크랩 현장 홈</title><style>:root{--ink:#10231f;--green:#0d725d;--lime:#d9f566;--amber:#f5b942;--bg:#f4f7f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif}.top{background:var(--ink);color:#fff;padding:20px}.top div{max-width:900px;margin:auto}.top h2,.top p{margin:0}.top p{opacity:.7;margin-top:5px}.wrap{max-width:900px;margin:auto;padding:35px 15px}.eyebrow{font-size:13px;color:var(--green);font-weight:900}h1{font-size:clamp(32px,7vw,48px);margin:6px 0 28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{min-height:170px;border:0;border-radius:24px;padding:24px;text-align:left;display:flex;flex-direction:column;color:var(--ink);font-weight:900;cursor:pointer}.card span{font-size:30px}.card strong{font-size:26px;margin-top:auto}.card small{font-size:14px;font-weight:500;margin-top:7px}.po{background:var(--lime)}.inspect{background:var(--green);color:#fff}.bag{background:var(--amber)}.white{background:#fff;border:2px solid #d8e2de}.done{background:#dceeff;border:2px solid #9bc8ed}.note{margin-top:20px;background:#fff;border-radius:16px;padding:17px;color:#56655f;font-size:14px}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{min-height:135px}}</style></head><body><header class="top"><div><h2>신성 스크랩 현장관리</h2><p>모든 사용자 공용 서버</p></div></header><main class="wrap"><div class="eyebrow">현장 홈 · 큰 버튼을 눌러 시작</div><h1>어떤 작업을 할까요?</h1><div class="grid"><button class="card po" onclick="location.href='app.html?view=po'"><span>P.O</span><strong>P.O·패키지 등록</strong><small>엑셀 업로드, 패키지번호 자동생성</small></button><button class="card white" onclick="location.href='app.html?view=qr'"><span>⌗</span><strong>QR 생성·A4 출력</strong><small>QR 확인, 선택, 10개 라벨 인쇄</small></button><button class="card inspect" onclick="location.href='scan.html?mode=inspect'"><span>▣</span><strong>패키지 검수 QR 촬영</strong><small>휴대폰 카메라로 패키지 QR 스캔</small></button><button class="card bag" onclick="location.href='scan.html?mode=bag'"><span>▣</span><strong>재포장 QR 촬영</strong><small>원 패키지 QR 촬영 후 투입중량 저장</small></button><button class="card done" onclick="location.href='completed.html'"><span>✓</span><strong>검수완료·사진 조회</strong><small>완료 패키지만 모아 사진과 확정내역 확인</small></button></div><div class="note">카메라 사용을 묻는 창이 나타나면 <b>허용</b>을 누르세요. 새 배포가 반영되지 않으면 2~3분 후 새로고침하세요.</div></main></body></html>

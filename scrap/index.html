<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10231f"><title>신성 스크랩 현장관리</title><style>
:root{--ink:#10231f;--green:#0d725d;--lime:#d9f566;--amber:#f5b942;--bg:#f4f7f5;--line:#d8e2de;--muted:#687670}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;font-size:18px}button,input,select,textarea{font:inherit}.top{height:78px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px max(16px,calc((100% - 900px)/2))}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:var(--lime);color:var(--ink);font-weight:900}.brand b,.brand small{display:block}.brand small{font-size:12px;opacity:.7}.sync{font-size:13px;background:#ffffff18;padding:10px 13px;border-radius:30px}.wrap{max-width:900px;margin:auto;padding:28px 16px 105px}.view{display:none}.view.on{display:block}h1{font-size:clamp(30px,7vw,46px);margin:5px 0 24px}.eyebrow{color:var(--green);font-size:14px;font-weight:900;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.action{min-height:190px;border:0;border-radius:24px;padding:26px;text-align:left;display:flex;flex-direction:column;font-weight:900}.action strong{font-size:28px;margin-top:auto}.action small{font-size:15px;margin-top:8px;font-weight:500}.green{background:var(--green);color:#fff}.amber{background:var(--amber)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.stat span,.stat b,.stat small{display:block}.stat span,.stat small{font-size:13px;color:var(--muted)}.stat b{font-size:31px;margin:7px 0}.back{border:0;background:none;padding:12px 0;color:var(--green);font-weight:900}.summary{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}.summary div{padding:17px;border-right:1px solid var(--line)}.summary div:last-child{border:0;background:#f1f8cc}.summary span,.summary b{display:block}.summary span{font-size:13px;color:var(--muted)}.summary b{font-size:21px;margin-top:6px}h2{font-size:21px;margin:0 0 17px}label{display:block;font-size:14px;font-weight:900;margin-top:16px}input,select,textarea{width:100%;min-height:60px;border:2px solid var(--line);border-radius:13px;background:#fff;padding:12px;margin-top:7px;font-size:20px}textarea{min-height:90px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}.photo{min-height:105px;border:2px dashed #9baaa4;border-radius:15px;display:grid;place-items:center;text-align:center;padding:10px;font-size:14px}.photo input{display:none}.photo.done{border-style:solid;border-color:var(--green);background:#edf8f4}.wide{width:100%;min-height:64px;border:0;border-radius:15px;font-weight:900;margin-top:18px}.save{background:var(--lime)}.scan{background:var(--amber)}.notice{display:none;margin-top:15px;padding:14px;border-radius:12px;background:#fff1cc;color:#704b00;font-weight:900}.notice.on{display:block}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px 0;border-top:1px solid var(--line)}.row small{grid-column:1/3;color:var(--muted)}.meter{background:var(--ink);color:#fff;border-radius:20px;padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.meter span,.meter b{display:block}.meter span{font-size:13px;opacity:.7}.meter b{font-size:28px}.bar{grid-column:1/3;height:15px;background:#ffffff22;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:#fff;min-height:72px;font-weight:900;color:var(--muted)}.nav button.on{color:var(--green)}@media(max-width:650px){.grid{grid-template-columns:1fr}.action{min-height:145px}.stats{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.summary div:last-child{grid-column:1/3}.photos{grid-template-columns:1fr}.photo{min-height:75px}.sync{font-size:0}.sync:after{content:"●";color:#71e0a5}}
</style></head><body><header class="top"><div class="brand"><span class="logo">SS</span><span><b>신성 스크랩</b><small>입고검수 · 재포장</small></span></div><span class="sync">● 온라인 · 자동저장</span></header><main class="wrap">
<section id="home" class="view on"><p class="eyebrow">현장 작업</p><h1>무엇을 작업할까요?</h1><div class="grid"><button class="action green" onclick="show('inspect')"><span>⌗ QR</span><strong>패키지 검수</strong><small>QR 스캔 후 강종·중량·사진을 확정합니다</small></button><button class="action amber" onclick="show('bag')"><span>▣ 500kg</span><strong>재포장 시작</strong><small>출하 마대를 만들고 원 패키지를 투입합니다</small></button></div><div class="stats"><div class="stat"><span>입고 패키지</span><b id="pkgCount">1</b><small>별도 프로그램</small></div><div class="stat"><span>검수 완료</span><b id="doneCount">0</b><small>자동 집계</small></div><div class="stat"><span>출하 마대</span><b>1</b><small>목표 500kg</small></div><div class="stat"><span>동기화 대기</span><b>0</b><small>정상</small></div></div></section>
<section id="inspect" class="view"><button class="back" onclick="show('home')">← 현장 홈</button><p class="eyebrow">패키지 검수</p><h1>P000001</h1><div class="summary"><div><span>기존 강종</span><b>SUS 304</b></div><div><span>최초 중량</span><b>500 kg</b></div><div><span>남은 중량</span><b id="remain">500 kg</b></div></div><div class="card"><h2>새 분류 확정</h2><label>최종 강종<select id="grade"><option>SUS 304</option><option>SUS 316</option><option>SUS 430</option><option>AL 6061</option></select></label><label>확정 중량<input id="weight" inputmode="decimal" type="number" placeholder="중량 입력 (kg)"></label><div class="photos"><label class="photo" id="shapeBox"><input id="shape" type="file" accept="image/*" capture="environment" onchange="photoDone('shapeBox')">＋ 형상 사진<br>(필수)</label><label class="photo" id="analyzerBox"><input id="analyzer" type="file" accept="image/*" capture="environment" onchange="photoDone('analyzerBox')">＋ 분석기 결과<br>(필수)</label><label class="photo" id="anomalyBox"><input type="file" accept="image/*" capture="environment" onchange="photoDone('anomalyBox')">＋ 기타 이상<br>(선택)</label></div><label>메모<textarea id="memo" placeholder="이상 사항을 간단히 입력"></textarea></label><div id="msg" class="notice"></div><button class="wide save" onclick="saveSplit()">분류 확정 저장</button></div><div class="card" style="margin-top:16px"><h2>확정된 분류</h2><div id="splitList"><p style="color:var(--muted)">아직 확정된 분류가 없습니다.</p></div></div></section>
<section id="bag" class="view"><button class="back" onclick="show('home')">← 현장 홈</button><p class="eyebrow">출하 마대</p><h1>B000001</h1><div class="meter"><div><span>현재 중량</span><b id="bagNow">0 kg</b></div><div><span>남은 용량</span><b id="bagRemain">500 kg</b></div><div class="bar"><i id="bar" style="width:0%"></i></div></div><button class="wide scan" onclick="document.getElementById('source').focus()">⌗ 원 패키지 QR 스캔 / 입력</button><div class="card" style="margin-top:16px"><label>원 패키지 번호<input id="source" placeholder="예: P000001"></label><label>투입 강종<select id="bagGrade"><option>SUS 304</option><option>SUS 316</option><option>SUS 430</option></select></label><label>투입 중량<input id="bagInput" type="number" inputmode="decimal" placeholder="kg"></label><div id="bagMsg" class="notice"></div><button class="wide save" onclick="addBag()">투입 저장</button><h2 style="margin-top:25px">투입 기록</h2><div id="bagList"><p style="color:var(--muted)">투입 내역이 없습니다.</p></div></div></section></main><nav class="nav"><button id="n-home" class="on" onclick="show('home')">⌂<br>홈</button><button id="n-inspect" onclick="show('inspect')">⌗<br>검수</button><button id="n-bag" onclick="show('bag')">▣<br>재포장</button></nav><script>
const state=JSON.parse(localStorage.getItem('scrap-field-v1')||'{"splits":[],"inputs":[]}');const fmt=n=>Number(n).toLocaleString('ko-KR')+' kg';function persist(){localStorage.setItem('scrap-field-v1',JSON.stringify(state))}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.getElementById('n-'+id)?.classList.add('on');render()}function photoDone(id){document.getElementById(id).classList.add('done')}function alertBox(id,text){const e=document.getElementById(id);e.textContent=text;e.classList.add('on')}function saveSplit(){const used=state.splits.reduce((a,b)=>a+b.weight,0),w=Number(weight.value);if(!w||w>500-used)return alertBox('msg','입력 가능 잔량은 '+fmt(500-used)+'입니다.');if(!shape.files.length||!analyzer.files.length)return alertBox('msg','형상 사진과 분석기 결과 사진은 필수입니다.');state.splits.push({grade:grade.value,weight:w,memo:memo.value,time:new Date().toLocaleString('ko-KR')});persist();weight.value='';memo.value='';alertBox('msg',500-used-w===0?'남은 중량 0kg · 패키지가 자동 완료되었습니다.':'분류가 확정되었습니다. 일반 작업자는 수정할 수 없습니다.');render()}function addBag(){const w=Number(bagInput.value),used=state.inputs.reduce((a,b)=>a+b.weight,0);if(!source.value.trim())return alertBox('bagMsg','원 패키지 번호를 입력하거나 QR을 스캔하세요.');if(!w||w>500-used)return alertBox('bagMsg','출하 마대 남은 용량은 '+fmt(500-used)+'입니다.');if(state.inputs.length&&state.inputs[0].grade!==bagGrade.value)return alertBox('bagMsg','서로 다른 강종은 이 마대에 혼합할 수 없습니다.');state.inputs.push({source:source.value.trim(),grade:bagGrade.value,weight:w});persist();bagInput.value='';alertBox('bagMsg','투입 저장 완료');render()}function render(){const used=state.splits.reduce((a,b)=>a+b.weight,0);remain.textContent=fmt(500-used);doneCount.textContent=used===500?'1':'0';splitList.innerHTML=state.splits.length?state.splits.map(x=>`<div class="row"><b>✓ ${x.grade}</b><strong>${fmt(x.weight)}</strong><small>확정 · 수정 잠김 · ${x.time}</small></div>`).join(''):'<p style="color:var(--muted)">아직 확정된 분류가 없습니다.</p>';const bu=state.inputs.reduce((a,b)=>a+b.weight,0);bagNow.textContent=fmt(bu);bagRemain.textContent=fmt(500-bu);bar.style.width=Math.min(100,bu/5)+'%';bagList.innerHTML=state.inputs.length?state.inputs.map(x=>`<div class="row"><b>${x.source} · ${x.grade}</b><strong>${fmt(x.weight)}</strong><small>투입 확정</small></div>`).join(''):'<p style="color:var(--muted)">투입 내역이 없습니다.</p>'}render();
</script></body></html>

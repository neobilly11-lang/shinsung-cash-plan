<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10231f">
<title>신성 스크랩 입고검수·재포장</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--ink:#10231f;--green:#0d725d;--lime:#d9f566;--amber:#f5b942;--red:#a72d2d;--bg:#f3f7f5;--line:#d5e1dc;--muted:#64736d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:18px}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;min-height:76px;display:flex;align-items:center;justify-content:space-between;padding:10px max(14px,calc((100% - 1100px)/2))}.brand{border:0;background:none;color:#fff;text-align:left;font-weight:900}.brand small{display:block;opacity:.7;font-size:12px}.server{border:0;border-radius:20px;background:#ffffff18;color:#fff;padding:9px 12px;font-size:12px}.wrap{max-width:1100px;margin:auto;padding:20px 14px 104px}.view{display:none}.view.on{display:block}.eyebrow{font-size:13px;color:var(--green);font-weight:900}h1{font-size:clamp(30px,6vw,46px);margin:5px 0 20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.homebtn{min-height:145px;border:0;border-radius:22px;padding:22px;text-align:left;display:flex;flex-direction:column;background:#fff;font-weight:900}.homebtn strong{font-size:25px;margin-top:auto}.homebtn.green{background:var(--green);color:#fff}.homebtn.lime{background:var(--lime)}.homebtn.amber{background:var(--amber)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:13px 0}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}label{display:block;font-size:13px;font-weight:900}input,select,textarea{width:100%;min-height:56px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:10px;margin-top:6px}textarea{min-height:88px}.wide{grid-column:span 2}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.btn,.file{border:0;border-radius:12px;min-height:54px;padding:11px 16px;background:#e4ebe7;color:var(--ink);font-weight:900;cursor:pointer}.btn.primary{background:var(--green);color:#fff}.btn.warn{background:var(--amber)}.btn.danger{background:#ffe4e4;color:var(--red)}.file input{display:none}.msg{display:none;border-radius:12px;padding:12px;margin:10px 0;background:#e7f6ef;color:#155a45;font-weight:900}.msg.on{display:block}.msg.err{background:#ffe3e3;color:#7b1d1d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.stat small,.stat b{display:block}.stat small{color:var(--muted)}.stat b{font-size:27px;margin-top:5px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:850px}th{background:var(--ink);color:#fff;padding:12px 8px;font-size:13px}td{border-bottom:1px solid var(--line);padding:11px 8px;text-align:center}.qrgrid,.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.qrcard{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;text-align:center}.qrcard img{width:210px;height:210px;max-width:100%}.qrcard b,.qrcard span{display:block}.photo{border:2px dashed #94a69e;border-radius:14px;min-height:100px;display:grid;place-items:center;text-align:center;padding:8px}.photo input{display:none}.photo.ok{border-style:solid;border-color:var(--green);background:#e8f6ef}.preview{width:100%;max-height:230px;object-fit:cover;border-radius:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.summary div{background:#f1f6f3;border-radius:12px;padding:13px}.summary small,.summary b{display:block}.summary b{font-size:21px;margin-top:5px}.scanner{background:#07110e;border-radius:18px;overflow:hidden;position:relative;min-height:260px}.scanner video{display:block;width:100%;max-height:440px;object-fit:cover}.scanline{position:absolute;left:10%;right:10%;top:50%;border-top:4px solid var(--lime)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:#fff;min-height:72px;font-size:13px;font-weight:900;color:var(--muted)}.bottom button.on{color:var(--green);background:#eff8f4}.labels{display:none}.label{height:52mm;border:1px solid #111;display:grid;grid-template-columns:36mm 1fr;align-items:center;padding:4mm;break-inside:avoid}.label img{width:31mm;height:31mm}.label b,.label span{display:block}.label .pkg{font-size:18pt}.label .co{font-size:14pt}.label .gr{font-size:13pt;margin:2mm 0}.donecard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.photos-view{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos-view img{width:100%;height:180px;object-fit:cover;border-radius:11px;background:#e8eeeb}
@media(max-width:720px){.form{grid-template-columns:1fr 1fr}.stats,.summary{grid-template-columns:1fr 1fr}.qrgrid,.photogrid{grid-template-columns:1fr 1fr}.bottom button{font-size:11px;min-height:67px}}@media(max-width:470px){.grid,.form,.qrgrid,.photogrid{grid-template-columns:1fr}.wide{grid-column:auto}.actions>*{width:100%}.server{font-size:0}.server:after{content:"●";font-size:16px}}@page{size:A4 portrait;margin:9mm}@media print{body>*:not(.labels){display:none!important}.labels{display:grid!important;grid-template-columns:1fr 1fr;grid-auto-rows:52mm;width:192mm;margin:auto}}
</style>
</head>
<body>
<header class="top"><button class="brand" onclick="show('home')">신성 스크랩 현장관리<small>독립 배포판 · 입고검수 · QR · 재포장</small></button><button id="server" class="server" onclick="loadState()">● 서버 연결 중</button></header>
<main class="wrap">
  <section id="home" class="view on"><p class="eyebrow">모든 사용자 공용 서버</p><h1>현장 작업을 선택하세요</h1><div class="grid">
    <button class="homebtn lime" onclick="show('po')"><span>P.O</span><strong>P.O·패키지 등록</strong></button>
    <button class="homebtn" onclick="show('qr')"><span>QR</span><strong>QR 생성·A4 출력</strong></button>
    <button class="homebtn green" onclick="show('scan')"><span>카메라</span><strong>패키지 QR 촬영</strong></button>
    <button class="homebtn amber" onclick="show('repack')"><span>500kg</span><strong>재포장 관리</strong></button>
    <button class="homebtn" onclick="show('completed')"><span>✓</span><strong>검수완료·사진 조회</strong></button>
  </div><div class="stats" style="margin-top:14px"><div class="stat"><small>패키지</small><b id="stPos">0</b></div><div class="stat"><small>검수 분류</small><b id="stSplits">0</b></div><div class="stat"><small>검수 완료</small><b id="stDone">0</b></div><div class="stat"><small>출하 마대</small><b id="stBags">0</b></div></div><div class="card"><b>관리 기능</b><p style="color:var(--muted);font-size:14px">초기화 전에 필요한 자료를 반드시 확인하세요.</p><button class="btn danger" onclick="resetAllData()">전체 자료 초기화</button><div id="resetMsg" class="msg"></div></div></section>
  <section id="po" class="view"><p class="eyebrow">입고 등록</p><h1>P.O·패키지 입력</h1><div class="actions"><button class="btn" onclick="downloadTemplate()">엑셀 양식 다운로드</button><label class="file btn warn">엑셀 업로드<input type="file" accept=".xlsx,.xls" onchange="importExcel(this.files[0]);this.value=''"></label></div><div class="card"><div class="form"><label>P.O 넘버<input id="poNo"></label><label>거래처명<input id="company"></label><label>강종명<input id="grade"></label><label>중량(kg)<input id="weight" type="number" inputmode="decimal"></label></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="addPackage()">패키지 자동생성·등록</button><div id="poMsg" class="msg"></div></div><div class="tablewrap"><table><thead><tr><th>선택</th><th>P.O</th><th>거래처</th><th>강종</th><th>패키지번호</th><th>최초중량</th></tr></thead><tbody id="poRows"></tbody></table></div></section>
  <section id="qr" class="view"><p class="eyebrow">라벨 출력</p><h1>패키지 QR 생성</h1><div class="actions"><button class="btn" onclick="selectAll(true)">전체 선택</button><button class="btn" onclick="selectAll(false)">선택 해제</button><button class="btn primary" onclick="printLabels()">선택 QR A4 출력</button></div><div id="qrMsg" class="msg"></div><div id="qrGrid" class="qrgrid"></div></section>
  <section id="scan" class="view"><p class="eyebrow">모바일 QR 촬영</p><h1>패키지 QR 스캔</h1><div id="scanBox" class="scanner"><video id="video" playsinline muted></video><div class="scanline"></div></div><div class="actions"><button class="btn primary" onclick="startScan()">카메라 시작</button><button class="btn" onclick="stopScan()">카메라 종료</button></div><div class="card"><label>카메라가 지원되지 않으면 패키지 선택<select id="manualPackage"></select></label><button class="btn primary" style="width:100%;margin-top:12px" onclick="openInspection(document.getElementById('manualPackage').value)">선택 패키지 검수</button></div><div id="scanMsg" class="msg"></div></section>
  <section id="inspection" class="view"><p class="eyebrow">검수 확정</p><h1 id="inspectTitle">패키지 검수</h1><div class="summary"><div><small>거래처</small><b id="iCompany">-</b></div><div><small>기존 강종</small><b id="iOldGrade">-</b></div><div><small>최초 중량</small><b id="iWeight">0kg</b></div><div><small>남은 중량</small><b id="iRemain">0kg</b></div></div><div class="card"><div class="form"><label class="wide">최종 강종<input id="finalGrade"></label><label class="wide">확정 중량(kg)<input id="finalWeight" type="number" inputmode="decimal"></label></div><div class="photogrid" style="margin-top:12px"><label id="shapeLabel" class="photo"><input id="shapePhoto" type="file" accept="image/*" capture="environment" onchange="photoChosen('shapeLabel',this)">＋ 형상 사진 필수</label><label id="analyzerLabel" class="photo"><input id="analyzerPhoto" type="file" accept="image/*" capture="environment" onchange="photoChosen('analyzerLabel',this)">＋ 분석기 사진 필수</label><label id="anomalyLabel" class="photo"><input id="anomalyPhoto" type="file" accept="image/*" capture="environment" onchange="photoChosen('anomalyLabel',this)">＋ 이상 사진 선택</label></div><label style="margin-top:12px">메모<textarea id="memo"></textarea></label><button id="inspectSave" class="btn primary" style="width:100%;margin-top:12px" onclick="saveInspection()">검수 확정 저장</button><div id="inspectMsg" class="msg"></div></div><div id="splitHistory"></div></section>
  <section id="completed" class="view"><p class="eyebrow">완료 자료</p><h1>검수완료·사진 조회</h1><div id="completedList"></div></section>
  <section id="repack" class="view"><p class="eyebrow">출하 마대</p><h1>재포장 500kg 관리</h1><div class="card"><div class="form"><label>출하 마대번호<input id="bagNo" readonly></label><label>최종 강종<input id="bagGrade"></label><label>목표 중량(kg)<input id="bagTarget" type="number" value="500"></label><button class="btn primary" onclick="createBag()">마대 생성</button></div><div id="bagMsg" class="msg"></div></div><div class="card"><label>작업 마대<select id="bagSelect" onchange="renderBag()"></select></label><div class="form" style="margin-top:12px"><label class="wide">원 패키지<select id="sourcePackage"></select></label><label>투입 중량(kg)<input id="inputWeight" type="number" inputmode="decimal"></label><button class="btn primary" onclick="addInput()">투입 저장</button></div><div id="bagSummary" class="summary" style="margin-top:12px"></div></div><div id="bagInputs"></div></section>
</main>
<nav class="bottom"><button data-v="home" class="on" onclick="show('home')">⌂<br>홈</button><button data-v="po" onclick="show('po')">P.O<br>등록</button><button data-v="qr" onclick="show('qr')">QR<br>출력</button><button data-v="scan" onclick="show('scan')">QR<br>촬영</button><button data-v="completed" onclick="show('completed')">완료<br>조회</button><button data-v="repack" onclick="show('repack')">재포장<br>관리</button></nav>
<section id="labels" class="labels"></section>
<script>
'use strict';
const API='https://orpeybiqikrdydkhsjjs.supabase.co',KEY='sb_publishable_TerLvPZo7e5_X91A-P4qlQ_DaqBly0Q';
const HEAD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},TABLE='scrap_app_state',BUCKET='scrap-photos',LOCAL='scrap-v2-backup';
let state={pos:[],splits:[],inputs:[],bags:[]},revision=0,selected=new Set(),currentPackage='',stream=null,scanTimer=null,saving=false;
const E=id=>document.getElementById(id),num=v=>Number(v)||0,kg=v=>num(v).toLocaleString('ko-KR',{maximumFractionDigits:2})+' kg';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(id,text,error=false){const x=E(id);x.textContent=text;x.className='msg on'+(error?' err':'')}
function defaults(x){return{pos:[],splits:[],inputs:[],bags:[],...(x||{}),pos:Array.isArray(x?.pos)?x.pos:[],splits:Array.isArray(x?.splits)?x.splits:[],inputs:Array.isArray(x?.inputs)?x.inputs:[],bags:Array.isArray(x?.bags)?x.bags:[]}}
async function loadState(){E('server').textContent='● 서버 연결 중';try{const r=await fetch(`${API}/rest/v1/${TABLE}?id=eq.main&select=payload,revision`,{headers:HEAD,cache:'no-store'});if(!r.ok)throw Error(`서버 읽기 오류 HTTP ${r.status}`);const rows=await r.json();if(!Array.isArray(rows)||rows.length!==1)throw Error(`공용 자료행 오류 (${Array.isArray(rows)?rows.length:'형식'})`);state=defaults(rows[0].payload);revision=num(rows[0].revision);localStorage.setItem(LOCAL,JSON.stringify(state));E('server').textContent='● 공용 서버 연결됨';E('server').style.color='#8ff0b5';renderAll()}catch(e){try{state=defaults(JSON.parse(localStorage.getItem(LOCAL)||'{}'))}catch(_){localStorage.removeItem(LOCAL);state=defaults({})}E('server').textContent='● 서버 재연결';E('server').style.color='#ffd27a';showFatal('공용 서버 연결 실패',e);renderAll()}}
async function saveState(){localStorage.setItem(LOCAL,JSON.stringify(state));const next=revision+1,r=await fetch(`${API}/rest/v1/${TABLE}?id=eq.main&revision=eq.${revision}`,{method:'PATCH',headers:{...HEAD,Prefer:'return=minimal'},body:JSON.stringify({payload:state,revision:next,updated_at:new Date().toISOString()})});if(!r.ok)throw Error(`저장 응답 ${r.status}`);const verify=await fetch(`${API}/rest/v1/${TABLE}?id=eq.main&select=revision`,{headers:HEAD,cache:'no-store'});if(!verify.ok)throw Error(`검증 응답 ${verify.status}`);const rows=await verify.json();if(!rows.length||num(rows[0].revision)!==next){await loadState();throw Error('다른 사용자가 먼저 저장했습니다. 최신 자료를 불러왔습니다.')}revision=next;E('server').textContent='● 공용 서버 저장됨';renderAll()}
function show(id){if(!E(id))id='home';stopScan();document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));E(id).classList.add('on');document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.v===id));if(id==='qr')renderQr();if(id==='completed')renderCompleted();if(id==='repack')renderRepack();scrollTo(0,0);history.replaceState(null,'','#'+id)}
function nextPackage(){const m=state.pos.reduce((a,x)=>Math.max(a,num(String(x.packageNo||'').replace(/\D/g,''))),0);return'P'+String(m+1).padStart(6,'0')}
function nextBag(){const m=state.bags.reduce((a,x)=>Math.max(a,num(String(x.bagNo||'').replace(/\D/g,''))),0);return'B'+String(m+1).padStart(6,'0')}
async function addPackage(){const poNo=E('poNo').value.trim(),company=E('company').value.trim(),grade=E('grade').value.trim(),weight=num(E('weight').value);if(!poNo||!company||!grade||weight<=0)return msg('poMsg','모든 항목을 정확히 입력하세요.',true);const x={id:crypto.randomUUID(),poNo,company,grade,packageNo:nextPackage(),weight,status:'CONFIRMED',createdAt:new Date().toISOString()};state.pos.push(x);selected.add(x.id);try{await saveState();['poNo','company','grade','weight'].forEach(id=>E(id).value='');msg('poMsg',x.packageNo+' 등록 완료')}catch(e){state.pos=state.pos.filter(p=>p.id!==x.id);msg('poMsg',e.message,true)}}
function selectOne(id,on){on?selected.add(id):selected.delete(id);renderAll()}function selectAll(on){selected.clear();if(on)state.pos.forEach(x=>selected.add(x.id));renderAll()}
function qrTarget(x){const u=new URL(location.href);u.search='?package='+encodeURIComponent(x.packageNo);u.hash='inspection';return u.href}
function qrUrl(x,size=260){return`https://api.qrserver.com/v1/create-qr-code/?format=png&margin=8&size=${size}x${size}&data=${encodeURIComponent(qrTarget(x))}`}
function renderQr(){const list=state.pos.filter(x=>selected.has(x.id));E('qrGrid').innerHTML=list.length?list.map(x=>`<article class="qrcard"><img src="${qrUrl(x)}" alt="${esc(x.packageNo)} QR"><b>${esc(x.packageNo)}</b><span>${esc(x.company)}</span><span>${esc(x.grade)} · ${kg(x.weight)}</span></article>`).join(''):'<div class="card">P.O 화면에서 패키지를 선택하세요.</div>'}
async function printLabels(){const list=state.pos.filter(x=>selected.has(x.id));if(!list.length)return msg('qrMsg','인쇄할 패키지를 선택하세요.',true);E('labels').innerHTML=list.map(x=>`<article class="label"><img src="${qrUrl(x,300)}"><div><b class="co">${esc(x.company)}</b><span class="gr">${esc(x.grade)}</span><b class="pkg">${esc(x.packageNo)}</b><span>P.O ${esc(x.poNo)} · ${kg(x.weight)}</span></div></article>`).join('');const imgs=[...E('labels').querySelectorAll('img')];try{await Promise.race([Promise.all(imgs.map(i=>i.complete&&i.naturalWidth?1:new Promise((ok,no)=>{i.onload=ok;i.onerror=no}))),new Promise((_,no)=>setTimeout(()=>no(Error('QR 생성 시간 초과')),15000))]);print()}catch(e){msg('qrMsg',e.message,true)}}
function packageUsed(no){return state.splits.filter(s=>s.packageNo===no&&s.status!=='CANCELLED').reduce((a,s)=>a+num(s.weight),0)}
function packageRemain(p){return Math.max(0,num(p.weight)-packageUsed(p.packageNo))}
function openInspection(no){const p=state.pos.find(x=>x.packageNo===no);if(!p)return msg('scanMsg','등록된 패키지번호가 아닙니다.',true);currentPackage=no;E('inspectTitle').textContent=no+' 검수';E('iCompany').textContent=p.company;E('iOldGrade').textContent=p.grade;E('iWeight').textContent=kg(p.weight);E('iRemain').textContent=kg(packageRemain(p));E('finalGrade').value=p.grade;E('finalWeight').value='';E('memo').value='';['shapePhoto','analyzerPhoto','anomalyPhoto'].forEach(id=>E(id).value='');['shapeLabel','analyzerLabel','anomalyLabel'].forEach(id=>E(id).classList.remove('ok'));renderSplitHistory();show('inspection')}
function photoChosen(label,input){E(label).classList.toggle('ok',!!input.files[0])}
async function loadImage(file){if('createImageBitmap'in window){try{return await createImageBitmap(file)}catch(_){}}return await new Promise((ok,no)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);ok(img)};img.onerror=()=>{URL.revokeObjectURL(url);no(Error('사진을 읽을 수 없습니다.'))};img.src=url})}
async function compress(file){const img=await loadImage(file),scale=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');if(!ctx)throw Error('사진 압축 기능을 사용할 수 없습니다.');ctx.drawImage(img,0,0,c.width,c.height);return await new Promise((ok,no)=>c.toBlob(blob=>blob?ok(blob):no(Error('사진 압축에 실패했습니다.')),'image/jpeg',.76))}
async function blobDataUrl(blob){return await new Promise((ok,no)=>{const reader=new FileReader();reader.onload=()=>ok(String(reader.result));reader.onerror=()=>no(Error('사진 대체 저장 변환 실패'));reader.readAsDataURL(blob)})}
async function uploadPhoto(file,no,kind){if(!file)return'';const blob=await compress(file);return await blobDataUrl(blob)}
async function saveInspection(){if(saving)return;const p=state.pos.find(x=>x.packageNo===currentPackage),grade=E('finalGrade').value.trim(),weight=num(E('finalWeight').value),remain=p?packageRemain(p):0,shape=E('shapePhoto').files[0],analyzer=E('analyzerPhoto').files[0],anomaly=E('anomalyPhoto').files[0];if(!p)return msg('inspectMsg','패키지를 다시 선택하세요.',true);if(!grade)return msg('inspectMsg','최종 강종을 입력하세요.',true);if(weight<=0||weight>remain)return msg('inspectMsg','확정 중량은 남은 중량 '+kg(remain)+' 이하여야 합니다.',true);if(!shape||!analyzer)return msg('inspectMsg','형상 사진과 분석기 사진은 필수입니다.',true);saving=true;E('inspectSave').disabled=true;let split=null;try{const photos={shape:await uploadPhoto(shape,p.packageNo,'shape'),analyzer:await uploadPhoto(analyzer,p.packageNo,'analyzer'),anomaly:await uploadPhoto(anomaly,p.packageNo,'anomaly')};split={id:crypto.randomUUID(),packageNo:p.packageNo,grade,weight,memo:E('memo').value.trim(),photos,status:'CONFIRMED',createdAt:new Date().toISOString()};state.splits.push(split);await saveState();msg('inspectMsg',packageRemain(p)===0?'검수 완료 처리되었습니다.':'분류 저장 완료 · 남은 중량 '+kg(packageRemain(p)));openInspection(p.packageNo)}catch(e){if(split)state.splits=state.splits.filter(x=>x.id!==split.id);msg('inspectMsg','검수 저장 실패: '+e.message,true)}finally{saving=false;E('inspectSave').disabled=false}}
function photoUrl(path){if(!path)return'';const value=String(path).trim();if(/^(https?:\/\/|data:image\/)/i.test(value))return value;const clean=value.replace(/^\/+/,'').replace(/^scrap-photos\//,'');return`${API}/storage/v1/object/public/${BUCKET}/${clean.split('/').map(encodeURIComponent).join('/')}`}
function renderSplitHistory(){const rows=state.splits.filter(s=>s.packageNo===currentPackage&&s.status!=='CANCELLED');E('splitHistory').innerHTML=rows.length?'<div class="card"><b>확정 분류 내역</b>'+rows.map(s=>`<p>${esc(s.grade)} · ${kg(s.weight)} ${esc(s.memo||'')}</p>`).join('')+'</div>':''}
function renderCompleted(){const done=state.pos.filter(p=>packageRemain(p)===0&&state.splits.some(s=>s.packageNo===p.packageNo));E('completedList').innerHTML=done.length?done.map(p=>{const ss=state.splits.filter(s=>s.packageNo===p.packageNo&&s.status!=='CANCELLED'),photos=ss.flatMap(s=>Object.values(s.photos||{})).filter(Boolean);return`<article class="donecard"><h2>${esc(p.packageNo)} · ${esc(p.company)}</h2><p>${ss.map(s=>`${esc(s.grade)} ${kg(s.weight)}`).join(' / ')}</p><div class="photos-view">${photos.map(x=>`<a href="${photoUrl(x)}" target="_blank"><img src="${photoUrl(x)}" loading="lazy"></a>`).join('')}</div></article>`}).join(''):'<div class="card">검수 완료된 패키지가 없습니다.</div>'}
async function createBag(){const grade=E('bagGrade').value.trim(),target=num(E('bagTarget').value)||500;if(!grade||target<=0)return msg('bagMsg','강종과 목표중량을 입력하세요.',true);const bag={id:crypto.randomUUID(),bagNo:nextBag(),grade,target,status:'OPEN',createdAt:new Date().toISOString()};state.bags.push(bag);try{await saveState();E('bagGrade').value='';msg('bagMsg',bag.bagNo+' 생성 완료');E('bagSelect').value=bag.id;renderRepack()}catch(e){state.bags=state.bags.filter(x=>x.id!==bag.id);msg('bagMsg',e.message,true)}}
async function resetAllData(){if(!confirm('P.O·패키지·검수·재포장 자료를 모두 초기화할까요?'))return;if(!confirm('정말 초기화하시겠습니까? 이 작업은 되돌릴 수 없습니다.'))return;const backup=state;state=defaults({});selected.clear();try{await saveState();localStorage.removeItem(LOCAL);msg('resetMsg','전체 자료를 초기화했습니다.');renderAll()}catch(e){state=backup;msg('resetMsg','초기화 실패: '+e.message,true);renderAll()}}
function confirmedByPackage(no,grade){return state.splits.filter(s=>s.packageNo===no&&s.grade===grade&&s.status!=='CANCELLED').reduce((a,s)=>a+num(s.weight),0)}
function usedByPackage(no,grade){return state.inputs.filter(i=>i.packageNo===no&&i.grade===grade&&i.status!=='CANCELLED').reduce((a,i)=>a+num(i.weight),0)}
function bagWeight(id){return state.inputs.filter(i=>i.bagId===id&&i.status!=='CANCELLED').reduce((a,i)=>a+num(i.weight),0)}
async function addInput(){const bag=state.bags.find(x=>x.id===E('bagSelect').value),p=state.pos.find(x=>x.packageNo===E('sourcePackage').value),weight=num(E('inputWeight').value);if(!bag||!p)return alert('작업 마대와 원 패키지를 선택하세요.');const available=confirmedByPackage(p.packageNo,bag.grade)-usedByPackage(p.packageNo,bag.grade),capacity=bag.target-bagWeight(bag.id);if(weight<=0||weight>available)return alert('원 패키지 사용 가능 잔량은 '+kg(available)+'입니다.');if(weight>capacity)return alert('출하 마대 남은 용량은 '+kg(capacity)+'입니다.');const input={id:crypto.randomUUID(),bagId:bag.id,bagNo:bag.bagNo,packageNo:p.packageNo,grade:bag.grade,weight,status:'CONFIRMED',createdAt:new Date().toISOString()};state.inputs.push(input);if(weight===capacity)bag.status='COMPLETE';try{await saveState();E('inputWeight').value='';renderRepack()}catch(e){state.inputs=state.inputs.filter(x=>x.id!==input.id);alert(e.message)}}
function renderRepack(){E('bagNo').value=nextBag();const old=E('bagSelect').value;E('bagSelect').innerHTML='<option value="">작업 마대 선택</option>'+state.bags.map(b=>`<option value="${b.id}">${esc(b.bagNo)} · ${esc(b.grade)} · ${kg(bagWeight(b.id))}/${kg(b.target)}</option>`).join('');if(state.bags.some(x=>x.id===old))E('bagSelect').value=old;renderBag()}
function renderBag(){const bag=state.bags.find(x=>x.id===E('bagSelect').value);if(!bag){E('bagSummary').innerHTML='';E('bagInputs').innerHTML='';return}const sources=state.pos.filter(p=>confirmedByPackage(p.packageNo,bag.grade)-usedByPackage(p.packageNo,bag.grade)>0);E('sourcePackage').innerHTML='<option value="">원 패키지 선택</option>'+sources.map(p=>`<option value="${p.packageNo}">${esc(p.packageNo)} · 가용 ${kg(confirmedByPackage(p.packageNo,bag.grade)-usedByPackage(p.packageNo,bag.grade))}</option>`).join('');const w=bagWeight(bag.id);E('bagSummary').innerHTML=`<div><small>마대</small><b>${esc(bag.bagNo)}</b></div><div><small>강종</small><b>${esc(bag.grade)}</b></div><div><small>현재</small><b>${kg(w)}</b></div><div><small>남은 용량</small><b>${kg(bag.target-w)}</b></div>`;const inputs=state.inputs.filter(i=>i.bagId===bag.id&&i.status!=='CANCELLED');E('bagInputs').innerHTML=inputs.length?'<div class="card">'+inputs.map(i=>`<p>${esc(i.packageNo)} → ${kg(i.weight)}</p>`).join('')+'</div>':''}
function renderAll(){state=defaults(state);E('stPos').textContent=state.pos.length;E('stSplits').textContent=state.splits.filter(s=>s.status!=='CANCELLED').length;E('stDone').textContent=state.pos.filter(p=>packageRemain(p)===0&&state.splits.some(s=>s.packageNo===p.packageNo)).length;E('stBags').textContent=state.bags.length;E('poRows').innerHTML=state.pos.length?state.pos.map(p=>`<tr><td><input type="checkbox" ${selected.has(p.id)?'checked':''} onchange="selectOne('${p.id}',this.checked)" style="width:23px;height:23px"></td><td>${esc(p.poNo)}</td><td>${esc(p.company)}</td><td>${esc(p.grade)}</td><td><b>${esc(p.packageNo)}</b></td><td>${kg(p.weight)}</td></tr>`).join(''):'<tr><td colspan="6">등록 자료가 없습니다.</td></tr>';E('manualPackage').innerHTML='<option value="">패키지 선택</option>'+state.pos.map(p=>`<option value="${p.packageNo}">${esc(p.packageNo)} · ${esc(p.company)}</option>`).join('');renderQr();renderCompleted();renderRepack();if(currentPackage&&state.pos.some(p=>p.packageNo===currentPackage)){const p=state.pos.find(x=>x.packageNo===currentPackage);E('iRemain').textContent=kg(packageRemain(p));renderSplitHistory()}}
async function startScan(){stopScan();if(!('BarcodeDetector'in window))return msg('scanMsg','이 기기는 자동 QR 인식을 지원하지 않습니다. 아래 패키지 선택을 이용하세요.',true);try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});E('video').srcObject=stream;await E('video').play();const detector=new BarcodeDetector({formats:['qr_code']});scanTimer=setInterval(async()=>{try{const codes=await detector.detect(E('video'));if(!codes.length)return;const raw=codes[0].rawValue||'',u=new URL(raw,location.href),no=u.searchParams.get('package')||raw.trim();if(state.pos.some(p=>p.packageNo===no)){stopScan();openInspection(no)}}catch(_){}},450);msg('scanMsg','QR을 화면 중앙에 맞추세요.')}catch(e){msg('scanMsg','카메라를 열 수 없습니다: '+e.message,true)}}
function stopScan(){if(scanTimer)clearInterval(scanTimer);scanTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(E('video'))E('video').srcObject=null}
function downloadTemplate(){if(!window.XLSX)return alert('엑셀 모듈을 불러오지 못했습니다.');const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet([{'P.O 넘버':'PO-2026-001','거래처명':'예시메탈','강종명':'INCONEL 718','중량(kg)':500}]);XLSX.utils.book_append_sheet(wb,ws,'P.O입력');XLSX.writeFile(wb,'신성스크랩_PO_업로드양식.xlsx')}
async function importExcel(file){if(!file)return;try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let count=0;for(const r of rows){const poNo=String(r['P.O 넘버']||r['PO 넘버']||'').trim(),company=String(r['거래처명']||'').trim(),grade=String(r['강종명']||'').trim(),weight=num(r['중량(kg)']||r['중량']);if(!poNo||!company||!grade||weight<=0)continue;const packageNo=nextPackage();state.pos.push({id:crypto.randomUUID(),poNo,company,grade,packageNo,weight,status:'CONFIRMED',createdAt:new Date().toISOString()});count++}if(!count)throw Error('올바른 행이 없습니다.');await saveState();msg('poMsg',count+'개 패키지 업로드 완료')}catch(e){msg('poMsg','엑셀 업로드 실패: '+e.message,true)}}
function showFatal(title,error){const text=`${title}: ${error?.message||error}`;console.error(text);const target=E('inspectMsg')&&E('inspection').classList.contains('on')?'inspectMsg':E('poMsg')&&E('po').classList.contains('on')?'poMsg':'scanMsg';if(E(target))msg(target,text,true)}
window.addEventListener('error',e=>showFatal('화면 오류',e.error||e.message));window.addEventListener('unhandledrejection',e=>showFatal('처리 오류',e.reason));window.addEventListener('beforeunload',stopScan);
const params=new URLSearchParams(location.search),requested=params.get('package');loadState().then(()=>{if(requested)openInspection(requested);else show(location.hash.slice(1)&&E(location.hash.slice(1))?location.hash.slice(1):'home')});
</script>

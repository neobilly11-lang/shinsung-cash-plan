<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10231f"><title>신성 스크랩 QR 촬영</title><style>:root{--ink:#10231f;--green:#0d725d;--lime:#d9f566;--amber:#f5b942;--bg:#f4f7f5;--line:#d8e2de;--muted:#687670}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;font-size:18px}button,input{font:inherit}.top{background:var(--ink);color:#fff;min-height:75px;display:flex;align-items:center;justify-content:space-between;padding:10px max(14px,calc((100% - 760px)/2))}.brand b,.brand small{display:block}.brand small{font-size:12px;opacity:.7}.wrap{max-width:760px;margin:auto;padding:18px 14px 80px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.nav a,.nav button{min-height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:11px 14px;text-decoration:none;font-weight:900}.modes{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:15px}.mode{min-height:90px;border:2px solid var(--line);border-radius:17px;background:#fff;font-weight:900;font-size:20px}.mode.on{border-color:var(--green);background:#e9f7f1;color:var(--green)}.camera{position:relative;background:#000;border-radius:20px;overflow:hidden;min-height:390px;display:grid;place-items:center}.camera video{width:100%;height:100%;min-height:390px;object-fit:cover}.frame{position:absolute;width:min(68vw,290px);height:min(68vw,290px);border:5px solid var(--lime);border-radius:24px;box-shadow:0 0 0 999px #0005;pointer-events:none}.guide{position:absolute;bottom:18px;left:15px;right:15px;background:#10231fdd;color:#fff;padding:12px;border-radius:12px;text-align:center;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}label{display:block;font-size:13px;font-weight:900;margin-top:12px}input{width:100%;height:58px;border:2px solid var(--line);border-radius:12px;margin-top:7px;padding:11px;font-size:20px}.wide{width:100%;min-height:62px;border:0;border-radius:14px;font-weight:900;margin-top:13px}.start{background:var(--amber)}.save{background:var(--lime)}.msg{display:none;padding:13px;border-radius:11px;background:#fff1cc;color:#704b00;font-weight:900;margin-top:12px}.msg.on{display:block}.result{display:none}.result.on{display:block}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.summary div{background:#f0f4f2;border-radius:11px;padding:12px}.summary span,.summary b{display:block}.summary span{font-size:12px;color:var(--muted)}.summary b{margin-top:5px}.server{font-size:12px}@media(max-width:550px){.camera,.camera video{min-height:330px}.modes{grid-template-columns:1fr}.server{font-size:0}.server:after{content:'●';font-size:15px}.nav>*{flex:1;text-align:center}}</style></head><body><header class="top"><div class="brand"><b>⌗ QR 카메라 촬영</b><small>패키지 검수 · 재포장 투입</small></div><span id="server" class="server">● 서버 연결 중</span></header><main class="wrap"><nav class="nav"><button onclick="history.length>1?history.back():location.href='app.html'">← 이전</button><a href="app.html">⌂ 현장 홈</a><a href="app.html?view=qr">QR 생성</a></nav><div class="modes"><button id="inspectMode" class="mode on" onclick="setMode('inspect')">패키지 검수 QR 촬영</button><button id="bagMode" class="mode" onclick="setMode('bag')">재포장 QR 촬영</button></div><div class="camera"><video id="video" playsinline muted></video><div class="frame"></div><div id="guide" class="guide">QR을 사각형 안에 맞춰주세요</div></div><button id="cameraButton" class="wide start" onclick="startCamera()">카메라 켜기</button><section class="card"><b>카메라 인식이 안 될 때 직접 입력</b><label>패키지번호 또는 QR 내용<input id="manual" placeholder="P000001"></label><button class="wide save" onclick="acceptCode(manual.value)">번호 확인</button><div id="msg" class="msg"></div></section><section id="result" class="card result"><h2 id="resultTitle">인식 결과</h2><div class=" 'use strict';const API='https://orpeybiqikrdydkhsjjs.supabase.co',KEY='sb_publishable_TerLvPZo7e5_X91A-P4qlQ_DaqBly0Q',H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};let mode='inspect',stream=null,detector=null,timer=null,state={pos:[],splits:[],inputs:[]},revision=0,currentPackage=null;const E=id=>document.getElementById(id),F=n=>Number(n).toLocaleString('ko-KR')+' kg';function note(t){E('msg').textContent=t;E('msg').classList.add('on')}function setMode(m){mode=m;E('inspectMode').classList.toggle('on',m==='inspect');E('bagMode').classList.toggle('on',m==='bag');E('guide').textContent=m==='inspect'?'검수할 패키지 QR을 촬영하세요':'투입할 원 패키지 QR을 촬영하세요';E('result').classList.remove('on');E('manual').value=''}async function load(){try{let r=await fetch(API+'/rest/v1/scrap_app_state?id=eq.main&select=payload,revision',{headers:H,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let a=await r.json();state={pos:[],splits:[],inputs:[],...a[0].payload};revision=a[0].revision;E('server').textContent='● 공용 서버 연결됨';E('server').style.color='#8ff0b5'}catch(e){E('server').textContent='● 서버 연결 오류';E('server').style.color='#ffd27a';note('서버 연결 실패: '+e.message)}}async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('이 기기는 카메라 촬영을 지원하지 않습니다');if(!('BarcodeDetector'in window))throw Error('이 브라우저는 QR 자동인식을 지원하지 않습니다. 아래 직접 입력을 이용하세요');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});E('video').srcObject=stream;await E('video').play();detector=new BarcodeDetector({formats:['qr_code']});E('cameraButton').textContent='카메라 촬영 중 · 다시 시작';clearInterval(timer);timer=setInterval(scanFrame,450)}catch(e){note('카메라 오류: '+e.message+'. 주소창의 카메라 권한을 허용하거나 직접 입력하세요.')}}async function scanFrame(){if(!detector||E('video').readyState<2)return;try{let codes=await detector.detect(E('video'));if(codes.length){clearInterval(timer);acceptCode(codes[0].rawValue)}}catch(e){note('QR 인식 오류: '+e.message)}}function parsePackage(raw){let s=String(raw||'').trim();try{let u=new URL(s),p=u.searchParams.get('package');if(p)return p}catch{}let m=s.match(/P\d{6}/i);return m?m[0].toUpperCase():s.toUpperCase()}function acceptCode(raw){let no=parsePackage(raw),p=state.pos.find(x=>String(x.packageNo).toUpperCase()===no);if(!p)return note(no+' 패키지가 P.O 서버에 등록되어 있지 않습니다.');currentPackage=p;let confirmed=state.splits.filter(x=>x.packageNo===no).reduce((a,b)=>a+Number(b.weight),0),used=state.inputs.filter(x=>x.source===no||x.packageNo===no).reduce((a,b)=>a+Number(b.weight),0),available=Math.max(0,p.weight-confirmed-used),bagUsed=state.inputs.filter(x=>(x.bagNo||'B000001')===(E('bagNo')?.value||'B000001')).reduce((a,b)=>a+Number(b.weight),0);E('packageNo').textContent=no;E('grade').textContent=p.grade;E('available').textContent=F(available);E('bagRemain').textContent=F(Math.max(0,500-bagUsed));E('result').classList.add('on');E('bagForm').style.display=mode==='bag'?'block':'none';E('inspectButton').style.display=mode==='inspect'?'block':'none';E('resultTitle').textContent=mode==='inspect'?'검수 패키지 확인':'재포장 투입 원재고 확인';note('QR 인식 완료: '+no)}function openInspection(){if(!currentPackage)return;location.href='app.html?view=inspect&package='+encodeURIComponent(currentPackage.packageNo)}async function saveBagInput(){if(!currentPackage)return note('패키지 QR을 먼저 촬영하세요.');let no=currentPackage.packageNo,w=Number(E('inputWeight').value),bn=E('bagNo').value.trim()||'B000001',confirmed=state.splits.filter(x=>x.packageNo===no).reduce((a,b)=>a+Number(b.weight),0),used=state.inputs.filter(x=>x.source===no||x.packageNo===no).reduce((a,b)=>a+Number(b.weight),0),available=currentPackage.weight-confirmed-used,bagUsed=state.inputs.filter(x=>(x.bagNo||'B000001')===bn).reduce((a,b)=>a+Number(b.weight),0);if(!w||w<=0)return note('투입 중량을 입력하세요.');if(w>available)return note('원 패키지 사용 가능 잔량은 '+F(available)+'입니다.');if(w>500-bagUsed)return note('출하 마대 남은 용량은 '+F(500-bagUsed)+'입니다.');let existingGrade=state.inputs.find(x=>(x.bagNo||'B000001')===bn)?.grade;if(existingGrade&&existingGrade!==currentPackage.grade)return note('서로 다른 강종은 같은 마대에 투입할 수 없습니다.');state.inputs.push({id:crypto.randomUUID(),bagNo:bn,source:no,grade:currentPackage.grade,weight:w,time:new Date().toISOString()});try{let r=await fetch(API+'/rest/v1/scrap_app_state?id=eq.main&revision=eq.'+revision,{method:'PATCH',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({payload:state,revision:revision+1,updated_at:new Date().toISOString()})}),a=await r.json();if(!r.ok||!a.length)throw Error('다른 작업자가 먼저 저장했습니다');revision=a[0].revision;E('inputWeight').value='';note(bn+'에 '+F(w)+' 투입 완료');acceptCode(no)}catch(e){state.inputs.pop();note('저장 실패: '+e.message)}}load();let q=new URLSearchParams(location.search).get('mode');if(q==='bag')setMode('bag');

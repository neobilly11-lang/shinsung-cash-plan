<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10231f"><title>신성 스크랩 현장관리</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>:root{--ink:#10231f;--green:#0d725d;--lime:#d9f566;--amber:#f5b942;--bg:#f4f7f5;--line:#d8e2de;--muted:#687670;--red:#a32626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;font-size:17px}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:30;min-height:76px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px max(14px,calc((100% - 1100px)/2))}.brand{display:flex;align-items:center;gap:11px;border:0;background:none;color:#fff;text-align:left}.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:var(--lime);color:var(--ink);font-weight:900}.brand b,.brand small{display:block}.brand small{font-size:12px;opacity:.7}.server{border:0;border-radius:22px;padding:9px 12px;background:#ffffff18;color:#fff;font-size:12px}.wrap{max-width:1100px;margin:auto;padding:20px 14px 105px}.view{display:none}.view.on{display:block}.routebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.routebar button{min-height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 15px;font-weight:900}.eyebrow{font-size:13px;font-weight:900;color:var(--green);margin:0}h1{font-size:clamp(30px,6vw,46px);margin:5px 0 22px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.action{border:0;border-radius:23px;min-height:175px;padding:23px;text-align:left;display:flex;flex-direction:column;font-weight:900}.action strong{font-size:26px;margin-top:auto}.action small{font-size:13px;margin-top:7px;font-weight:500}.green{background:var(--green);color:#fff}.amber{background:var(--amber)}.lime{background:var(--lime)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px}.stat span,.stat b,.stat small{display:block}.stat span,.stat small{font-size:12px;color:var(--muted)}.stat b{font-size:28px;margin:6px 0}.form{display:grid;grid-template-columns:1fr 1.2fr 1fr .8fr auto;gap:9px;align-items:end}label{font-size:13px;font-weight:900;display:block}input,select,textarea{width:100%;min-height:57px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:11px;margin-top:7px;font-size:18px}textarea{min-height:90px}.save{min-height:57px;border:0;border-radius:12px;background:var(--lime);padding:0 18px;font-weight:900}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.tool,.file{min-height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 15px;font-weight:900;cursor:pointer}.file input{display:none}.primary{background:var(--green);color:#fff;border-color:var(--green)}.warn{background:var(--amber);border-color:var(--amber)}.msg{display:none;padding:13px;margin-top:12px;border-radius:11px;background:#fff1cc;color:#704b00;font-weight:900}.msg.on{display:block}.msg.err{background:#ffe3e3;color:#771616}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:920px}th{background:var(--ink);color:#fff;padding:12px 8px;font-size:13px}td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:center}td.left{text-align:left}.pkg{font-weight:900;color:var(--green)}.mini{border:0;border-radius:9px;padding:8px 10px;background:#e5f4ed;color:var(--green);font-weight:900}.qrgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.qrcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center}.qrcard img{width:210px;height:210px;max-width:100%;object-fit:contain}.qrcard b,.qrcard span{display:block}.qrcard b{font-size:22px;margin:8px 0}.qrcard span{font-weight:900}.summary{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:14px}.summary div{padding:15px;border-right:1px solid var(--line)}.summary span,.summary b{display:block}.summary span{font-size:12px;color:var(--muted)}.summary b{font-size:19px;margin-top:5px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.photo{min-height:90px;border:2px dashed #9baaa4;border-radius:13px;display:grid;place-items:center;text-align:center;padding:8px}.photo input{display:none}.photo.done{border-style:solid;border-color:var(--green);background:#eaf7f1}.labels{display:none}.labelPrint{border:1.5px solid #111;display:grid;grid-template-columns:35mm 1fr;align-items:center;padding:4mm;height:52mm;break-inside:avoid}.labelPrint img{width:31mm;height:31mm}.labelText{padding-left:3mm}.labelText b,.labelText span{display:block}.labelText .co{font-size:15pt}.labelText .gr{font-size:14pt;margin:3mm 0}.labelText .pk{font-size:18pt}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:#fff;min-height:72px;font-weight:900;color:var(--muted)}.bottom button.on{color:var(--green)}@media(max-width:760px){.actions{grid-template-columns:1fr}.action{min-height:135px}.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr 1fr}.form button{grid-column:1/3}.qrgrid{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.server{font-size:0}.server:after{content:'●';font-size:15px}}@media(max-width:500px){.form,.qrgrid{grid-template-columns:1fr}.form button{grid-column:auto}.routebar button{flex:1}.toolbar>*{width:100%;text-align:center}}@page{size:A4 portrait;margin:9mm}@media print{body{background:#fff}.top,.wrap,.bottom{display:none!important}.labels{display:grid!important;grid-template-columns:1fr 1fr;grid-auto-rows:52mm;width:192mm;margin:auto}}
</style></head><body><header class="top"><button class="brand" onclick="go('home')"><span class="logo">SS</span><span><b>신성 스크랩</b><small>입고검수 · QR · 재포장</small></span></button><button id="server" class="server" onclick="loadServer()">● 서버 연결 중</button></header><main class="wrap"><div class="routebar"><button onclick="backView()">← 이전</button><button onclick="go('home')">⌂ 현장 홈</button><button onclick="go('po')">P.O 등록</button><button onclick="go('qr')">QR 생성</button></div><section id="home" class="view on"><p class="eyebrow">모든 사용자 공용</p><h1>현장 작업을 선택하세요</h1><div class="actions"><button class="action lime" onclick="go('po')"><span>P.O</span><strong>P.O·패키지 등록</strong><small>엑셀 업로드와 자동 패키지번호</small></button><button class="action green" onclick="go('qr')"><span>⌗ QR</span><strong>QR 생성·출력</strong><small>개별 QR 확인과 A4 10개 인쇄</small></button><button class="action amber" onclick="go('inspect')"><span>✓ kg</span><strong>패키지 검수</strong><small>QR 패키지의 강종·중량·사진 확정</small></button></div><div class="stats"><div class="stat"><span>등록 패키지</span><b id="homePackages">0</b><small>공용</small></div><div class="stat"><span>확정 분류</span><b id="homeSplits">0</b><small>건</small></div><div class="stat"><span>QR 선택</span><b id="homeSelected">0</b><small>개</small></div><div class="stat"><span>서버 버전</span><b id="homeRevision">-</b><small>자동 동기화</small></div></div></section><section id="po" class="view"><p class="eyebrow">P.O 입력</p><h1>입고 패키지 등록</h1><div class="toolbar"><button class="tool" onclick="template()">엑셀 양식 다운로드</button><label class="file warn">엑셀 업로드<input type="file" accept=".xlsx,.xls" onchange="upload(this.files[0]);this.value=''" /></label><button class="tool primary" onclick="go('qr')">선택 QR 생성 화면</button></div><div class="card"><div class="form"><label>P.O 넘버<input id="poNo"></label><label>거래처명<input id="company"></label><label>강종명<input id="gradeName"></label><label>중량(kg)<input id="weightKg" type="number" inputmode="decimal"></label><button id="poSave" class="save" onclick="addPo()">확정 등록</button></div><div id="poMsg" class="msg"></div></div><div class="card"><div class="tableWrap"><table><thead><tr><th><input id="selectAll" type="checkbox" onchange="allCheck(this.checked)" style="width:22px;height:22px;margin:auto"></th><th>P.O</th><th>거래처</th><th>강종</th><th>패키지번호</th><th>중량</th><th>QR</th></tr></thead><tbody id="poRows"></tbody></table></div></div></section><section id="qr" class="view"><p class="eyebrow">QR 생성 전용 화면</p><h1>패키지 QR 생성·인쇄</h1><div class="toolbar"><button class="tool" onclick="allCheck(true);go('qr')">전체 선택</button><button class="tool" onclick="allCheck(false);go('qr')">선택 해제</button><button class="tool primary" onclick="printQr()">선택 QR A4 인쇄</button></div><div id="qrMsg" class="msg"></div><div id="qrGrid" class="qrgrid"></div></section><section id="inspect" class="view"><p class="eyebrow">패키지 검수</p><h1 id="inspectTitle">패키지를 선택하세요</h1><label>검수 패키지<select id="inspectPackage" onchange="choosePackage(this.value)"></select></label><div class="summary"><div><span>거래처</span><b id="iCompany">-</b></div><div><span>기존 강종</span><b id="iGrade">-</b></div><div><span>최초 중량</span><b id="iOriginal">0 kg</b></div><div><span>남은 중량</span><b id="iRemain">0 kg</b></div></div><div class="card"><label>최종 강종<input id="finalGrade"></label><label>확정 중량<input id="finalWeight" type="number" inputmode="decimal"></label><div class="photos"><label id="shapeBox" class="photo"><input id="shapePhoto" type="file" accept="image/*" capture="environment" onchange="this.parentElement.classList.add('done')">＋ 형상 사진 필수</label><label id="analyzerBox" class="photo"><input id="analyzerPhoto" type="file" accept="image/*" capture="environment" onchange="this.parentElement.classList.add('done')">＋ 분석기 사진 필수</label><label class="photo"><input id="anomalyPhoto" type="file" accept="image/*" capture="environment" onchange="this.parentElement.classList.add('done')">＋ 이상 사진 선택</label></div><label>메모<textarea id="inspectMemo"></textarea></label><div id="inspectMsg" class="msg"></div><button class="save" style="width:100%;margin-top:14px" onclick="saveInspection()">검수 확정 저장</button></div></section></main><nav class="bottom"><button id="n-home" class="on" onclick="go('home')">⌂<br>홈</button><button id="n-po" onclick="go('po')">P.O<br>등록</button><button id="n-qr" onclick="go('qr')">⌗<br>QR</button><button id="n-inspect" onclick="go('inspect')">✓<br>검수</button></nav><section id="labels" class="labels"></section><script>
'use strict';const API='https://orpeybiqikrdydkhsjjs.supabase.co',KEY='sb_publishable_TerLvPZo7e5_X91A-P4qlQ_DaqBly0Q',HEAD={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},LOCAL='scrap-app-backup-v3';let state={pos:[],splits:[],inputs:[]},revision=0,selected=new Set(),current='home',historyViews=[];const E=id=>document.getElementById(id),F=n=>Number(n).toLocaleString('ko-KR')+' kg',esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function message(id,t,err=false){E(id).textContent=t;E(id).className='msg on'+(err?' err':'')}function go(v,push=true){if(push&&current!==v)historyViews.push(current);document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));E(v).classList.add('on');document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('on'));E('n-'+v)?.classList.add('on');current=v;if(v==='qr')renderQr();if(v==='inspect')renderInspection();scrollTo(0,0)}function backView(){go(historyViews.pop()||'home',false)}function qrTarget(x){return location.origin+'/scrap/app.html?view=inspect&package='+encodeURIComponent(x.packageNo)}function qrUrl(x,size=240){return 'https://api.qrserver.com/v1/create-qr-code/?format=png&margin=8&size='+size+'x'+size+'&data='+encodeURIComponent(qrTarget(x))}async function loadServer(){E('server').textContent='● 서버 재연결 중';try{let r=await fetch(API+'/rest/v1/scrap_app_state?id=eq.main&select=payload,revision',{headers:HEAD,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let a=await r.json();if(!a.length)throw Error('자료행 없음');state={pos:[],splits:[],inputs:[],...a[0].payload};revision=a[0].revision;localStorage.setItem(LOCAL,JSON.stringify(state));E('server').textContent='● 공용 서버 연결됨';E('server').style.color='#8ff0b5';render()}catch(e){let backup=localStorage.getItem(LOCAL);if(backup)state={pos:[],splits:[],inputs:[],...JSON.parse(backup)};E('server').textContent='● 임시저장 사용 · 재연결';E('server').style.color='#ffd27a';message('poMsg','서버 연결 실패('+e.message+'). 기기에 임시 보관하며 상단 서버 버튼으로 재시도할 수 있습니다.',true);render()}}async function saveServer(){localStorage.setItem(LOCAL,JSON.stringify(state));let r=await fetch(API+'/rest/v1/scrap_app_state?id=eq.main&revision=eq.'+revision,{method:'PATCH',headers:{...HEAD,Prefer:'return=representation'},body:JSON.stringify({payload:state,revision:revision+1,updated_at:new Date().toISOString()})});if(!r.ok)throw Error('HTTP '+r.status);let a=await r.json();if(!a.length){await loadServer();throw Error('동시 저장 충돌. 최신 자료에서 다시 시도하세요.')}revision=a[0].revision;localStorage.setItem(LOCAL,JSON.stringify(state));render()}function nextNo(){let m=state.pos.reduce((a,x)=>Math.max(a,Number(String(x.packageNo||'').replace(/\D/g,''))||0),0);return 'P'+String(m+1).padStart(6,'0')}async function addPo(){let p=E('poNo').value.trim(),c=E('company').value.trim(),g=E('gradeName').value.trim(),w=Number(E('weightKg').value);if(!p||!c||!g||!w||w<=0)return message('poMsg','모든 항목을 정확히 입력하세요.',true);let x={id:crypto.randomUUID(),poNo:p,company:c,grade:g,packageNo:nextNo(),weight:w,status:'CONFIRMED',createdAt:new Date().toISOString()};state.pos.push(x);selected.add(x.id);try{await saveServer();['poNo','company','gradeName','weightKg'].forEach(id=>E(id).value='');message('poMsg',x.packageNo+' 등록 및 QR 생성 준비 완료')}catch(e){message('poMsg','서버 저장 실패: '+e.message,true)}render()}function template(){if(!window.XLSX)return message('poMsg','엑셀 기능을 불러오지 못했습니다. 인터넷 연결 후 다시 시도하세요.',true);let ws=XLSX.utils.json_to_sheet([{'P.O 넘버':'PO-2026-001','거래처명':'예시메탈','강종명':'SUS 304','중량(kg)':500}]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'P.O입력');XLSX.writeFile(wb,'신성스크랩_PO_업로드양식.xlsx')}async function upload(file){if(!file)return;if(!window.XLSX)return message('poMsg','엑셀 모듈 로딩 실패',true);try{let wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}),added=0;for(let r of rows){let p=String(r['P.O 넘버']||r['PO 넘버']||'').trim(),c=String(r['거래처명']||'').trim(),g=String(r['강종명']||'').trim(),w=Number(r['중량(kg)']||r['중량']);if(!p||!c||!g||!w)continue;let x={id:crypto.randomUUID(),poNo:p,company:c,grade:g,packageNo:nextNo(),weight:w,status:'CONFIRMED',createdAt:new Date().toISOString()};state.pos.push(x);selected.add(x.id);added++}if(!added)throw Error('필수 열을 확인하세요');await saveServer();message('poMsg',added+'개 패키지 업로드·QR 준비 완료');render()}catch(e){message('poMsg','업로드 오류: '+e.message,true)}}function check(id,on){on?selected.add(id):selected.delete(id);render()}function allCheck(on){selected.clear();if(on)state.pos.forEach(x=>selected.add(x.id));render()}function render(){state.pos=Array.isArray(state.pos)?state.pos:[];state.splits=Array.isArray(state.splits)?state.splits:[];E('homePackages').textContent=state.pos.length;E('homeSplits').textContent=state.splits.length;E('homeSelected').textContent=selected.size;E('homeRevision').textContent=revision||'-';E('poRows').innerHTML=state.pos.length?state.pos.map(x=>`<tr><td><input type="checkbox" ${selected.has(x.id)?'checked':''} onchange="check('${x.id}',this.checked)" style="width:22px;height:22px;margin:auto"></td><td class="left">${esc(x.poNo)}</td><td class="left">${esc(x.company)}</td><td class="left">${esc(x.grade)}</td><td class="pkg">${esc(x.packageNo)}</td><td>${F(x.weight)}</td><td><button class="mini" onclick="selected.add('${x.id}');go('qr')">QR 생성</button></td></tr>`).join(''):'<tr><td colspan="7" style="padding:32px">등록된 패키지가 없습니다.</td></tr>';E('selectAll').checked=state.pos.length>0&&selected.size===state.pos.length;renderInspection()}function renderQr(){let list=state.pos.filter(x=>selected.has(x.id));E('qrGrid').innerHTML=list.length?list.map(x=>`<article class="qrcard"><img src="${qrUrl(x)}" alt="${esc(x.packageNo)} QR" onerror="this.alt='QR 생성 실패';message('qrMsg','QR 서버 연결 실패. 인터넷 연결 후 다시 눌러주세요.',true)"><b>${esc(x.packageNo)}</b><span>${esc(x.company)}</span><span>${esc(x.grade)} · ${F(x.weight)}</span></article>`).join(''):'<div class="card">P.O 등록 화면에서 패키지를 선택한 뒤 QR 생성 버튼을 누르세요.</div>'}async function printQr(){let list=state.pos.filter(x=>selected.has(x.id));if(!list.length)return message('qrMsg','인쇄할 QR을 선택하세요.',true);E('labels').innerHTML=list.map(x=>`<article class="labelPrint"><img src="${qrUrl(x,300)}"><div class="labelText"><b class="co">${esc(x.company)}</b><span class="gr">${esc(x.grade)}</span><b class="pk">${esc(x.packageNo)}</b><span>P.O ${esc(x.poNo)} · ${F(x.weight)}</span></div></article>`).join('');let imgs=[...E('labels').querySelectorAll('img')];try{await Promise.race([Promise.all(imgs.map(i=>i.complete&&i.naturalWidth?Promise.resolve():new Promise((ok,no)=>{i.onload=ok;i.onerror=no}))),new Promise((_,no)=>setTimeout(()=>no(),12000))]);print()}catch{message('qrMsg','QR 이미지 생성 실패. 인터넷 연결 후 다시 시도하세요.',true)}}function renderInspection(){let s=E('inspectPackage'),old=s.value;s.innerHTML='<option value="">패키지 선택</option>'+state.pos.map(x=>`<option value="${esc(x.packageNo)}">${esc(x.packageNo)} · ${esc(x.company)}</option>`).join('');let q=new URLSearchParams(location.search).get('package');s.value=state.pos.some(x=>x.packageNo===(q||old))?(q||old):'';choosePackage(s.value,false)}function choosePackage(no,clear=true){let x=state.pos.find(p=>p.packageNo===no);E('inspectTitle').textContent=x?x.packageNo:'패키지를 선택하세요';E('iCompany').textContent=x?.company||'-';E('iGrade').textContent=x?.grade||'-';E('iOriginal').textContent=F(x?.weight||0);let used=state.splits.filter(s=>s.packageNo===no).reduce((a,b)=>a+Number(b.weight),0);E('iRemain').textContent=F((x?.weight||0)-used);if(x&&clear)E('finalGrade').value=x.grade}async function saveInspection(){let no=E('inspectPackage').value,x=state.pos.find(p=>p.packageNo===no),g=E('finalGrade').value.trim(),w=Number(E('finalWeight').value);if(!x)return message('inspectMsg','패키지를 선택하세요.',true);let used=state.splits.filter(s=>s.packageNo===no).reduce((a,b)=>a+Number(b.weight),0),remain=x.weight-used;if(!w||w>remain)return message('inspectMsg','입력 가능 잔량은 '+F(remain)+'입니다.',true);if(!E('shapePhoto').files[0]||!E('analyzerPhoto').files[0])return message('inspectMsg','형상 사진과 분석기 사진은 필수입니다.',true);state.splits.push({id:crypto.randomUUID(),packageNo:no,grade:g,weight:w,memo:E('inspectMemo').value,status:'CONFIRMED',createdAt:new Date().toISOString()});try{await saveServer();message('inspectMsg','검수 확정 완료');renderInspection()}catch(e){message('inspectMsg','저장 실패: '+e.message,true)}}window.addEventListener('error',e=>{let target=current==='qr'?'qrMsg':current==='inspect'?'inspectMsg':'poMsg';message(target,'화면 오류: '+e.message,true)});let params=new URLSearchParams(location.search);loadServer().then(()=>{let v=params.get('view');if(v&&E(v))go(v,false)});
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10231f"><title>신성 스크랩 공용 현장관리</title><style>:root{--ink:#10231f;--green:#0d725d;--lime:#d9f566;--amber:#f5b942;--bg:#f4f7f5;--line:#d8e2de;--muted:#687670}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;font-size:18px}button,input,select,textarea{font:inherit}.top{height:78px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px max(16px,calc((100% - 900px)/2))}.brand{display:flex;gap:12px;align-items:center}.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;background:var(--lime);color:var(--ink);font-weight:900}.brand b,.brand small{display:block}.brand small{font-size:12px;opacity:.7}.server{font-size:13px;padding:10px 13px;border-radius:30px;background:#ffffff18}.wrap{max-width:900px;margin:auto;padding:27px 15px 105px}.view{display:none}.view.on{display:block}.eyebrow{color:var(--green);font-size:14px;font-weight:900;margin:0}h1{font-size:clamp(30px,7vw,46px);margin:5px 0 24px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:15px}.action{border:0;border-radius:24px;min-height:180px;padding:25px;text-align:left;display:flex;flex-direction:column;font-weight:900}.action strong{font-size:28px;margin-top:auto}.action small{font-size:14px;margin-top:7px;font-weight:500}.green{background:var(--green);color:#fff}.amber{background:var(--amber)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:20px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px}.stat span,.stat b,.stat small{display:block}.stat span,.stat small{font-size:12px;color:var(--muted)}.stat b{font-size:30px;margin:7px 0}.back{border:0;background:none;color:var(--green);font-weight:900;padding:11px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:15px}.summary div{padding:16px;border-right:1px solid var(--line)}.summary div:last-child{background:#f2f9ce;border:0}.summary span,.summary b{display:block}.summary span{font-size:12px;color:var(--muted)}.summary b{font-size:20px;margin-top:6px}h2{font-size:21px;margin:0 0 15px}label{display:block;font-size:14px;font-weight:900;margin-top:15px}input,select,textarea{width:100%;min-height:60px;border:2px solid var(--line);border-radius:13px;padding:12px;background:#fff;margin-top:7px;font-size:20px}textarea{min-height:90px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.photo{min-height:110px;border:2px dashed #9baaa4;border-radius:14px;display:grid;place-items:center;text-align:center;padding:9px;font-size:13px}.photo input{display:none}.photo.done{border-style:solid;border-color:var(--green);background:#edf8f4}.wide{width:100%;min-height:65px;border:0;border-radius:15px;font-weight:900;margin-top:17px}.save{background:var(--lime)}.scan{background:var(--amber)}.msg{display:none;margin-top:14px;padding:14px;border-radius:11px;background:#fff1cc;color:#704b00;font-weight:900}.msg.on{display:block}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-top:1px solid var(--line)}.row small{grid-column:1/3;color:var(--muted)}.meter{background:var(--ink);color:#fff;border-radius:19px;padding:21px;display:grid;grid-template-columns:1fr 1fr;gap:13px}.meter span,.meter b{display:block}.meter span{font-size:12px;opacity:.7}.meter b{font-size:27px}.bar{grid-column:1/3;height:14px;background:#ffffff22;border-radius:20px;overflow:hidden}.bar i{height:100%;display:block;background:var(--lime)}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:#fff;min-height:72px;font-weight:900;color:var(--muted)}.nav button.on{color:var(--green)}@media(max-width:650px){.actions{grid-template-columns:1fr}.action{min-height:140px}.stats{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.summary div:last-child{grid-column:1/3}.photos{grid-template-columns:1fr}.photo{min-height:76px}.server{font-size:0}.server:after{content:'●';font-size:15px}}</style></head><body><header class="top"><div class="brand"><span class="logo">SS</span><span><b>신성 스크랩</b><small>공용 서버 현장관리</small></span></div><span class="server" id="server">● 서버 연결 중</span></header><main class="wrap"><section id="home" class="view on"><p class="eyebrow">모든 사용자 공용</p><h1>현장 작업을 선택하세요</h1><div class="actions"><button class="action green" onclick="show('inspect')"><span>⌗ QR</span><strong>패키지 검수</strong><small>강종·중량·사진을 서버에 확정합니다</small></button><button class="action amber" onclick="show('bag')"><span>▣ 500kg</span><strong>재포장 시작</strong><small>원 패키지를 출하 마대에 투입합니다</small></button></div><div class="stats"><div class="stat"><span>공용 분류</span><b id="splitCount">0</b><small>전 기기 동일</small></div><div class="stat"><span>확정 중량</span><b id="confirmed">0</b><small>kg</small></div><div class="stat"><span>마대 투입</span><b id="inputCount">0</b><small>건</small></div><div class="stat"><span>서버 버전</span><b id="revision">-</b><small>자동 동기화</small></div></div></section><section id="inspect" class="view"><button class="back" onclick="show('home')">← 현장 홈</button><p class="eyebrow">패키지 검수</p><h1>P000001</h1><div class="summary"><div><span>기존 강종</span><b>SUS 304</b></div><div><span>최초 중량</span><b>500 kg</b></div><div><span>남은 중량</span><b id="remain">500 kg</b></div></div><div class="card"><h2>새 분류 확정</h2><label>최종 강종<select id="grade"><option>SUS 304</option><option>SUS 316</option><option>SUS 430</option><option>AL 6061</option></select></label><label>확정 중량<input id="weight" type="number" inputmode="decimal" placeholder="kg"></label><div class="photos"><label class="photo" id="shapeBox"><input id="shape" type="file" accept="image/*" capture="environment" onchange="chosen('shapeBox')">＋ 형상 사진 (필수)</label><label class="photo" id="analyzerBox"><input id="analyzer" type="file" accept="image/*" capture="environment" onchange="chosen('analyzerBox')">＋ 분석기 결과 (필수)</label><label class="photo" id="anomalyBox"><input id="anomaly" type="file" accept="image/*" capture="environment" onchange="chosen('anomalyBox')">＋ 기타 이상 (선택)</label></div><label>메모<textarea id="memo" placeholder="간단한 이상 사항"></textarea></label><div id="msg" class="msg"></div><button id="saveSplit" class="wide save" onclick="addSplit()">사진 압축 후 서버에 확정</button></div><div class="card" style="margin-top:15px"><h2>공용 확정 내역</h2><div id="splitList"></div></div></section><section id="bag" class="view"><button class="back" onclick="show('home')">← 현장 홈</button><p class="eyebrow">출하 마대</p><h1>B000001</h1><div class="meter"><div><span>현재 중량</span><b id="bagNow">0 kg</b></div><div><span>남은 용량</span><b id="bagRemain">500 kg</b></div><div class="bar"><i id="bar"></i></div></div><button class="wide scan" onclick="source.focus()">⌗ 원 패키지 QR 스캔 / 입력</button><div class="card" style="margin-top:15px"><label>원 패키지 번호<input id="source" placeholder="예: P000001"></label><label>투입 강종<select id="bagGrade"><option>SUS 304</option><option>SUS 316</option><option>SUS 430</option></select></label><label>투입 중량<input id="bagInput" type="number" inputmode="decimal" placeholder="kg"></label><div id="bagMsg" class="msg"></div><button class="wide save" onclick="addInput()">공용 서버에 투입 저장</button><h2 style="margin-top:24px">공용 투입 기록</h2><div id="bagList"></div></div></section></main><nav class="nav"><button id="n-home" class="on" onclick="show('home')">⌂<br>홈</button><button id="n-inspect" onclick="show('inspect')">⌗<br>검수</button><button id="n-bag" onclick="show('bag')">▣<br>재포장</button></nav><script>
const URL='https://orpeybiqikrdydkhsjjs.supabase.co',KEY='sb_publishable_TerLvPZo7e5_X91A-P4qlQ_DaqBly0Q',H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},state={splits:[],inputs:[]};let rev=0;const fmt=n=>Number(n).toLocaleString('ko-KR')+' kg';function note(id,t){let e=document.getElementById(id);e.textContent=t;e.classList.add('on')}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));document.getElementById('n-'+id)?.classList.add('on');render()}function chosen(id){document.getElementById(id).classList.add('done')}async function load(){try{let r=await fetch(URL+'/rest/v1/scrap_app_state?id=eq.main&select=payload,revision',{headers:H});if(!r.ok)throw Error('서버 설치 SQL을 먼저 실행하세요');let rows=await r.json();if(!rows.length)throw Error('공용 데이터 행이 없습니다');Object.assign(state,rows[0].payload);rev=rows[0].revision;server.textContent='● 공용 서버 연결됨';server.style.color='#8ff0b5';render()}catch(e){server.textContent='● 서버 설정 필요';server.style.color='#ffd27a';note('msg',e.message);note('bagMsg',e.message)}}async function save(){let r=await fetch(URL+'/rest/v1/scrap_app_state?id=eq.main&revision=eq.'+rev,{method:'PATCH',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({payload:state,revision:rev+1,updated_at:new Date().toISOString()})});let rows=await r.json();if(!r.ok||!rows.length){await load();throw Error('다른 사용자가 먼저 저장했습니다. 최신 자료를 불러왔으니 다시 입력하세요.')}rev=rows[0].revision;render()}async function compress(file){let b=await createImageBitmap(file),s=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise((ok,no)=>c.toBlob(x=>x?ok(x):no(Error('사진 압축 실패')),'image/webp',.78))}async function upload(file,category,key){if(!file)return null;let blob=await compress(file),path=key+'/'+category+'-'+Date.now()+'.webp',r=await fetch(URL+'/storage/v1/object/scrap-photos/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'image/webp','x-upsert':'false'},body:blob});if(!r.ok)throw Error('사진 서버 업로드 실패');return URL+'/storage/v1/object/public/scrap-photos/'+path}async function addSplit(){let used=state.splits.reduce((a,b)=>a+Number(b.weight),0),w=Number(weight.value);if(!w||w>500-used)return note('msg','입력 가능 잔량은 '+fmt(500-used)+'입니다.');if(!shape.files[0]||!analyzer.files[0])return note('msg','형상 사진과 분석기 결과 사진은 필수입니다.');saveSplit.disabled=true;saveSplit.textContent='사진 압축·업로드 중…';try{let key='P000001-'+crypto.randomUUID(),p={shape:await upload(shape.files[0],'shape',key),analyzer:await upload(analyzer.files[0],'analyzer',key),anomaly:await upload(anomaly.files[0],'anomaly',key)};state.splits.push({id:key,grade:grade.value,weight:w,memo:memo.value,photos:p,actor:'공용 작업자',time:new Date().toLocaleString('ko-KR'),status:'CONFIRMED'});await save();weight.value='';memo.value='';note('msg','서버에 확정되었습니다. 모든 사용자가 같은 내역을 봅니다.')}catch(e){state.splits=state.splits.filter(x=>x.id!==key);note('msg',e.message)}finally{saveSplit.disabled=false;saveSplit.textContent='사진 압축 후 서버에 확정'}}async function addInput(){let w=Number(bagInput.value),used=state.inputs.reduce((a,b)=>a+Number(b.weight),0);if(!source.value.trim())return note('bagMsg','원 패키지 번호를 입력하세요.');if(!w||w>500-used)return note('bagMsg','마대 남은 용량은 '+fmt(500-used)+'입니다.');if(state.inputs.length&&state.inputs[0].grade!==bagGrade.value)return note('bagMsg','서로 다른 강종은 혼합할 수 없습니다.');let row={id:crypto.randomUUID(),source:source.value.trim(),grade:bagGrade.value,weight:w,time:new Date().toLocaleString('ko-KR')};state.inputs.push(row);try{await save();bagInput.value='';note('bagMsg','공용 서버에 투입 저장되었습니다.')}catch(e){state.inputs=state.inputs.filter(x=>x.id!==row.id);note('bagMsg',e.message)}}function render(){let used=state.splits.reduce((a,b)=>a+Number(b.weight),0),bu=state.inputs.reduce((a,b)=>a+Number(b.weight),0);splitCount.textContent=state.splits.length;confirmed.textContent=used.toLocaleString();inputCount.textContent=state.inputs.length;revision.textContent=rev||'-';remain.textContent=fmt(500-used);bagNow.textContent=fmt(bu);bagRemain.textContent=fmt(500-bu);bar.style.width=Math.min(100,bu/5)+'%';splitList.innerHTML=state.splits.length?state.splits.map(x=>`<div class="row"><b>✓ ${x.grade}</b><strong>${fmt(x.weight)}</strong><small>${x.time} · 확정 잠김</small></div>`).join(''):'<p style="color:var(--muted)">확정 내역이 없습니다.</p>';bagList.innerHTML=state.inputs.length?state.inputs.map(x=>`<div class="row"><b>${x.source} · ${x.grade}</b><strong>${fmt(x.weight)}</strong><small>${x.time}</small></div>`).join(''):'<p style="color:var(--muted)">투입 내역이 없습니다.</p>'}load();setInterval(load,30000);
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10231f"><title>패키지 검수 확정</title><style>:root{--ink:#10231f;--green:#0d725d;--lime:#d9f566;--bg:#f4f7f5;--line:#d8e2de;--muted:#687670}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif;font-size:18px}button,input,select,textarea{font:inherit}.top{background:var(--ink);color:#fff;min-height:75px;display:flex;align-items:center;justify-content:space-between;padding:10px max(14px,calc((100% - 780px)/2))}.server{font-size:12px}.wrap{max-width:780px;margin:auto;padding:18px 14px 80px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a,.nav button{min-height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:11px 14px;text-decoration:none;font-weight:900}.eyebrow{font-size:13px;color:var(--green);font-weight:900;margin:0}h1{font-size:clamp(31px,7vw,46px);margin:5px 0 20px}.summary{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:14px}.summary div{padding:14px;border-right:1px solid var(--line)}.summary div:last-child{background:#f0f8c9}.summary span,.summary b{display:block}.summary span{font-size:12px;color:var(--muted)}.summary b{font-size:19px;margin-top:5px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;margin-top:14px}label{font-size:13px;font-weight:900;display:block;margin-top:13px}input,select,textarea{width:100%;min-height:58px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:11px;margin-top:7px;font-size:19px}textarea{min-height:90px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.photo{min-height:95px;border:2px dashed #95a49e;border-radius:13px;display:grid;place-items:center;text-align:center;padding:8px}.photo input{display:none}.photo.done{border-style:solid;border-color:var(--green);background:#e8f7f0}.save{width:100%;min-height:64px;border:0;border-radius:14px;background:var(--lime);font-weight:900;margin-top:15px}.msg{display:none;padding:13px;border-radius:11px;background:#fff1cc;color:#704b00;font-weight:900;margin-top:13px}.msg.on{display:block}.row{display:grid;grid-template-columns:1fr auto;gap:9px;padding:13px 0;border-top:1px solid var(--line)}.row small{grid-column:1/3;color:var(--muted)}@media(max-width:650px){.summary{grid-template-columns:1fr 1fr}.photos{grid-template-columns:1fr}.server{font-size:0}.server:after{content:'●';font-size:15px}.nav>*{flex:1;text-align:center}}</style></head><body><header class="top"><div><b>패키지 검수 확정</b><br><small>사진 자동압축 · 공용서버 저장</small></div><span id="server" class="server">● 서버 연결 중</span></header><main class="wrap"><nav class="nav"><button onclick="history.length>1?history.back():location.href='index.html'">← 이전</button><a href="index.html">⌂ 현장 홈</a><a href="completed.html">✓ 검수완료</a><a href="scan-inspect.html">QR 재촬영</a></nav><p class="eyebrow">검수 패키지</p><h1 id="title">불러오는 중</h1><div class="summary"><div><span>거래처</span><b id="company">-</b></div><div><span>기존 강종</span><b id="originalGrade">-</b></div><div><span>최초 중량</span><b id="originalWeight">0 kg</b></div><div><span>남은 중량</span><b id="remaining">0 kg</b></div></div><section class="card"><label>최종 강종<input id="finalGrade"></label><label>확정 중량<input id="finalWeight" type="number" inputmode="decimal"></label><div class="photos"><label class="photo"><input id="shape" type="file" accept="image/*" capture="environment" onchange="done(this)">＋ 형상 사진<br>필수</label><label class="photo"><input id="analyzer" type="file" accept="image/*" capture="environment" onchange="done(this)">＋ 분석기 결과<br>필수</label><label class="photo"><input id="anomaly" type="file" accept="image/*" capture="environment" onchange="done(this)">＋ 기타 이상<br>선택</label></div><label>메모<textarea id="memo" placeholder="간단한 이상 사항"></textarea></label><div id="msg" class="msg"></div><button id="saveButton" class="save" onclick="saveInspection()">사진 업로드 후 검수 확정</button></section><section class="card"><h2>이 패키지 확정 내역</h2><div id="history"></div></section></main><script>
'use strict';const API='https://orpeybiqikrdydkhsjjs.supabase.co',KEY='sb_publishable_TerLvPZo7e5_X91A-P4qlQ_DaqBly0Q',H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};let state={pos:[],splits:[],inputs:[]},revision=0,pkg=null;const E=id=>document.getElementById(id),F=n=>Number(n).toLocaleString('ko-KR')+' kg',packageNo=new URLSearchParams(location.search).get('package');function note(t){E('msg').textContent=t;E('msg').classList.add('on')}function done(input){input.parentElement.classList.add('done')}async function load(){try{let r=await fetch(API+'/rest/v1/scrap_app_state?id=eq.main&select=payload,revision',{headers:H,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let a=await r.json();state={pos:[],splits:[],inputs:[],...a[0].payload};revision=a[0].revision;pkg=state.pos.find(x=>x.packageNo===packageNo);if(!pkg)throw Error((packageNo||'QR')+' 패키지가 등록되어 있지 않습니다');E('server').textContent='● 공용 서버 연결됨';E('server').style.color='#8ff0b5';E('finalGrade').value=pkg.grade;render()}catch(e){E('server').textContent='● 서버 연결 오류';E('server').style.color='#ffd27a';note(e.message)}}function render(){let list=state.splits.filter(x=>x.packageNo===pkg.packageNo),used=list.reduce((a,b)=>a+Number(b.weight),0),remain=pkg.weight-used;E('title').textContent=pkg.packageNo;E('company').textContent=pkg.company;E('originalGrade').textContent=pkg.grade;E('originalWeight').textContent=F(pkg.weight);E('remaining').textContent=F(remain);E('history').innerHTML=list.length?list.map(x=>`<div class="row"><b>${x.grade}</b><strong>${F(x.weight)}</strong><small>${new Date(x.createdAt).toLocaleString('ko-KR')} · 확정 잠김</small></div>`).join(''):'<p>확정 내역이 없습니다.</p>';if(remain===0){E('saveButton').disabled=true;E('saveButton').textContent='검수완료 · 남은 중량 0kg'}}async function compress(file){let b=await createImageBitmap(file),s=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise((ok,no)=>c.toBlob(x=>x?ok(x):no(Error('사진 압축 실패')),'image/webp',.78))}async function upload(file,category,key){if(!file)return null;let blob=await compress(file),path=key+'/'+category+'-'+Date.now()+'.webp',r=await fetch(API+'/storage/v1/object/scrap-photos/'+path,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'image/webp','x-upsert':'false'},body:blob});if(!r.ok)throw Error(category+' 사진 업로드 실패 HTTP '+r.status);return API+'/storage/v1/object/public/scrap-photos/'+path}async function saveInspection(){if(!pkg)return;let g=E('finalGrade').value.trim(),w=Number(E('finalWeight').value),list=state.splits.filter(x=>x.packageNo===pkg.packageNo),remain=pkg.weight-list.reduce((a,b)=>a+Number(b.weight),0);if(!g||!w||w<=0||w>remain)return note('입력 가능 잔량은 '+F(remain)+'입니다.');if(!E('shape').files[0]||!E('analyzer').files[0])return note('형상 사진과 분석기 결과 사진은 필수입니다.');E('saveButton').disabled=true;E('saveButton').textContent='사진 압축·업로드 중…';let id=crypto.randomUUID();try{let photos={shape:await upload(E('shape').files[0],'shape',id),analyzer:await upload(E('analyzer').files[0],'analyzer',id),anomaly:await upload(E('anomaly').files[0],'anomaly',id)};let row={id,packageNo:pkg.packageNo,grade:g,weight:w,memo:E('memo').value,photos,status:'CONFIRMED',createdAt:new Date().toISOString()};state.splits.push(row);let nextRevision=revision+1,r=await fetch(API+'/rest/v1/scrap_app_state?id=eq.main&revision=eq.'+revision,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({payload:state,revision:nextRevision,updated_at:new Date().toISOString()})});if(!r.ok){let detail=await r.text();throw Error('검수자료 저장 HTTP '+r.status+' '+detail.slice(0,180))}revision=nextRevision;E('finalWeight').value='';E('memo').value='';note(pkg.weight-state.splits.filter(x=>x.packageNo===pkg.packageNo).reduce((a,b)=>a+Number(b.weight),0)===0?'검수완료 처리되었습니다.':'분류 확정 완료');render()}catch(e){state.splits=state.splits.filter(x=>x.id!==id);note(e.message)}finally{E('saveButton').disabled=false;if(E('remaining').textContent!=='0 kg')E('saveButton').textContent='사진 업로드 후 검수 확정'}}load();
</script></body></html>
